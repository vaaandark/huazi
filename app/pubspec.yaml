name: huazi
description: "离线中文书法练习工具：碑帖、字形、字帖"
publish_to: 'none'
version: 0.6.0+7

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  sqlite3: ^2.9.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_svg: ^2.0.17
  pdf: ^3.13.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  web: ^1.1.2
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/db/huazi.sqlite
    - assets/thumbs/
    - assets/fonts/
  fonts:
    - family: WenKai
      fonts:
        - asset: assets/fonts/wenkai.ttf
    - family: XingShu
      fonts:
        - asset: assets/fonts/xingshu.ttf

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#B2412E"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#FAF7F0"
    theme_color: "#B2412E"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
