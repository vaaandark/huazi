name: huazi
description: "离线中文书法练习工具：碑帖、字形、字帖"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  sqlite3: ^2.9.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/db/huazi.sqlite
    - assets/thumbs/
    - assets/fonts/
  fonts:
    - family: WenKai
      fonts:
        - asset: assets/fonts/wenkai.ttf
    - family: XingKai
      fonts:
        - asset: assets/fonts/xingkai.ttf
