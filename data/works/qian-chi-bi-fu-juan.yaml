description: "《赤壁赋》（前赤壁赋）是北宋文学家苏轼的一篇赋。写于宋元丰五年作者首次游览黄州城外赤鼻矶时，记述所观所感。次年苏轼亲笔为友人傅尧俞书写此《前赤壁赋》卷，行楷书，结字矮扁而紧密，笔墨丰润沉厚，是其中年时期少见的用意之作。此卷现藏于台北故宫博物院。\
  \ \n 宋元丰二年（1079），苏轼因 “乌台诗案”，被宋神宗贬谪到黄州（今湖北黄冈）。元丰五年（1082）苏轼先后两次游览了黄州附近的赤壁，写下两篇赤壁赋。《前赤壁赋》写于作者首次游览黄州赤壁时（七月十六）。作品描写的是苏轼与友人泛舟黄州赤壁（又名赤鼻矶\
  \ [ 1 ] 非赤壁之战发生地赤壁市 \n （非赤壁之战发生地赤壁市） ），谈论赤壁之战，进而讨论至天地人生，表达作者对宇宙及人生的感悟。同年十月重游，又写了一篇《后赤壁赋》，两文后世传诵不绝，是文学史上的杰作。\
  \ \n 本卷为完稿后一年苏轼（作者时年四十八岁）为友人傅尧俞书写。这篇《前赤壁赋》，行楷书，结字矮扁而紧密，笔墨丰润沉厚，是其中年时期少见的用意之作。书卷在流传过程中，书段稍有缺损，起首三十六字是明代文徵明、文彭父子后来补书。\
  \ \n 书卷主体可分为三个部分 \n 第一部分：文徵明补书三十六字（实为其子文彭代笔） \n 赤壁賦 \n 壬戌之秋，七月既望，蘇子與客泛舟游于赤壁之下。清風徐來，水波不興。 舉酒屬客 ，誦明月之詩。\
  \ \n 第二部分：苏轼亲笔书写赤壁赋文 \n 舉酒屬客， 誦明月之 詩，歌窈窕之章。少焉，月出於東山之上，徘徊於斗牛之間。白露橫江，水光接天。縱一葦之所如，陵萬頃之茫然。浩浩乎如憑虛御風，而不知其所止；飄飄乎如遺世獨立，羽化而登僊。\
  \ 於是飲酒樂甚，扣舷而歌之。歌曰：「桂棹兮蘭槳，擊空明兮溯流光。渺渺兮於懷，望美人兮天一方。」客有吹洞蕭者，倚歌而和之，其聲嗚嗚然；如怨如慕，如泣如訴；餘音嫋嫋，不絕如縷；舞幽壑之潛蛟，泣孤舟之嫠婦。蘇子愀然，正襟危坐，而問客曰：「何為其然也？」客曰：「月明星稀，烏鵲南飛。此非曹孟德之詩乎？西望夏口，東望武昌。山川相繆，鬱乎蒼蒼；此非孟德之困於周郎者乎？方其破荊州，下江陵，順流而東也，舳艫千里，旌旗蔽空。釃酒臨江，橫槊賦詩，固一世之雄也，而今安在哉？況吾與子漁樵於江渚之上，侶魚蝦而友糜鹿；駕一葉之扁舟，舉匏罇以相屬。寄蜉蝣於天地，渺浮海之一粟。哀吾生之須臾，羨長江之無窮。挾飛仙以遨游，抱明月而長終。知不可乎驟得，託遺響於悲風。」蘇子曰：「客亦知夫水與月乎？逝者如斯，而未嘗往也；贏虛者如彼，而卒莫消長也，蓋將自其變者而觀之，則天地曾不能以一瞬；自其不變者而觀之，則物與我皆無盡也，而又何羨乎？且夫天地之間，物各有主，苟非吾之所有，雖一毫而莫取。惟江上之清風，與山間之明月，耳得之而為聲，目遇之而成色，取之無禁，用之不竭，是造物者之無盡藏也，而吾與子之所共食。」客喜而笑，洗盞更\
  \ 平 酌。肴核既盡，杯盤狼籍，相與枕藉乎舟中，不知東方之既白。 \n 第三部分：作者自识书写此篇给友人的缘由 \n 軾去歲作此賦，未嘗輕出以示人，見者蓋一二人而已。欽之有使至求近文。遂親書以寄。多難畏事。欽之愛我，必深藏之不出也。又有後赤壁賦，筆倦未能寫，當俟後信。軾白。\
  \ \n 书卷引首由两张金栗山藏经纸拼接 \n 浙江海盐西南有金粟山，山下有金粟寺。寺中曾藏北宋时的大藏经数千件，其每幅纸背上均钤有 “ 金粟山藏经纸 ” 朱文印，以此得名。此纸初以麻料制成，质地较厚，无纹理，内外皆蜡，有米黄色、白色、虎豹皮花纹等。有的已被写过字，有的虽未写字，但因是从经册后背揭下来的衬纸，其上往往还有书写原经册时渗透的墨痕，所以从正面看上去，还有反面字的痕迹。金粟山藏经纸后来逐渐流入民间，被用于写字作画或装裱手卷引首。\
  \ \n 卷后有跋二则 \n 文徵明 跋 \n 右東坡先生親書赤壁賦。前缺三行。謹按蘇滄浪補自序之例。輒亦完之。夫滄浪之書。不下素師。而有極媿糠粃之謙。徵明於東坡無能為役。而亦點污其前。媿罪又當何如哉。嘉靖戊午至日。後學文徵明題。時年八十又九\
  \ \n 董其昌 跋 \n 東坡先生此賦。楚騷之一變。此書。蘭亭之一變也。宋人文字俱以此為極則。與參參知。所藏名迹雖多。知無能逾是矣。萬曆辛丑攜至靈巖村觀。因題。董其昌 \n 卷末为作者自识。为避免再次因诗文招惹罪名，苏轼特别叮咛好友傅尧俞小心收藏，并且提到后赤壁赋必须留待来日再写寄。\
  \ \n苏轼（1037 年—1101 年）于宋仁宗景祐三年 十二月十九 （1037 年 1 月 8 日）出生于眉州眉山，北宋时著名的文学家、政治家、艺术家。字子瞻，一字和仲，号东坡居士、铁冠道人。世称苏东坡、苏仙、坡仙。宋嘉佑二年进士，累官至端明殿学士兼翰林学士、吏部尚书、兵部尚书、礼部尚书。南宋理学方炽时，加赐谥号文忠，复追赠太师。\
  \ \n 傅尧俞 （1024～1091）北宋官员。原名胜二，字钦之，本郸州须城（今山东东平）人，徙居孟州济源（今属河南）。未及二十岁即举进士，入仕初由县官渐至殿中侍、御史、右司谏，因反对新法被贬，一度削职为民，宋哲宗朝，官拜给事中御史中丞、吏部尚书兼侍讲等。元祐四年至六年，官拜中书侍郎。为官三十载，为仁宗、英宗、神宗、哲宗四朝重臣。司马光赞之：“清、直、勇三德，人所难兼，吾於钦之见焉。”"
