summary: 《行穰帖》是东晋王羲之的草书作品。此帖仅两行十五字「足下行穰九，人還示應決不？大都當任。」它应该是王羲之写给朋友的一个书札片段。原迹已失传，现存唐代双钩填墨本，经宋徽宗、明代董其昌友人吴廷所藏，后归清内府，清末流出后归张大千藏。此内含唐代双钩填墨本、摹唐双钩填墨本两种。
description: "《行穰帖》是东晋王羲之的草书作品。此帖仅两行十五字「足下行穰九，人還，示應决不？大都當任。」它应该是王羲之写给朋友的一个书札片段。原迹已失传，现存唐代双钩填墨本，经宋徽宗、明代董其昌友人吴廷所藏，后归清内府，清末流出后归张大千藏。此内含唐代双钩填墨本、摹唐双钩填墨本两种。\
  \ \n 王羲之《行 xíng 穰 ráng 帖》，原迹已失传。据唐代张彦远编著的《 法书要录 》卷十《右军书记》(张怀瓘著) 记载（ 此书页 ） \n 足下行穰久，人還，竟應快不？大都當任縣，量宜，其令\
  \ （闕二字） 因便任耳。立俟。王羲之白 \n 相比较，《行穰帖》双钩填墨本，仅是唐内府本《行穰帖》著文的片段。此帖"
transcription: "如下 \n 足下行穰九，人還，示應决不？大都當任。 \n 大意（不确定，仅供参考） \n 你在那个地方待了很久，人也已经回来了，应该做出决定了吧？总的来说，你应该去那里任职。\
  \ \n 此帖仅仅两行，却大小错落有致。起笔「足、下」两字小而轻灵，但「行、穰」两字大而壮，且两字相引带。「九、人、還」三字紧密，且「人」字的反捺盖住了「還」字，使得第一行显得前后松，中间大。第二行除了「都、當」两字相连外，都是字字独立，变化较小，但是行气贯通，与前一行也甚为协调\
  \ [ 1 ] 冯勇 读《行穰帖》 \n （冯勇 读《行穰帖》） 。 \n 唐代双钩填墨本 摹唐双钩填墨本 \n 此唐代双钩填墨本有北宋徽宗金泥题签和宣和之印，之后曾为明代吴廷（董其昌友人）所藏，董其昌酷爱此帖，有多处题跋。并说\
  \ “ 此卷在处，当有吉祥云覆之，但肉眼不见耳。 ” 到清代此帖由安岐所藏，后归清内府，乾隆帝有题跋题诗及鉴赏印。清末《行穰帖》流落到民间，被张大千购买收藏。后来张大千去日本曾携此卷并一时存放于书法家西川宁处。曾在日本便利堂制作了珂罗版复制品。后此帖辗转传入美国，被普林斯顿大学博物馆收藏。\
  \ \n 题签： 御題晉王右軍行穰帖、王羲之行穰帖真蹟、神品、内府秘寶 \n 清高宗（乾隆）题辞/跋文： \n 龍跳天門，虎臥鳳閣 \n 東坡詩所云。兩行十二字者。本題大令書。董香光以題右軍行穰帖後。當緣未覩大令真蹟。而右軍此帖。字數相近。遂謂足以當之。然其辭亦致疑焉。而未遽為定論也。近復得大令送梨帖。亦有香光所書蘇詩。當在題此卷之後。惜不得其歲月證之。乾隆戊辰仲夏御題\
  \ \n 董其昌"
