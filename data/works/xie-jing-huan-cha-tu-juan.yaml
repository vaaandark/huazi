summary: 此《写经换茶图》卷由明代仇英作画，文徵明写经。画卷内容为元代画家赵孟頫嗜茶，用写心经与老友中峰明本禅师换茶的故事。此书画合璧卷是应昆山收藏家周于舜，据写《心经》换茶诗的诗意所作。仇英作画，文徵明写《摩诃般若波罗密多心经》。此卷现藏于克利夫兰艺术博物馆。
description: "此《写经换茶图》卷由明代仇英作画，文徵明写经。画卷内容为元代画家赵孟頫嗜茶，用写心经与老友中峰明本禅师换茶的故事。此书画合璧卷是应昆山收藏家周于舜，据写《心经》换茶诗的诗意所作。仇英作画，文徵明写《摩诃般若波罗密多心经》。此卷现藏于克利夫兰艺术博物馆。\
  \ \n 此卷主要有两个部分：仇英的《赵孟頫写经换茶图》与文徵明书写的《心经》。画卷描绘：画面松林、竹篱，赵孟頫据石几作书，中峰明本禅师对坐，就是写经换茶的故事。图之右前方为赵孟頫在松林树下据石几写字，似乎才将纸摊开，正待作书。石几前坐有一僧，面向画纸，即是题识上所说的\
  \ “恭上人”，正是中峰明本禅师。而赵孟頫则侧身看着右前方的侍童，手上捧着一物，似为茶包，正走向赵孟頫。图中间松林较远处有一侍童，正蹲着煮水。图之左侧更远处有一侍童，手捧着一物正向这里走来，侍童的身后有两只喜鹊正在圆台上觅食。此卷画法用笔细润，晕染淡秀，人物得李公麟之遗意，设色有赵孟頫影响。\
  \ \n 写经换茶这个典故在元代时候就很有名，有很多人在歌咏。但是，传到明代以后，人们只能看到歌咏这个故事的元诗，却早就不见了赵孟頫手抄的经文。据作品后面文徵明之子文彭、文嘉的题识我们可以知道此幅作品是明代收藏家周于舜托仇英依赵孟頫\
  \ “写《心经》换茶诗” 的诗意而作，同时并请文徵明在画卷后以小楷书写《心经》以代赵孟頫换茶而作的《心经》。（介绍 参考 ） \n 文徵明书《摩诃般若波罗蜜多心经》 \n 摩訶般若波羅蜜多心經 \n\
  \ 觀自在菩薩，行深般若波羅蜜多時。照見五藴皆空，度一切苦厄。舍利子，色不異空，空不異色，色即是空，空即是色，受想行識，亦復如是。舍利子，是諸法空相，不生不滅，不垢不净，不增不减。是故空中無色，無受相行識，無眼耳鼻舌身意，無色聲香味觸法，無眼界，乃至無意識界。無無明，亦無無明盡，乃至無老死，亦無老死盡。無苦寂滅道，無智亦無得。以無所得故，菩提薩埵，依般若波羅蜜多故，心無罣礙，無罣礙故，無有恐怖，遠離顛倒夢想，究竟涅槃。三世諸佛，依般若波羅蜜多故，得阿耨多羅三藐三菩提。故知般若波羅蜜多，是大神咒，是大明咒，是無上咒，是無等等咒，能除一切苦，真實不虚。故説般若波羅蜜多咒，即説咒曰：揭諦揭諦，波羅揭諦，波羅僧揭諦，菩提薩婆訶。\
  \ \n 嘉靖二十一年歲在壬寅九月廿又一日書于崑山舟中。徵明。 \n 文彭题跋、文嘉的识语、王世懋题跋、费念慈跋 \n 请 在线浏览 超清图（可自由缩放） \n 《摩诃般若波罗蜜多心经》书于金粟笺本上。此卷曾经明周凤来、王世懋、清宋荦、乾隆内府、费念慈及翁万戈递藏。\
  \ \n 文徵明 （1470.11.28－1559.3.28），原名壁（或作璧），字徵明，四十二岁起，以字行，更字徵仲。因先世为衡山人，故号衡山居士，世称 “文衡山” 。因官至翰林待诏，私谥贞献先生，故称\
  \ “文待诏” 、 “文贞献” 。南直隶苏州府长洲县（今江苏苏州）人。明代杰出画家、书法家、文学家。 \n 赵孟頫 ，字子昂，号松雪道人，别号鸥波、水精宫道人等。中国吴兴人。元代官员，书画家。其妻为元朝画家、诗人管道昇。元朝画家王蒙之外祖父。赵孟\U0002B5AF\
  为宋室后代，后选择与元朝合作，并受到皇帝宠爱，“荣际五朝，名满四海”，官至翰林学士，艺术上成为了元代文人画、书法的领袖人物 \n 明本禅师 （1263 年－1323 年），元朝僧人。俗姓孙，号中峰，法号智觉，西天目山住持，钱塘新城（今杭州市富阳区新登镇）人。明本从小喜欢佛事，稍通文墨就诵经不止，常伴灯诵到深夜。\
  \ 24 岁赴天目山，受道于禅宗寺，白天劳作，夜晚孜孜不倦诵经学道，遂成高僧。仁宗曾赐号 “广慧禅师”，并赐谥 “普应国师” 。憩止处曰幻住山房。 \n 仇英 ，字实父，号十洲，中国明代画家，原籍江苏太仓，后移居苏州。生年不详，考订约生于弘治甲寅，卒于嘉靖壬子秋冬之际。吴门四家之一。\
  \ \n 绘制信息 明嘉靖时期仇英画换茶图、文徵明书心经合璧"
