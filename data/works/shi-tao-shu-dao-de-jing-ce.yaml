  翁方綱題籤（前副页一）：石濤書道德經 \n晉康跋（前副页一）：兄晉康題、黃彭年跋 \n翁方綱跋（前副页二）：戊午四月方綱題 \n 翁方綱跋（正文前）：方綱記、翁方綱跋（正文后）：覃溪方綱 \n 伊秉綬跋（后副页一）：嘉慶戊午仲冬從北平先生借觀。寧化伊秉綬呵凍記\
  \ \n葉志詵跋（后副页一）：嘉慶乙亥十月葉志詵借看一過 \n 翁方綱跋（后副页一）：戊午正月方綱 \n楊繼振跋三則（后副页二）：半緣道人震又記于星鳳堂南榮下、又雲記、震幼雲父 \n跋文两则（后副页三）\
  \ \n 程齡孫跋（附纸）：皛父誌"
