id: shi-tao-shu-dao-de-jing-ce
title: 石涛书道德经册
aliases: []
author: 石涛
dynasty: 明
script: kai
carrier: moji
holder: 台北故宫博物院
summary: 此《道德经》册由明末清初石涛书。全册共二十六开（正文二十开），正文以精笔小楷书就，凡五千余字。其书笔致从容，章法若有节奏，体势似法非法，意境清新冷逸，颇具魏晋人风致。前附罗聘临石涛种松图，翁方纲题跋五则。此册为翁方纲（苏斋）旧藏，现藏于台北故宫博物院。
description: "此《道德经》册由明末清初石涛书。全册共二十六开（正文二十开），正文以精笔小楷书就，凡五千余字。其书笔致从容，章法若有节奏，体势似法非法，意境清新冷逸，颇具魏晋人风致。前附罗聘临石涛种松图，翁方纲题跋五则。此册为翁方纲（苏斋）旧藏，现藏于台北故宫博物院。\
  \ \n 石涛晚年出佛入道，道家思想对其绘画理论影响深远。在书画上他主张 “我用我法”，“我用我法”，“画者从于心”，山水、人物、竹石及书法都能从古法中创造新的面貌。 相传王羲之以所书老子道德经与山阴道士换鹅，另三国魏书家钟繇也有书道德经。\
  \ \n 前后题跋 \n 翁方綱 題籤（前副页一） \n 石濤書道德經 \n 晉康 題（前副页一） \n 石濤書道德經蘇齋藏本。幼雲十一弟大人屬。兄晉康題 \n 黃彭年 題（前副页一） \n 石濤種松圖卷先君得之秦中。逾十七年。國瑾復得此冊於燕市。豐城劍氣會合有時。書志快異。黃彭年\
  \ \n 翁方綱 跋（前副页二） \n 猿子相隨學種松。雙幢入定是何峯。五千言誦瀾翻熟。雲送前灣過水鐘。石濤自畫種松圖。甲寅冬（西元一七九四年）自題於昭亭雙幢下。兩峯為摹於濤書老子冊前。戊午四月方綱題\
  \ \n 翁方綱 跋（正文前） \n 乙卯正月十七日。於魚山寓齋觀石濤和尚寫竹二竿。竿僅濶二寸許。而一筆自下直上。真有月落空庭千萬丈之勢。方綱記 \n 大上玄元道德經 （正文不录）：上篇、下篇 \n\
  \ 翁方綱 跋（正文后） \n 釋道濟字石濤。號清湘老人。一云清湘陳人。又號大滌子。又自號苦瓜和尚。又號膏肓子。瞎尊者。畫兼善山水蘭竹。筆意縱恣。脫盡窠臼。晚遊江淮。人爭重之。今維揚遺迹尤多云。天都洪石農上舍以其小楷道德經見贈。因識其後。癸卯六月廿五日。覃溪方綱\
  \ \n 伊秉綬 跋（后副页一） \n 石濤號清湘老人。陳人。外又云清湘遺人。乃勝朝楚藩。後曾見其畫著款如此。嘉慶戊午仲冬從北平先生借觀。寧化伊秉綬呵凍記 \n 葉志詵 跋（后副页一） \n 嘉慶乙亥十月葉志詵借看一過\
  \ \n 翁方綱 跋 春风瑶草琴东信笺纸 （后副页一） \n 老濟圓輪偈。飛來倒薤書。五千言注腳。三十幅權輿。我為摹遺帖。誰知繪造車。空庭千萬丈。月照轉蓬初。嘗見石濤寫竹一竿。自下直起。長三丈許。頤園屬題石濤造車圖。適檢笥中石濤書老子帖。臨寫卷內題此。戊午正月。方綱\
  \ \n 楊繼振 跋三則 春风瑶草琴东信笺纸 （后副页二） \n 濟公之寫此經。未審所據何本。章句多寡。文字異同。率與世本不合。秋淨務閒。日坐寓生庵。取歸文震川。震孟定本。檢閱二三頁。分章命句。所見各歧。震學道日淺。不敢強為論斷。俟善知識。昔憨山大師嘗為此經作注。人稱其意識廣大。蓋以釋注經。前所未有。今獲濟公。憨山轉刼已。半緣道人震又記于星鳳堂南榮下。\
  \ \n 昨閱江邨消夏錄。見有趙文敏小楷道德經。巨若指頂。都一百九十三行。真令人興蜀隴之思。又雲記 \n 辛酉六月十又三日。碑估持眎此冊。并舊蛻碧玉十三行。宋蛻群玉帖二卷。予與少峯九兄坐南園來鷗亭。極力料理。伊居奇不輕就。傍皇之際。動止失常。四兄春宇。倚隱囊。捉紈素。神志翛肰。更用庾語揶揄之。予卒卒不暇顧問。翌午觸暑。遠赴宣南。破慳求之。仍不就緒。歸涂鬱鬱。殆甚下第。書畫之移人有如此。乃不逾時。竟獲次第落予篋衍。夜窓蕭雨竹語清折。發袱細貦。覺揚州鸐宛在人間世。清福若斯。實始顧之所不及。書此用識吾快。震幼雲父\
  \ \n 跋二則（后副页三） \n 小乘客清湘枝下人。元濟。見山水冊。石濤自號見諸卷軸者更有道濟。 （旁註。見山水冊） 。若極零丁老人各稱。 （旁註。見梅花菜莢卷） 。予生也淺。少見寡聞。當別求多識者。癸卯。高宗之四十八年。是年八月公充順天鄉試副考官。是年在司經局洗馬任。乙卯。高宗六十年。是年二月降補內閣侍讀學士。戊午。仁宗之三年。是年仍學士任。乙亥。仁宗之廿年。是年八月樹崑卒。後三年戊寅公卒\
  \ \n 道德經。後 （點去） 前寫寫經圖一帋。十三行前寫洛川圖一帋。黃庭經前寫換鵞圖一帋。溪石圖補一帋。後赤壁補一圖。承壽雙碑館圖。群鵞帖前換鵝圖一帋 \n 程齡孫 跋 遂吾庐隶书双钩信笺 （附纸）\
  \ \n 藏清湘老人畫最多。而亦最嗜者也。每欲得其字冊。歷時久未得。今於庚申冬而此字冊入余篋中。良可喜也。且此冊以王褚筆法書（點去）一氣呵成。誠為清湘字冊中第一品也。閱之不可釋手。而另誌數語。作為深愛者也。皛父誌\
  \ \n 经文前附： 羅聘臨石濤種松圖 \n 羅聘臨石濤種松圖 使用 AI 根据书中插图生成，仅供参考 \n 原始图 羅聘臨石濤種松圖 \n 上一页 下一页 1 2 \n 石涛（1642-1707）原名朱若极，广西桂林人，明靖江王后裔。字石涛，别号济山僧、小乘客、清湘老人、苦瓜和尚、瞎尊者、大涤子等。他出生不久即遭遇国变和家变，遂由家臣护送逃至全州避祸，后在当地湘山寺出家为僧，法名原济（其款印中也有作\
  \ “元济”）。从此，石涛开始云游四方，足迹遍布湖广、苏浙皖等地，饱览名山大川，广交各方朋友，以禅宗悟画理，以自然养画境，于当时画坛盛行的摹古风气之外，独开生面，令人耳目一新，遂使艺名日隆。石涛曾因两次迎驾康熙南巡，而于康熙二十九年受邀北上北京，以期拓展自己的艺术空间；但居京不到三年便南还，再次游历苏、皖各地，并逐渐公开了自己明宗室的身份；晚年回到扬州定居，建大涤草堂，出佛入道，靠卖画为生。\
  \ \n 罗聘。字遁夫，号两峰，又号花之寺僧、衣云、衣云道人、衣云和尚、金牛山人、蓼洲渔父、师莲老人、人日生人、老铁、阿喜、喜道人、竹叟、却尘居士等，祖籍安徽歙县，后移居江苏甘泉，清代画家。扬州八怪之一。\
  \ \n 封面（杨继振题签）： 道德經 （隸書） 蘇齋珍賞法書名蹟，逸品。辛酉七月下浣一日，又一蘇齋鑒藏。試晉永和研文源閣御香劑 \n杨继振（1832-1897）清末藏书家。字彦起，一字幼云，一作又云，号莲公、燕南学人、苏斋学人、星风堂主人、齐轩道人等。汉军镶黄旗人。官至工部侍郎、广东盐运同知，居于江苏阳湖。收藏甚富，主要是金石和图书。辟有\
  \ “石筝馆” 、 “苏斋” 、 “雪蕉馆” 、 “星风堂” 等。 \n 《 道德经 》春秋时期老子所著的哲学作品，又称《德道经》《道德真经》《老子》《五千言》《老子五千文》，是中国古代先秦诸子分家前的一部著作，是道家哲学思想的重要来源。现通行本，是以王弼所注，字数为\
  \ 5162 字。 \n 绘制信息 明末清初写本"
