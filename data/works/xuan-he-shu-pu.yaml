id: xuan-he-shu-pu
title: 宣和书谱
aliases: []
author: 毛晋
dynasty: 明
script: xing
carrier: moji
holder: 凤凰集团
summary: 此《宣和书谱》是北宋徽宗宣和年间奉敕编纂的一部记录宫廷所藏名家书法墨迹的谱录著作。全书共二十卷，依帝王及各类书体分门别类，共收录历代书家一百九十七人，作品一千三百四十四件。每类前附有叙论，考证其渊源；书家名下附载小传与艺术品评。此为明崇祯时期毛氏汲古阁刊津逮秘书本。
description: "此《宣和书谱》是北宋徽宗宣和年间奉敕编纂的一部记录宫廷所藏名家书法墨迹的谱录著作。全书共二十卷，依帝王及各类书体分门别类，共收录历代书家一百九十七人，作品一千三百四十四件。每类前附有叙论，考证其渊源；书家名下附载小传与艺术品评。此为明崇祯时期毛氏汲古阁刊津逮秘书本。\
  \ \n 《宣和书谱》在宋代并未刊行，元初江南民间有传抄本流传。元大德六年（公元 1303 年）延陵吴文贵根据众多版本汇编会同其好友参校后付梓。明嘉靖杨升庵亦有刊本、明末有《津逮秘书》本。在《津逮秘书》的体例中，《宣和书谱》被收录于\
  \ 第六集 ，与《法书要录》、《东观馀论》、《广川书跋》等历代著名的书法理论、金石文献编排在一起，形成了系统的艺术文献序列。与之姊妹篇的《 宣和画谱 》则被收录在第七集。 \n 其书首列诸帝王书一卷，以下依次为篆书、隶书一卷，正书四卷，行书六卷，草书七卷，分书一卷（并附诏制诰命）。每种书体前都有叙论，叙述各种书体的渊源、发展情况；次为书法家小传，记载作者生平，遗文轶事，次及评论其书法的特点、优劣；最后列御府所藏的作品目录。\
  \ \n 总目 \n 卷一：历代诸帝王书 \n卷二：篆书、隶书 \n卷三：正书一 \n卷四：正书二 \n卷五：正书三 \n卷六：正书四 \n卷七：行书一 \n卷八：行书二 \n卷九：行书三 \n卷十：行书四\
  \ \n卷十一：行书五 \n卷十二：行书六 \n卷十三：草书一 \n卷十四：草书二 \n卷十五：草书三 \n卷十六：草书四 \n卷十七：草书五 \n卷十八：草书六 \n卷十九：草书七 \n卷二十：八分书、制诏告命\
  \ \n 卷前题： 明海虞毛晉訂 \n 宣和 （1119 年二月-1125 年）是宋徽宗的第六个年号，也是最后一个年号。北宋使用宣和这个年号一共 7 年，由于当时改元仓促，就用宣和殿中的 “宣和” 两字作为年号。\
  \ \n 宋徽宗 赵佶 （1082 年 11 月 2 日－1135 年），北宋第八位皇帝，1100 年 2 月 23 日－1126 年 1 月 18 日在位，自称教主道君皇帝，同时也是画家、书法家、诗人、词人和收藏家，擅长古琴、蹴鞠、击鞠、打猎、射箭、马术、园艺、茶学，自创\
  \ “瘦金书” 字体。 \n 毛晋，原名凤苞，字子久。后改字子晋，号潜在，别号汲古主人。江苏常熟昆承湖七星桥（亦名曹家滨）人。明末藏书家、出版家、刻书家、文学家、经学家。 \n 刊印信息 明崇祯时期常熟毛氏汲古阁刊津逮秘书本"
