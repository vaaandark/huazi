summary: 元、明、清三代进士题名碑现存于北京的孔庙和国子监博物馆，现存一百九十八座，题刻着元、明、清三个朝代六百年来五万一千六百二十四名进士的姓名、籍贯和录取名次，是研究我国科举制度的珍贵实物资料。此套民国时期《元明清三朝进士题名碑录》拓片折叶，共二百三十五幅。
description: "元、明、清三代进士题名碑现存于北京的孔庙和国子监博物馆，现存一百九十八座，题刻着元、明、清三个朝代六百年来五万一千六百二十四名进士的姓名、籍贯和录取名次，是研究我国科举制度的珍贵实物资料。此套民国时期《元明清三朝进士题名碑录》拓片折叶，共二百三十五幅。\
  \ \n 进士题名碑，是将科举考试中金榜题名的进士之名刻于碑上而成。它源自唐代新科进士的雁塔题名。进士题名刻石立碑，大概开始于北宋时期，开始时一般立于京城的寺观或礼部贡院。京城孔庙的进士题名碑最早出现于元代皇庆二年（1313）。孔子历代被尊称\
  \ “大成至圣先师文宣王”，不仅是天下读书人的祖师爷，也是皇帝的老师。考中进士并能在先师的府院中的石碑上留下自己的名字，这是一种无上的荣耀。（介绍 参考 ） \n 北京孔庙院内的《进士题名碑》始于元代皇庆二年（1313\
  \ 年）开科取士后，进士题名于碑上，借以显宗耀祖。而明代又将碑上元代的刻名磨去，刻上明代进士的姓名。故现存元代进士碑仅有三块，是康熙年间国子监祭酒吴苑掘地时发现的。明代自永乐十四面（1416 年）丙申科始至崇祯十六年（1643\
  \ 年）癸未科止 77 块（明永乐十年以前的进士题名碑在南京国学）。清代顺治丙戌科至光绪甲辰科止 118 块，元明清三朝共 198 块题名碑。（介绍 参考 ） \n 拓片、折叶，墨纸尺寸：189 x\
  \ 96 厘米至 135 x 75 厘米不等 \n进士：中国古代科举制度中，通过最后一级中央政府朝廷考试者，称为进士。是古代科举殿试及第者之称。此称始见于《礼记·王制》。隋炀帝大业年间始置进士科目。唐亦设此科，凡应试者谓之举进士，中试者皆称进士。唐朝时以进士和明经两科最为主要，后来诗赋成为进士科的主要考试内容。元、明、清时，进士经殿试后，及第者皆赐出身，称进士。且分为三甲：一甲\
  \ 3 人，赐进士及第；二、三甲，分赐进士出身、同进士出身。 \n 北京国子监是元、明、清三代国家设立的最高学府和教育行政管理机构，又称 “太学”“国学” 。孔庙占地 22000 平方米，有三进院落。中轴线上得建筑依次为先师门、大成门、大成殿、崇圣祠。前院东面有碑亭、神厨、省牲亭、井亭；西面有碑亭、致斋所，并有持敬门与国子监相通。两侧排列着\
  \ 198 座元、明、清三代进士题名碑，刻有 51624 名进士的姓名、籍贯、名次，是研究我国科举制度的珍贵实物资料。大成门外有乾隆石鼓和与之有关的两座清代石碑。中院的主要建筑为东西庑和 13 座御碑亭；后院崇圣祠独立成院，集合成北京孔庙完整的古建筑群体。\
  \ \n 拓制信息 民国时期拓（元至正至清光绪时期刻题名碑）本"
