id: song-feng-ge-shi-juan
title: 松风阁诗卷
aliases: []
author: 黄庭坚
dynasty: 宋
script: xing
carrier: moji
holder: 台北故宫博物院
summary: 此《松风阁诗》卷是北宋黄庭坚传世行楷代表作。宋崇宁元年，黄庭坚与朋友游武昌（今湖北鄂州）西山，途经 “松风阁” 等处。有感而发自书七言古诗一首。借以表达希望解脱现实羁绊与怀念友人的心境。全卷书写于不易吸墨的砑花粉笺之上，造型长波大撇，结体紧密瘦长。此卷现藏于台北故宫博物院。
description: "此《松风阁诗》卷是北宋黄庭坚传世行楷代表作。宋崇宁元年，黄庭坚与朋友游武昌（今湖北鄂州）西山，途经 “松风阁” 等处。有感而发自书七言古诗一首。借以表达希望解脱现实羁绊与怀念友人的心境。全卷书写于不易吸墨的砑花粉笺之上，造型长波大撇，结体紧密瘦长。此卷现藏于台北故宫博物院。\
  \ \n 此作引首装裱是难得的十五世纪蓝色洒金笺，其上另以金描绘花鸟纹。这种笺纸在中国古代并不多见，唯部分十五世纪波斯地区古兰经以此类缤纷洒金色笺绘写。 \n黄庭坚在宋徽宗崇宁元年和他的朋友到武昌游玩，来到一座寺庙\
  \ “西山寺”，山寺间有亭阁，生长老松。黄坚庭在此过夜，作了这首《松风阁》的诗，歌咏当时所看到的景物，并表达对朋友的怀念。"
transcription: "松風閣 \n 依山築閣見平川。夜闌箕斗插屋椽。我來名之意適然。老松魁梧數百年。斧斤所赦今參天。風鳴媧皇五十弦。洗耳不須菩薩泉。嘉二三 （以上二字原倒置） 子甚好賢。力貧買酒醉此筵。夜雨鳴廊到曉懸。相看不歸臥僧氈。泉枯石燥復潺湲。山川光暉為我妍。野僧早\
  \ （早字點去） 旱饑不能饘。曉見寒溪有炊煙。東坡道人已沈泉。張侯何時到眼前。釣臺驚濤可晝眠。怡亭看篆蛟龍纏。安得此身脫拘攣。舟載諸友長周旋。 \n 这件书迹长波大撇，提顿起伏，一波三折，像是船夫摇桨用力的样子。不论收笔、转笔，都是楷书的笔法，下笔平和沉稳，变化非常含蓄，轻顿慢提，婀娜稳厚，意韵十足。在后段提到前一年已去世的苏轼时，心中不免激动，笔力特别凝重，结字也更加倾侧，是尚意书风的典型。\
  \ \n 全卷书写于不易吸墨的砑花粉笺之上，用笔却仍见劲健，造型长波大撇，结体紧密瘦长。这是黄庭坚晚年风格的代表作。 \n砑花粉笺的花纹在亮光下若隐若现，偏暗的环境下更容易显现。随 PDF 文件附带暗光下拍摄的砑花粉笺纸。\
  \ \n 卷后有跋十五则 \n 向冰 跋 \n 宣惠堂帖有涪翁所書宿鰕湖詩。後云。女奴輩皆鼾寐無為和墨者。故盡用一池淡墨。又嘗在湖湘間用雞毛筆。亦堪作字。蓋前輩能書者。亦有時而乘興。不擇佳筆墨也。此松風閣詩乃晚年所作。筆墨雖不相副。歲久光采差退。然書灋具存。章章乎羲獻父子之間。當有識者。嘉定壬申重午後四日。寀林道人向冰敬跋\
  \ \n 魏必復 跋 \n 築閣依山月露清。簷牙軒豁拂雲平。昔人大好吟詩處。聽徹松風晝夜聲。集賢侍講學士中奉大夫致仕魏必復敬題 \n 李泂 跋 \n 東坡遊惠州松風亭。一悟得熟歇處。涪翁於此亦云。相看不歸臥僧氈。聞香擊竹。同見如來。風鳴松耶。松鳴風耶。至治三年季春廿有三日。監脩國史長史李泂。奉皇姊大長公主教。拜手稽首敬書\
  \ \n 張珪 跋 \n 閣上風來松有聲。高人胷次灑然清。當時詩筆今猶在。撫卷重看眼倍明。中書平章政事張珪敬題 \n 王約 跋 \n 曾聞狂小子。恣意輕論量。浮雲風掃去。千古說蘇黃。集賢大學士王約謹題\
  \ \n 馮子振 跋 \n 大蘇門下士。真不愧涪翁。前日長松閣。依然謖謖風。前集賢待制馮子振奉皇姊大長公主命題 \n 陳顥 跋 \n 涪公詞翰氣橫秋。自古如君能幾箇。高閣一詩四遠聞。知音自有松風和。前集賢大學士陳顥敬題\
  \ \n 陳庭實 跋 \n 涪翁胸次海漫漫。興在松風高閣間。蘇子沈泉無復見。空餘此老獨躋攀。儒學提舉陳庭實載拜書 \n 孛朮魯翀 跋 \n 晨鐘暮鼓鎮囪囪。蟲鳥春秋各自雄。何似道人高閣上。蕭蕭雙耳聽松風。中書右司員外郎孛朮魯翀賦盥手書\
  \ \n 李源道 跋 \n 黃太史書。自謂得江山之助。此詩與書皆其得意處。涪翁人品如此。詩什又如此。書法又如此。宜其為內家之珎玩也。翰林侍讀學士李源道拜下觀 \n 袁桷 跋 \n 謂松有風松不知。謂風入松風無形，聲繇形始成。言六書者取焉。肇於無名。入於有名。萬化之始。吾未始以妄聽。松動風動。當於混沌以得之斯可矣。翰林直學士袁桷敬題\
  \ \n 鄧文原 跋 \n 山雨溪雲散墨痕。松風清坐息塵根。筆端悟得真三昧。便是如來不二門。集賢直學士鄧文原敬題 \n 柳䝺 跋 \n 豫章一再變。八體乃純如。晚將雞毛筆。大倣繭紙書。松風閣中作。羣玉排疏疏。至今元祐腳。清標能起予。國子博士柳䝺敬題\
  \ \n 趙巖 跋 \n 涼風高閣響鐘笙。老墨猶思翠笏橫。寄語分寧黃太史。何如紫極聽秋聲。趙巖 \n 杜禧 跋 \n 山谷黔南之後。詩文字畫。尤為殊勝。蓋為世之所珍惜也。翰林國史院編修官杜禧敬題 \n\
  \ 书卷于南宋年间经由贾似道 收藏，入元以后，转为大长公主 祥哥剌吉 所有。 祥哥剌吉 为元世祖曾孙女，因深受父亲和祖父熏陶，热衷汉文化。至大四年其弟仁宗即位，遂进号为 “皇姊大长公主” 。由于姊弟二人皆留意书画收藏，朝中文艺气息日见浓郁。皇姊且取法汉人钤盖收藏印：「皇姊圖書」、「皇姊珍玩」，卷首即钤有「\
  \ 皇姊圖書 」。 （参考来源： 王競雄 ） \n 黄庭坚 （1045 年-1105 年），字鲁直，自号山谷道人，晚号涪翁，又称黄豫章，世称金华仙伯。洪州分宁（今江西修水）人。 “江西诗派” 的开山之祖，北宋诗人、词人、书法家。"
