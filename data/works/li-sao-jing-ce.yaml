id: li-sao-jing-ce
title: 离骚经册
aliases: []
author: 米芾
dynasty: 宋
script: xing
carrier: moji
holder: 台北故宫博物院
summary: 《离骚》是战国时期楚国人屈原创作的诗篇，是楚辞中最著名最出色的作品，属自传文学与抒情诗。此《离骚经》册传为北宋米芾所书。全册共二十六开（用砑花笺纸），行楷书《离骚》全文，每开二幅，每幅五行，每行字数不一。此册现藏于台北故宫博物院。
description: "《离骚》是战国时期楚国人屈原创作的诗篇，是楚辞中最著名最出色的作品，属自传文学与抒情诗。此《离骚经》册传为北宋米芾所书。全册共二十六开（用砑花笺纸），行楷书《离骚》全文，每开二幅，每幅五行，每行字数不一。此册现藏于台北故宫博物院。\
  \ \n 在《离骚》中，屈原自述身世、才华与志向，抨击他指称为 “小人” 的人诽谤中伤，抒发因被君王疏远而感到悲愤，申明择善固执，宁死不悔，坚持初衷，绝不同流合污。在《离骚》后面加上一个 “经” 字，正如宋代\
  \ 洪兴祖 所说，“古人引《离骚》未有言经者，盖后世之士祖述其词，尊之为经耳。”"
transcription: "大致如下 \n 帝高陽之苗裔兮，朕皇考曰伯庸。攝提貞於孟陬兮，惟庚寅吾以降。皇覽揆余以初度兮，肇錫余以嘉名。名余曰正則兮，字余曰靈均。紛吾既有此內美兮，又重之以脩能。扈江離與辟芷兮，紉秋蘭以為佩。汩余若將不及兮，恐年歲之不吾與。朝搴阰之木蘭兮，夕攬洲之宿莽。日月忽其不淹兮，春與秋其代序。惟草木之零落兮，恐美人之遲暮。不撫壯而棄穢兮，何不改乎此度？乘騏驥以馳騁兮，來吾道夫先路！昔三后之純粹兮，固眾芳之所在。雜申椒與菌桂兮，豈惟紉夫蕙茞？彼堯舜之耿介兮，既遵道而得路。何桀紂之昌披兮，夫唯捷徑以窘步。惟黨人之偷樂兮，路幽昧以險隘。豈余身之憚殃兮，恐皇輿之敗績！忽奔走以先後兮，及前王之踵武。荃不揆余之中情兮，反信讒而齌怒。余固知謇謇之為患兮，忍而不能舍也。指九天以為正兮，夫唯靈脩之故也。曰黃昏以為期兮，羌中道而改路。初既與余成言兮，後悔遁而有他。余既不難夫離別兮，傷靈脩之數化。余既滋蘭之九畹兮，又樹蕙之百畝。畦留夷與揭車兮，雜杜衡與芳芷。冀枝葉之峻茂兮，願竢時乎吾將刈。雖萎絕其亦何傷兮，哀眾芳之蕪穢。眾皆競進以貪婪兮，憑不厭乎求索。羌內恕己以量人兮，各興心而嫉妬。忽馳騖以追逐兮，非余心之所急。老冉冉其將至兮，恐脩名之不立。朝飲木蘭之墜露兮，夕餐秋菊之落英。苟余情其信姱以練要兮，長顑頷亦何傷！掔木根以結茞兮，貫薜荔之落蘂。矯菌桂以紉蕙兮，索胡繩之纚纚。謇吾法夫前脩兮，非世俗之所服。雖不周於今之人兮，願從彭咸之遺則。長太息以掩涕兮，哀民生之多艱。余雖好脩姱以鞿羈兮，謇朝誶而夕替。既替余以蕙纕兮，又申之以攬茞。亦余心之所善兮，雖九死其猶未悔。怨靈脩之浩蕩兮，終不察夫民心。眾女嫉余之蛾眉兮，謠諑謂余以善淫。固時俗之工巧兮，偭規矩而改錯。背繩墨以追曲兮，競周容以為度。忳鬱邑余侘傺兮，吾獨窮困乎此時也。寧溘死以流亡兮，余不忍為此態也。鷙鳥之不群兮，自前世而固然。何方圜之能周兮？夫孰異道而相安？屈心而抑志兮，忍尤而攘詬。伏清白以死直兮，固前聖之所厚。悔相道之不察兮，延佇乎吾將反。回朕車以復路兮，及行迷之未遠。步余馬於蘭皋兮，馳椒丘且焉止息。進不入以離尤兮，退將復脩吾初服。製芰荷以為衣兮，集芙蓉以為裳。不吾知其亦已兮，苟余情其信芳。高余冠之岌岌兮，長余佩之陸離。芳與澤其雜糅兮，唯昭質其猶未虧。忽反顧以遊目兮，將往觀乎四荒。佩繽紛其繁飾兮，芳菲菲其彌章。民生各有所樂兮，余獨好脩以為常。雖體解吾猶未變兮，豈余心之可懲？女嬃之嬋媛兮，申申其詈予。曰：「魚玄婞直以亡身兮，終然殀乎羽之野。汝何博謇而好脩兮，紛獨有此姱節？薋菉葹以盈室兮，判獨離而不服。眾不可戶說兮，孰云察余之中情？世並舉而好朋兮，夫何煢獨而不予聽？」依前聖以節中兮，喟憑心而歷茲。濟沅湘以南征兮，就重華以敶詞。啟九辯與九歌兮，夏康娛以自縱。不顧難以圖後兮，五子用失乎家衖。羿淫游以佚畋兮，又好射夫封狐。固亂流其鮮終兮，浞又貪夫厥家。澆身被服彊圉兮，縱欲而不忍。日康娛而自忘兮，厥首用夫顛隕。夏桀之常違兮，乃遂焉而逢殃。后辛之菹醢兮，殷宗用而不長。湯禹儼而祗敬兮，周論道而莫差。舉賢才而授能兮，循繩墨而不頗。皇天無私阿兮，覽民德焉錯輔。夫維聖哲之茂行兮，苟得用此下土。瞻前而顧後兮，相觀民之計極。夫孰非義而可用兮？孰非善而可服？\
  \ \n 封面（乾隆）题： 米芾書離騷經 。無上真蹟，神品。淳化軒鑒藏 \n 画册前（乾隆）题： 超外得中 \n 清高宗乾隆跋三则 \n 芾書離騷冊。余既辨定之。謂石渠寶笈所藏米書。無出其右。雖不署名。而不足為累。近復得芾書元會詩卷。張照跋云。可與秋夜詩頡頏。微惜損數字。為後人描補。諦視之則全出雙鉤。不僅描補數字。復檢舊藏秋夜詩卷較之。其病與元會卷相倣。總不及此冊之真而可愛。益可以證所評之得正。秋夜無款。固不足論。元會雖署款。亦何能以刻鏤之碔砆。與太璞相抗哉。\
  \ 戊戌仲冬下澣。御識 \n 騷經重續左徒語。信史因存特進書。謂米箇中寧謾也。疑吳妙處註能如。端莊流麗文兼字。坐撫行吟居與諸。莫議南宮署名闕。刻舟求劍乃拘墟。 甲午新秋月中澣。御題 \n 昔之評芾書者。曰超邁入神。曰沉著痛快。此冊殆兼有其美。余固以端莊流麗目之。石渠寶笈藏米書多矣。無出此右者。即以米書論。亦當推為後來居上。又豈效顰者所能仿彿哉。斯蓋有目共見。雖不署名何傷。譬之珠玉在前。人皆知而寶之。珠玉固未嘗自衒其名耳。\
  \ 甲午仲秋。御識 \n 李東陽 跋 \n 南宮書。東坡稱為超逸入神。今觀其溫潤縝密乃如此。然則書可易言哉。克溫學士。深於書者。偶出此卷。因相與評之。東陽 \n 于敏中等 跋 \n 右離騷經墨跡。凡二千四百餘字。首尾完善。法書中至寶也。李東陽跋為米芾書。稱其溫潤縝密。董其昌容臺集。亦載米元章行書離騷。宜興吳民部所藏。真海內奇觀。兩人皆精於書者。其推許應非虛譽。第李跋謂克溫學士出此卷。董跋謂近始裝潢成帙。兩人所見不同。初竊疑之。及諦視冊紙。每閱五幅。即有一接湊而成者。或前或後。不過一二寸。使當日就方幅作書。不應襞積若此。今以合縫量之。相去約五尺許。可見紙幅本長。曩固通聯成卷。後乃分鈲為冊耳。即此可為由卷改冊之據。至紙間勤有二字。評紙諸書。雖無可考。而天祿琳琅所藏宋版古列女傳。有建安余氏靖菴。刊于勤有堂標記。考岳珂九經三傳沿革例云。世傳九經有建安余氏所刊者。稱為善本。按宋真宗咸平四年。摹印九經頒行。其時海內盛行鏤版。是珂所云建安余氏善本。當在其時。第勤有堂名。未詳所自始。茲蒙宣諭閩浙督臣鐘音。於建安訪之。覆奏云。核其家譜。余氏祖煥。自南北朝遷入閩中。其十四世孫徙居建陽之書林。書林在唐時已為鬻書之地。余氏即習其業。煥之二十五世孫余文興。以舊有勤有堂之名。號為勤有居士云云。則知勤有之名。在北宋已有之。又云建安書籍盛行。余氏獨於他處購選紙料。印記勤有二字。此紙或出建安余氏所購。未可知也。又考克溫。乃吳儼字。宜興人。明成化丁未進士。官禮部尚書。曾為侍講學士。東陽所指。蓋即其人。而其昌所云吳民部者。名鳴虞。亦宜興人。嘉靖壬戌進士。由戶部主事晉郎中。終於吏部。以其科第年分計之。鳴虞後儼七十餘年。當是其孫輩。蓋儼所藏。本係字卷。或年久損敝。鳴虞重裝為冊。以便披閱。亦不可知。獨未解其既寶世澤弗失。而於藏弆之由。改裝之故。不一識之。何率略乃爾。至其昌既已筆之於書。而不為題之於冊。理皆不可曉。或董跋向固在冊間。後乃散佚不全耶。夫芾書至今六百餘年。東陽未跋以前。不聞有人稱道之。既跋以後。又不見有人踵題之。而是米蹟也。始何以歸之於吳。繼復何以由吳歸車氏。亦更無人為之詳敘而備識之。說者幾以芾書之尠所表見為憾。今一旦登石渠。塵乙覽。經大聖人之品題。而其書以顯。其名益因以信。是芾因不署款。而得邀真賞。不可謂非異代遭際之榮歟。日月出而爝火息。東陽之跋。其昌之書。有無皆不足計。又豈臣等螢燿之微。所足分光於餘照者哉。\
  \ 臣于敏中、臣王際華、臣梁國治、臣董誥、臣沈初恭跋 \n 台北故宫博物院藏此《离骚经》册为何人所书，在学术界依然存在较大的分歧。明代吴俨将其归为米芾之作，李东阳题跋其后，但言辞较为含糊，没有给出确切的结论；董其昌在《容台集》中提及过《离骚经》，认为应是宋代蔡京所书；清代乾隆等人则相信吴俨的看法，将其定为米芾的无款之作。\
  \ \n 该作所用纸张是典型的宋代砑花笺纸 [ 1 ] 花笺的 “砑花” 技法，是透过雕版在纸上研压出凹凸纹饰。 \n （花笺的 “砑花” 技法，是透过雕版在纸上研压出凹凸纹饰。） ，纸张上有多处「\
  \ 勤有 」印记，清乾隆朝臣于敏中等人认为这应该是北宋时期建安余氏的印记。 (介绍 参考 ) \n 離騷經（行书），无作者款识 \n米芾，北宋书画家。初名黻，字元章，太原人，号襄阳漫士、海岳外史、鹿门居士。北宋著名书法家、书画理论家、画家、鉴定家、收藏家。"
