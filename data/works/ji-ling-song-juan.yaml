holder: 台北故宫博物院
summary: 此《鹡鸰颂》卷由唐玄宗李隆基书。唐开元七年秋，有鹡鸰约千只翔集于宫殿，玄宗见其飞鸣行摇，不畏人之状，联想及兄弟相聚之乐，遂召左清道率府长史魏光乘撰颂文，玄宗亲自书成此卷，全卷以行书写成，共四十四行，三百三十一字。这可能是他传世仅存的墨迹。
  此卷现藏于台北故宫博物院。
description: "此《鹡鸰颂》卷由唐玄宗李隆基书。唐开元七年秋，有鹡鸰约千只翔集于宫殿，玄宗见其飞鸣行摇，不畏人之状，联想及兄弟相聚之乐，遂召左清道率府长史魏光乘撰颂文，玄宗亲自书成此卷，全卷以行书写成，共四十四行，三百三十一字。这可能是他传世仅存的墨迹。\
  \ 此卷现藏于台北故宫博物院。 \n 鹡翎，此鸟有「飛則鳴」、「行則搖」的习性，古人将之比喻为「兄弟既在急難而相救」，因此演变为「兄弟之情」之寓意。 唐玄宗是唐朝第七位皇帝，在位四十四年。他即皇位之初，在家族中很有纠纷，必须笼络自己的兄弟，而又不愿他们实际干预政治，于是将五位兄弟派驻到远离中央的地区，每年一朝见，因此藉著这篇颂文表达思念兄弟之情，也寄望兄弟间互相照应，不会发生夺权之政争。\
  \ 本幅书于玄宗三十五岁之年 ( 719 ) [ 1 ] 江兆申，〈唐玄宗書鶺鴒頌完成年歲考〉，《雙谿讀畫隨筆》，(台北：國立故宮博物院，1977.10 )，頁 1—9 \n （江兆申，〈唐玄宗書鶺鴒頌完成年歲考〉，《雙谿讀畫隨筆》，(台北：國立故宮博物院，1977.10\
  \ )，頁 1—9） ，书法自首至尾，运笔精力专注，清楚的交代每一笔画的开始、转折、停顿与收尾。在字形上，明显与王羲之 〈兰亭序〉 相似，只是笔画更为粗壮，可以看出从初唐以来，唐太宗倡导王羲之书法对于皇室后代的影响，也反映盛唐时期，对于丰腴之美的好尚。（\
  \ 何传馨 ）卷上鉴藏印记共七十五方，拖尾依序有北宋蔡京、蔡卞，以及清代王文治题跋，是一件流传有绪的作品。"
transcription: "鶺鴒頌。俯同魏光乘作。朕之兄弟唯有五人。比為方伯。歲一朝見。雖載崇藩屏而有睽談笑。是以輟牧人而各守京職。每聽政之後。延入宮掖。申友于之志。詠常棣之詩。邕邕如。怡怡如。展天倫之愛也。秋九月辛酉。有鶺鴒千數。栖集於麟德之庭樹。竟旬焉。飛鳴行搖。得在原之趣。昆季相樂。縱目而觀者久之。逼之不懼。翔集自若。朕以為常鳥無所志懷。左清道率府長史魏光乘。才雄白鳳。辯壯碧雞。以其宏達博識。名至軒檻。預觀其事。以獻其頌。夫頌者所以揄揚德業。褒讚成功。顧循虛昧。誠有負矣。美其彬蔚。俯同頌云。伊我軒宮。奇樹青葱。藹周廬兮。冒霜停雪。以茂以悅。恣卷舒兮。連枝同榮。吐綠含英。曜春初兮。蓐收御節。寒露微結。氣清虛兮。桂宮蘭殿。唯所息宴。栖雍渠兮。行搖飛鳴。急難有情。情有餘兮。顧惟德涼。夙夜兢惶。慙化踈兮。上之所教。下之所效。實在予兮。天倫之性。魯衛分政。親賢居兮。爰遊爰處。爰笑爰語。巡庭除兮。觀此翔禽以悅我心。良史書兮。\
  \ \n 卷后有跋四则 \n 蔡京题跋 \n 臣聞唐有天下。不能追法先王。其政之所施。與士之所學。皆同乎流俗。合乎污世。其文鄙朴。無復風雅。開元中葉。號為極治。而遺風餘烈。無可稽考。世稱明皇脊令頌。最為翰墨文章之美。伏蒙宣示真蹟。其書札詞語。始知臣前言不誣。臣伏觀前日聖製圖賦。羲晝遒逕。奎文藻煥。非騷人嫉世憤懣之詞。真聖人孝友格物之義。以彼方此。以今觀昔。其事則同。其德其言則異。猶日月之揭。霄壤之殊。非臣敢私也。政和五年四月望。太師魯國公蔡京謹題。\
  \ \n 蔡卞题跋 \n 唐明皇於兄弟間。以友愛稱。時有脊令數千。栖麟德之庭木間。君臣賡頌。以為美談。聖上紹述先烈。發揮哲廟之志。巨細畢舉。是以斯禽一日同集後菀龍翔池。數以萬計。蓋前此未之有也。上既親御丹青圖其狀。又作為雅詩以賦之。事辭之稱。與日月爭光。顧此頌所談。亦不足貴矣。改月三日。昭慶軍節度使中太一宮使。臣蔡卞題。\
  \ \n 王文治题跋二则 \n 帝王之書。行墨間具含龍章鳳姿。非為人臣者所能髣髴。觀此頌猶令人想見開元英明卓犖時也。後有宋二蔡跋。雖其人不足重。而書法之精。自蘇米諸公而下。罕有能踰之者。亦可玩也。癸丑暮春之初。丹徒王文治。\
  \ \n 此書或有疑為雙鉤者。良由未曾多見唐宋人真蹟。不知古人筆法沉著。墨法豐厚之處。深知書者。詳玩自得。不待多詞。同日又記。 \n 全卷无款，卷末有草书「 勅 」，其下有一御押 \n 唐玄宗 李隆基，是盛唐最著名的帝王之一。玄宗在位\
  \ 44 年，其后退居太上皇共 6 年，享寿 77 岁，是唐朝在位最久与最长寿的皇帝。李隆基为唐睿宗第三子，母窦德妃。庙号玄宗，谥号至道大圣大明孝皇帝。宋代避圣祖赵玄朗讳，清代避康熙帝玄烨讳，皆称为唐明皇，另有尊号\
  \ “开元圣文神武皇帝” 。"
