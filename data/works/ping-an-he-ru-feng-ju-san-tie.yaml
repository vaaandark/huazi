id: ping-an-he-ru-feng-ju-san-tie
title: 平安何如奉橘三帖卷
aliases: []
author: 王羲之
dynasty: 东晋
carrier: moji
holder: 台北故宫博物院
summary: 此《平安何如奉橘三帖》卷由东晋王羲之书（给友人的信札）。此卷包含《平安》、《何如》、《奉橘》三帖。短札内容为回信告知自己的近况、问候友人身体状况并附书赠送友人橘子三百枚。此本约为唐人双勾填墨（押署一并摹）本，现藏于台北故宫博物院。
description: "此《平安何如奉橘三帖》卷由东晋王羲之书（给友人的信札）。此卷包含《平安》、《何如》、《奉橘》三帖。短札内容为回信告知自己的近况、问候友人身体状况并附书赠送友人橘子三百枚。此本约为唐人双勾填墨（押署一并摹）本，现藏于台北故宫博物院。\
  \ \n 传世的王羲之书法，都会冠上 “帖” 的用语，如今，大概还能看到一、二十种，不过，几乎没有例外，这些都是后人的临摹本。这三幅信札，后来的人将它们分别命名为 “平安帖” 、 “何如帖” 、 “奉橘帖”\
  \ 。《平安帖》、《何如帖》是王羲之写的两封书信，《奉橘帖》原是《何如帖》帖尾附书。流传过程中，《平安帖》失去最后两行，《奉橘帖》则逐渐独立。三帖在明末合裱成卷，并从它处移配欧阳修等人的观款。三帖皆唐人双钩廓填，押署一并摹出\
  \ [ 1 ] 《平安如何》二帖前有萧梁时代鉴书人徐僧权、唐怀充二人的「僧權」、「懷充」押署 \n （《平安如何》二帖前有萧梁时代鉴书人徐僧权、唐怀充二人的「僧權」、「懷充」押署） 。虽为摹本，却为下真迹一等之佳作，可一窥王氏遒逸书风。牵丝映带处锋毫毕现，可见书圣揉合快慢、方圆、提按变化的高超笔法。单字造形富大小、偃仰、开合、欹正之变，无一雷同又互相衬托，深刻展现出创造力。\
  \ \n 从公元六世纪的南朝以来，上至君王下至庶民，都喜好王羲之等名家的信札，由于此类珍贵书迹都收藏在宫禁之中，即使是平民收藏家也不会轻示于人。有时帝王为分送亲信，或是担心真迹观赏过多次会有伤害，常会请人以双勾填墨\
  \ [ 2 ] “双勾填墨” 又称 “双钩填墨”，原为工笔画画法中的一种技法，简称双钩法，一般为一个部分采用两笔勾勒进行描边封闭，再采用相应的颜色进行填充。 经过演变后，在书画临摹方面得到了广泛的应用，很多古籍的书法临摹的精本均采用了双钩法，作品一般称为双钩摹本。\
  \ 双钩填墨最为接近真迹，保持原本的笔墨情趣和神态风韵。 \n （“双勾填墨” 又称 “双钩填墨”，原为工笔画画法中的一种技法，简称双钩法，一般为一个部分采用两笔勾勒进行描边封闭，再采用相应的颜色进行填充。\
  \ 经过演变后，在书画临摹方面得到了广泛的应用，很多古籍的书法临摹的精本均采用了双钩法，作品一般称为双钩摹本。 双钩填墨最为接近真迹，保持原本的笔墨情趣和神态风韵。） 的方式将书迹做复制，此三帖即属这类摹本。《宣和书谱》著录时，以第一帖《平安》标目。南宋入高宗御府，有「紹興」诸印。元代经张晏收藏。至明，先在吴县王鏊家中。继归项元汴，后来，张觐宸以重金从项元汴之子玄度处买到，再经明末清初张孝思、张玉裁等递藏，进入乾隆内府，今藏台北故宫博物院。\
  \ \n 其中部分书法墨迹毁坏的部分，因为年代久远，墨已经脱落了。 \n 1 2 3 4 5 6 1 \n平安帖 \n 2 \n押署： 僧權 （存半） \n 3 \n何如帖 \n 4 \n押署： 察\
  \ 、 懷充 \n 5 \n奉橘帖 \n 6 \n 观款 \n 開皇十八年三月廿七日 \n 參軍事學士諸葛穎 \n 諮議參軍開府學士柳顧言 \n 釋智果 \n 平安帖"
transcription: "（此粗）平安。脩載來十餘（日）。（諸）人（近）集。存想明日當復悉（來）。（無）由同。增慨。 \n 何如帖"
