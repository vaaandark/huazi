id: kai-cheng-shi-jing-ta-pian
title: 开成石经拓片
aliases: []
author: 褚遂良
dynasty: 唐
script: kai
carrier: beike
holder: 京都大学人文科学研究所
summary: 《开成石经》始刻于唐文宗大和七年，开成二年完成。凡刻：周易、尚书、诗经、周礼、仪礼、礼记、春秋左氏传、公羊传、穀梁传、孝经、论语、尔雅等十二种儒家经典附五经文字、九经字样。加上清代补刻的《孟子》共十三经。刻石今藏于西安碑林，此套为京都大学人文科学研究所藏拓片二百五十幅。
description: "《开成石经》始刻于唐文宗大和七年，开成二年完成。凡刻：周易、尚书、诗经、周礼、仪礼、礼记、春秋左氏传、公羊传、穀梁传、孝经、论语、尔雅等十二种儒家经典附五经文字、九经字样。加上清代补刻的《孟子》共十三经。刻石今藏于西安碑林，此套为京都大学人文科学研究所藏拓片二百五十幅。\
  \ \n 唐大和九年（835），宰相郑覃奏请，“请召宿儒奥学，校定六籍，准后汉人故事，勒石于太学，永代作制” [ 1 ] 旧唐书·郑覃传 \n （旧唐书·郑覃传） 。唐文宗开成二年（837 年）艾居晦、陈玠等奉诏刻《周易》等十二种儒家经典立于长安国子监内，经文共刻于一百一十四座碑石上﹐每石两面刻，共有\
  \ 650252 字。石经刊成后，原立于务本坊国子监内，经过三次次搬迁，于北宋崇宁二年（1103 年）连同李隆基所书《石台孝经》、颜真卿《颜氏家庙碑》、褚遂良《孟法师碑》、柳公权《玄秘塔碑》等书法名碑搬至现址，今西安碑林所在地，从此再也没有移动过。（介绍\
  \ 参考 ） \n唐刻立《开成石经》时，《孟子》尚声名未彰，故未收录。五代后蜀主孟昶列入儒家经书中，南宋朱熹把《孟子》作为《四书》之一，《孟子》从此获得儒家经典的地位。清康熙三年（1664 年）陕西巡抚贾汉复等人集唐《开成石经》中的字样补刻《孟子》圆首方碑十七通。\
  \ \n儒家经典，从孔子时代的 “六经”（《诗》、《书》、《礼》、《乐》、《易》、《春秋》）到西汉的 “五经”（“六经” 无《乐》）；又从 “五经” 发展到 “七经”（“五经” 加《论语》、《孝经》），再发展到\
  \ “九经”（《易》、《诗》、《书》、《三礼》、《春秋三传》）、 “十二经”（“九经” 加《论语》、《孝经》、《尔雅》）和 “十三经”（“十二经” 加《孟子》）。（介绍 参考 ） \n 周易：九幅 \n\
  尚书：十一幅 \n毛诗：十六幅 \n仪礼：二十幅（原缺一幅） \n周礼：十九幅 \n礼记：三十三幅 \n春秋左氏传：六十七幅 \n春秋穀梁传：十七幅 \n春秋公羊传：十七幅 \n论语：八幅 \n孟子：十七幅\
  \ \n孝经：一幅 \n五经文字及九经字样：十幅 \n尔雅：五幅 \n 标题为隶书，经文为楷书 \n《 开成石经 》始刻于文宗大和七年十二月 (834 年)，开成二年 (837) 完成。依次计有《周易》《尚书》《诗经》《周礼》《仪礼》《礼记》《春秋左传》《春秋公羊传》《春秋穀梁传》《孝经》《论语》《尔雅》等\
  \ 12 种儒家经书（加上清乾隆年间补刻的《孟子》共十三经），另有《五经文字》《九经字样》附于《春秋左传》之末。共刻 114 块碑石，每石两面刻，每碑上下分为 8 段，每段中每行刻 10 字。共刻经文\
  \ 650252 字。碑石高约 2.16 米，面宽 71～97 厘米不等。下设方座，中插经碑。原碑立于唐长安城务本坊的国子监内，宋时移至府学北墉，即今西安碑林。是中国古代保存最早、最完好的儒家刻经。\
  \ \n 拓制信息 不详 或为清末民初拓片 \n 书写者 艾居晦、陈玠"
layout: "共二百五十幅，拓片尺高 200 厘米左右不等 \n每碑上下分为八段，每段中每行刻十字"
