id: qian-hou-chi-bi-fu-shu-hua-juan
title: 前后赤壁赋书画卷
aliases: []
author: 赵孟頫
dynasty: 元
script: xing
carrier: moji
holder: 台北故宫博物院
summary: 《前后赤壁赋》是北宋文学家苏轼两度游览黄州（现在湖北黄冈）赤壁后的两篇散文作品，对后世诗文书画创作产生过巨大影响。元代书法家赵孟頫对其喜爱有加，多次书写。此内含元大德三年赵孟頫行楷书此二赋卷，题元大德二年赵孟頫绘《前后赤壁赋》画卷。此两种现藏于台北故宫博物院。
description: "《前后赤壁赋》是北宋文学家苏轼两度游览黄州（现在湖北黄冈）赤壁后的两篇散文作品，对后世诗文书画创作产生过巨大影响。元代书法家赵孟頫对其喜爱有加，多次书写。此内含元大德三年赵孟頫行楷书此二赋卷，题元大德二年赵孟頫绘《前后赤壁赋》画卷。此两种现藏于台北故宫博物院。\
  \ \n 苏轼世称苏东坡，为北宋著名的文学家、书法家。宋神宗元丰三年（1080）遭贬谪黄州（今湖北黄冈市）期间泛游赤壁，并分别在元丰五年的七月、十月写下两篇游记。前篇称《赤壁赋》或《前赤壁赋》后篇称《后赤壁赋》。在此二赋中，原文作者苏轼凭吊古迹，抒发了对江山风物的热爱与旷达的心胸，但是也有对人生虚无的消极思想。\
  \ \n 前后赤壁赋书卷 前后赤壁赋画卷 \n 赵孟頫一生多次书写苏轼《前后赤壁赋》，既有二赋合写，也有单独写前赋或后赋。此卷为赵孟頫所书此题材其中之一，于元大德三年（作者时年四十六）为友人岳上人所书。相较于其两年后（元大德五年）所书名篇《\
  \ 行书赤壁二赋册 》，此卷书写更加规整。 \n --"
transcription: "-- \n 赤壁賦 \n壬戌之秋。七月既望。蘇子與客泛舟。遊于赤壁之下。清風徐來。水波不興。舉酒屬客。誦明月之詩。歌窈窕之章。少焉。月出於東山之上。徘徊於斗牛之間。白露橫江。水光接天。縱一葦之所如。凌萬頃之茫然。浩浩乎如憑虛御風。而不知其所止。飄飄乎如遺世獨立。羽化而登仙。於是飲酒樂甚。扣舷而歌之。歌曰。桂棹兮蘭槳。擊空明兮泝流光。渺渺兮予懷。望美人兮天一方。客有吹洞簫者。倚歌而和之。其聲烏烏然。如怨如慕。如泣如訴。餘音嫋嫋。不絕如縷。舞幽壑之潛蛟。泣孤舟之嫠婦。蘇子愀然。正襟危坐。而問客曰。何為其然也。客曰。月明星稀。烏鵲南飛。此非曹孟德之詩乎。東望夏口。西望武昌。山川相繆。鬱乎蒼蒼。此非孟德之困於周郎者乎。方其破荊州。下江陵。順流而東也。舳艫千里。旌旗蔽空。釃酒臨江。橫槊賦詩。固一世之雄也。而今安在哉。且吾與子漁樵於江渚之上。侶魚蝦而友麋鹿。駕一葉之扁舟。舉匏尊以相屬。寄蜉蝣於天地。渺滄海之一粟。哀吾生之須臾。羨長江之無窮。挾飛仙以遨遊。抱明月而長終。知不可乎驟得。託遺響於悲風。蘇子曰。客亦知夫水與月乎。逝者如斯而未嘗往也。盈虛者如代（應作彼）。而卒莫消長也。蓋將自其變者而觀之。則天地曾不能以一瞬。自其不變者而觀之。則物與我皆無盡也。而又何羨乎。且夫天地之間。物各有主。茍非吾之所有。雖一毫而莫取。惟江上之清風。與山間之明月。耳得之而為聲。目遇之而成色。取之無禁。用之不竭。是造物者之無盡藏也。而吾與子之所共食。客喜而笑。洗盞更酌。肴核既盡。杯盤狼籍。相與枕藉乎舟中。不知東方之既白。\
  \ \n 後赤壁賦 \n是歲十月之望。步自雪堂。將歸于臨臯。二客從余。過黃泥之坂。霜露既降。木葉盡脫。人影在地。仰見明月。顧而樂之。行歌相答。已而歎曰。有客無酒。有酒無肴。月白風清。如此良夜何。客曰。今者薄暮。舉網得魚。巨口細鱗。狀如松江之鱸。顧安所得酒乎。歸而謀諸婦。婦曰。我有斗酒藏之久矣。以待子不時之須。於是攜酒與魚復遊於赤壁之下。江流有聲。斷岸千尺。山高月小。水落石出。曾日月之幾何。而江山不可復識矣。余乃攝衣而上。履巉巖。披蒙茸。踞虎豹。登虯龍。攀栖鶻之危巢。俯馮夷之幽宮。蓋二客不能從焉。劃然長嘯。草木震動。山鳴谷應。風起水涌。余亦悄然而悲。肅然而恐。凜乎其不可留也。返而登舟。放乎中流。聽其所止而休焉。時夜將半。四顧寂寥。適有孤鶴。橫江東來。翅如車輪。玄裳縞衣。戛然長鳴。掠余舟而西也。須臾客去予亦就睡。夢二道士。羽衣蹁躚。過臨臯之下。揖余而言曰。赤壁之遊。樂乎。問其姓名。俛而不答。嗚呼噫嘻。我知之矣。疇昔之夜。飛鳴而過我者。非子也耶。道士顧笑。余亦驚寤。開戶視之。不見其處。\
  \ \n 子昂為岳上人書。大德三年十一月晦 \n 书卷题签： 趙孟頫書前後赤壁賦 \n赵孟頫（1254-1322），浙江吴兴人，字子昂，号松雪道人。本宋宗室，宋亡仕元，官至翰林学士承旨。赵孟頫提倡复古，影响当代甚钜。其书法力追晋唐，书风历经三变，先临宋高宗，再学锺繇及二王，最后取法李邕。\
  \ \n 苏轼，四川眉州眉山人，北宋时著名的文学家、政治家、艺术家。字子瞻，一字和仲，号东坡居士、铁冠道人。嘉佑二年进士，累官至端明殿学士兼翰林学士，礼部尚书。南宋理学方炽时，加赐谥号文忠，复追赠太师。"
