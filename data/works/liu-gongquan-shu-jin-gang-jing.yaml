id: liu-gongquan-shu-jin-gang-jing
title: 唐柳公权书金刚般若波罗蜜经
aliases: []
author: 柳公权
dynasty: 唐
script: kai
carrier: beike
holder: 法国国家图书馆
rubbing: 唐代拓本
summary: 此《金刚般若波罗蜜经》拓本卷由唐代柳公权书。此拓本书于唐长庆四年（时柳公权四十七岁）。由強演，邵建和刻石（共十二块，每行十一字），后原石毁于宋代。此卷为唐拓孤本（一字未损）在清末敦煌石窟被发现后，被伯希和带走，现藏于法国国家图书馆。
description: "此《金刚般若波罗蜜经》拓本卷由唐代柳公权书。此拓本书于唐长庆四年（时柳公权四十七岁）。由强演，邵建和刻石（共十二块，每行十一字），后原石毁于宋代。此卷为唐拓孤本（一字未损）在清末敦煌石窟被发现后，被伯希和带走，现藏于法国国家图书馆。\
  \ \n 此《金刚经》（金刚般若波罗蜜多经）刻于唐长庆四年（824）四月，为柳公权四十七岁时所作。《金刚经》刻为横石，共十二块，每行十一字，原石毁于宋代。 1908 年在敦煌石窟发现唐拓孤本，一字未损，极为稀罕，是敦煌文献中的稀世珍宝。\
  \ \n 柳公权是与欧阳询、颜真卿并称的楷书家，唐以来，柳体楷书一直是人们临习的范本。此为柳公权早期作品，字不大但用笔灵巧劲健。虽多有与 “颜书” 同法之处，但明显地摒弃了 “蚕头雁尾” 的用笔之法。而多融入魏晋及初唐楷意，并掺之以北碑的骨力洞达。故初观此碑似觉平常，颇有剑拔弩张之势。然细察之则一招一式颇富变化，方劲整饬中寓清灵通秀之气。其一点二画，一如刀斫般齐整，干脆利落，节奏明快，极富动感。（介绍参考：\
  \ 胡传海 ） \n 卷末有记：長慶四年四月六日翰林 侍書 / 學士朝議郎行右補闕上輕車都尉賜緋魚袋 柳公權 為右街 / 僧錄準公書 / 強演 邵建和刻 \n柳公权，字诚悬，京兆府华原县人，唐朝大书法家。他担任侍书数十年，因书见重，历仕数朝，位至太子少傅，封河东郡公，追赠太子太师。他工于书法，尤其精通碑版楷书，开创\
  \ “柳体” 这一中国书法发展史上最后的楷书书体，成为唐朝楷书艺术最后的完善者。代表作有《玄秘塔碑》、《神策军碑》、《〈送梨帖〉 跋》等。 \n 《 金刚经 》全称《金刚般若波罗蜜经》、《能断金刚般若波罗蜜多经》，是大乘佛教般若部经典之一。相传是释迦牟尼佛在祗树给孤独园为须菩提尊者而宣说的经典，佛在此阐述一切法空，指出一切事物本体皆具空性，若要成就无上正等正觉，即所言阿耨多罗三藐三菩提，就要破除四相，破除我执、法执，乃至一切执着，应该要在\
  \ “不执着一切” 的基础下，生起菩提心，广度众生。"
