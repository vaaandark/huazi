id: cao-tang-shi-zhi-tu-juan
title: 草堂十志图卷
aliases: []
author: 欧阳询
dynasty: 唐
script: kai
carrier: moji
holder: 台北故宫博物院
summary: 唐代画家卢鸿博学善书画。唐玄宗屡征不仕，赐草堂听其隐居，据说曾描绘其隐居所在地的十处景象，被称为《草堂十志图》。画卷结合隐居生活与山水风光，以水墨绘成十景，相间以十景志词。此内含台北故宫博物院、大阪市立美术馆、北京故宫博物院藏绘卷三种。
description: "唐代画家卢鸿博学善书画。唐玄宗屡征不仕，赐草堂听其隐居，据说曾描绘其隐居所在地的十处景象，被称为《草堂十志图》。画卷结合隐居生活与山水风光，以水墨绘成十景，相间以十景志词。此内含台北故宫博物院、大阪市立美术馆、北京故宫博物院藏绘卷三种。\
  \ \n 《草堂十志》相传是卢鸿所撰的十段文字，描写他隐居处所附近的十个景点，画者即是根据他的文字绘制成图卷，故称《卢鸿草堂十志图》。后来的人因为误将卢鸿当作是画卷的作者，所以出现真伪的争议。实则，原画者并没有署名。传世三种《草堂十志图》卷，虽然都不是卢鸿的画作，却可以看到它们之间有很多相似之处，证明它们同出一源。其中品质及艺术水准以台北故宫博物院本《草堂十志图》卷为最高，至于对后世书画家的影响也最大。\
  \ \n 台北故宫博物院藏 大阪市立美术馆藏 \n 全卷水墨画十景，每景自成一段，每段前有褚、颜、柳等书写之 〈草堂十志〉 词，与十景相间。所绘皆为自然园林景致，其配置乃注重与周围自然环境相结合，树石造型古拙，用笔方硬，水墨渲染颇工。此作无名款，旧传为卢鸿之作。学界对此幅的断代，虽无定论，然时代应非为唐。虽非唐代画作，然有研究者订为五代十世纪，可能是与唐代卢鸿原本最为接近之摹本，为早期文人隐居山水的重要祖型，对中国历代隐居山水的图像表现，影响深远。\
  \ \n 引首清高宗（乾隆）题跋两则 \n 十景图 \n 草堂：草堂者。蓋因自然之磎阜。當墉洫。資人力之締構。後加茅茨。將以避燥濕。成棟宇之用。昭簡易。叶乾坤之德道。可容膝休閑。谷神同道。此其所貴也。及靡者居之。則妄為翦飾。失天理矣。詞曰。山為宅兮草為堂。芝蘭兮藥房。羅蘼蕪兮拍薜荔。荃壁兮蘭砌。蘼蕪薜荔兮成草堂。陰陰邃兮馥馥香。中有人兮信宜常。讀金書兮飲玉漿。童顏幽操兮長不易。（\
  \ 乾隆题跋：樸屋茨茅避燥濕。蘼蕪薛荔遞芳馨。童顏坐者手一卷。知是黄庭内外經。 ） \n 倒景臺：倒景臺者蓋太室南麓。天門右崖。傑峯如臺。氣凌倒景。登路有三處可憩。或曰三休臺。可以邀馭風之客。會絕塵之子。超逸真。盪遐襟。此其所絕也。及世人登焉。則魂散神越。目極心傷矣。詞曰。天門豁兮仙臺聳。傑屹崒兮零澒湧。窮三休兮曠一觀。忽若登崑崙兮中期汗漫。仙聳天開兮倒景臺。鯊顥氣兮軼囂埃。皎皎之子兮自獨立。雲可朋兮赮可吸。曾何榮辱之所及。（\
  \ 乾隆题跋： 太室崇隆走南麓。傑峯倒景聳成臺。幽人獨立雲霞表。不為聽呼萬歲來。 ） \n 樾館：樾館者。蓋即林取材。基巔柘。架茅茨。居不期逸。為不至勞。清談娛賓。斯為尚矣。及盪者鄙其隘閴。苟事宏湎。乖其賓矣。詞曰。紫巖隈兮青磎側。雲松煙蔦兮千古色。芳霍蘼兮蔭蒙蘢。幽人搆館兮在其中。霍蘼蒙蘢兮開樾館。臥風霄兮坐赭旦。粵有賓兮時戾止。樵蘇不爨兮清談已。永歲終期兮常若此。（\
  \ 乾隆题跋：一笠孤亭四柱虛。蒙籠嘉樾綠雲如。既稱素履相忘世。何較區區盪者居。 ） \n 枕煙廷：枕煙廷者。蓋特峰秀起。意若枕煙。秘廷凝虛。窅若仙會。即揚雄所謂爰靜神遊之廷是也。可以超絕紛世。永絕潔精神矣。及機士登焉。則寥閴戃恍。愁懷情累矣。詞曰。臨泱漭兮背青熒。吐雲煙兮合窅冥。怳欻翕兮沓幽靄。意縹緲兮群仙會。窅冥仙會兮枕煙廷。踈魂形兮凝視聽。聞夫至誠必感兮祈此巔。絜顥氣。養丹田。終仿像兮覯靈僊。（\
  \ 乾隆题跋：秀起高峯迥枕煙。振衣千仞意超然。身藏自足居上槩。誠感那須羨散僊。 ） \n 雲錦漴：雲錦漴者。蓋激溜衝攢。傾石叢倚。鳴湍疊濯。噴若雷風。詭輝分麗。煥若雲錦。可以瑩發靈矚。幽玩忘歸。及匪士觀之。則返曰寒泉傷玉趾矣。詞曰。水攢衝兮石叢聳。煥雲錦兮噴洶湧。苔駮犖兮草寅緣。芳羃羃兮瀨濺濺。水石攢叢兮雲錦漴。波連珠兮文沓絳。有絜冥者媚此幽。漱靈液兮樂天休。實獲我心兮夫何求。（\
  \ 乾隆题跋：獨坐厜㕒廣府峽流。目謀雲錦樂天休。悠然辭不汎然受。捷徑常嗤藏用儔。 ） \n 期仙磴：期仙磴者。蓋危磴穹窿。迥接雲路。靈仙髣髴。若可期及。儒者毀所不見。則黜之。蓋疑水之談信矣。詞曰。霏微陰壑兮氣騰虹。迤邐危磴兮上凌空。青霞杪兮紫雲垂。鸞歌鳳舞兮吹參差。鸞歌鳳舞兮期仙磴。鴻駕迎兮瑤華贈。山中人兮好神仙。想像聞此兮欲升烟。鑄月鍊液兮竚還年。\
  \ ( 乾隆题跋：入雲叢樾鎖嶔嵜。謁帝升天定不疑。漫說無端儒者毁。既仙何用更期為。 ) \n 滌煩磯：滌煩磯者。蓋穹谷峻崖。發地盤石。飛流攢激。積漱成渠。澡性滌煩。迥有幽致。可為智者說。難為俗人言。詞曰。靈磯盤礴兮溜奔錯。漱冷風兮鎮冥壑。研苔滋兮泉珠潔。一飲一憩兮氣想滅。磷漣清淬兮滌煩磯。靈仙境兮仁智歸。中有琴兮徽以玉。峨峨湯湯兮彈此曲。寄聲知音兮同所欲。（\
  \ 乾隆题跋：左右流泉中嶼平。携琴不摻膝前横。到斯應絕一切想。試問煩從何處生。 ） \n 羃翠庭：羃翠庭者。蓋崖巘積陰。林蘿沓翠。其上綿羃。其下深湛。可以王神。可以冥道矣。及喧者遊之。則酣謔永日。汨清薄厚。詞曰。清崖陰兮月磵曲。重幽疊邃兮隱淪躅。草拊綿羃兮翠蒙籠。當其無兮庭在中。當無有用兮羃翠庭。神可谷兮道可冥。有幽人兮張素琴。皇徽兮綠水陰。德之愔兮澹多心。（\
  \ 乾隆题跋：連林疊翠堪為幕。天地之間寄一身。離世自應成獨往。不知對坐又何人。 ） \n 洞元室：洞元室者。蓋因巖作室。即理談玄。室返自然。元斯洞矣。及邪者居之。則假容竊次。妄作虛誕。竟以盜言。詞曰。嵐氣肅兮嵓翠冥。室陰虛兮戶芳迎。披蕙帳兮促蘿筵。談空空兮覈元元。蕙帳蘿筵兮洞元室。秘而幽兮真可吉。返自然兮道可冥。澤妙思兮草玄經。結幽門兮在黃庭。（\
  \ 乾隆题跋：辭徵入殿偶為之。石室洞元應不離。大聚門徒至五百。真逃名亦是如斯。 ） \n 金碧潭：金碧潭者。蓋水潔石鮮。光涵金碧。巖葩林蔦。有助芳陰。鑒洞虛。道斯勝矣。而世生纏乎利害。則未暇遊之。詞曰。水碧色兮金光。灩熠熠兮濙湟湟。泉葩映兮煙蔦臨。紅灼灼兮翠陰陰。翠相鮮兮金碧潭。霜月洞兮煙景涵。有幽人兮好冥絕。炳其煥兮凝其潔。悠悠千古兮長不滅。（\
  \ 乾隆题跋：能書能畫兩超塵。傳得嵩山十志真。未必後來無繼者。山莊津逮有公麟。 ） \n 后隔水清高宗（乾隆）题跋 \n杨凝式题跋、周必大题跋 \n 拖尾：张孝思题跋、高士奇题跋 \n 观 在线浏览\
  \ 高清图（可自由缩放） \n 每段前题写志词：字体皆为楷书，但有的学欧阳询，有的学褚遂良，也有徐浩、颜真卿和柳公权的，并不全然相同。 [ 1 ] 介绍参考 ：《书艺珍品赏析 第 4 辑 书法名家·五代\
  \ 杨凝式》（黄纬中著） \n （介绍参考 ：《书艺珍品赏析 第 4 辑 书法名家·五代 杨凝式》（黄纬中著）） \n 卢鸿 ，又有说法名鸿一，《宣和画谱》载其字颢然，唐朝画家，活跃于公元七世纪至八世纪。原幽州范阳（今河北涿州市）人，迁居至洛阳，后隐居于嵩山。\
  \ \n 绘制信息 约晚唐五代（或南宋）时期绘本 ？ \n 绘制信息 唐人绘（旧传唐代 卢鸿 绘）"
