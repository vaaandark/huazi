id: lun-hua-ce
title: 论画册
aliases: []
author: 董其昌
dynasty: 明
script: xing
carrier: moji
holder: 台北故宫博物院
summary: 此《论画册》由明代著名书画家董其昌书。此册共二十帧（行书，一百六十二行，每行八字），其内容为作者品画、论画，评画家文章十一则。其笔法精熟，运笔流畅，线条粗细变化丰富。此册作于明万历四十四年（作者时年六十二岁），现藏于台北故宫博物院。
description: "此《论画册》由明代著名书画家董其昌书。此册共二十帧（行书，一百六十二行，每行八字），其内容为作者品画、论画，评画家文章十一则。其笔法精熟，运笔流畅，线条粗细变化丰富。此册作于明万历四十四年（作者时年六十二岁），现藏于台北故宫博物院。\
  \ \n 文中竭力推崇米芾父子和元四家，又论书画生熟，以及其著名的 “山水画分南北宗说” 、 “文人画说” 等。"
transcription: "第一则 ：看畫如看美人。其風神骨相。有肌體之外者。今人看古蹟。必先求形似。次及傅染。次及事實。殊非賞鑑之法也。米元章謂好事家。與賞鑑家。自是兩等。家多資力。貪名好勝。遇物收置。不過聽聲。此謂好事。若賞鑑。則天資高明。多閱傳錄。或自能畫。或深畫意。每得一圖。終日寶玩。如對古人。雖聲色之奉。不能奪也。看畫之法。不可一途而取。古人命意立迹。各有其道。豈拘以所見。繩律古人之意哉。燈下不可看畫。醉餘酒邊。亦不可看畫。卷舒不得其法。最為害物。\
  \ \n 第二则 ：收畫之法。道釋為上。蓋古人用工於此。欲覽者生敬慕愛禮之意。其次人物。可為鑒戒。其次山水。有無窮之趣。其次花草。其次畫馬。可以閱神駿。若仕女番族。雖精妙。非文房所可玩者。此元章之論也。今人收畫。多貴古而賤近。且如山水花鳥。宋之數人。超越往昔。但取其神妙。勿論世代可也。只如本朝趙子昂。金國王子端。宋南渡二百年間無此作。元章收晉六朝唐五代畫至多。在宋朝名筆。亦收置稱賞。若以世代遠近。不看畫之妙否。非真知者也。\
  \ \n 第三则 ：米芾元章。天資高邁。書法入神。宣和立書畫學。擢為博士。初見徽宗。進所畫楚山清曉圖。大稱旨。復命書周官篇於御屏。書畢。擲筆於地。大言曰。一洗二王惡札。炤耀皇宋萬古。徽宗潛立於屏風後。聞之。不覺步出。綜觀稱賞。元章再拜。求索所用端硯。因就賜。元章喜拜。置之懷中。墨汁淋漓朝服。帝大笑而罷。其為豪放類若此。作畫善寫古賢像。山水其源出董源。天真發露。怪怪奇奇。枯木松石。時出新意。然傳世不多。其子友仁。字元暉。能傳家學。作山水清致可掬。亦略變其尊人所為。成一家法。煙雲變滅。林泉點綴。生意無窮。平生亦珍重。不曾易予人。當時翟耆年有詩云。善畫無根樹。能描朦董山。如今身貴也。不肯與人間。其為世貴重如此。余平生凡收數卷。散失不存。今但有一橫批紙畫。上題數百字。全師董源。真元暉第一品也。其弟友知。亦善畫能書。元章云。幼兒友知代吾名書碑。及年大字更無辨。門下許侍郎尤愛其小楷。云每示簡。可使令嗣書。謂友知也。\
  \ \n 第四则 ：米南宮。襄陽人。自言從瀟湘得畫境。已隱京口南徐。江上諸山。絕類三湘奇境。墨戲長卷。今在余家。余洞庭觀秋湖暮雲良然。因大悟米家山法。 \n 第五则 ：米元暉自謂墨戲。足正千古畫史謬習。雖右丞亦在詆訶。致有巨眼。余以意為之。聊與高彥敬上下。非能米家父子之變也。\
  \ \n 第六则 ：杜東原先生嘗云。繪畫之事。胸中造化。吐露於筆端。恍惚變幻。象其物宜。足以啟人之高志。發人之浩氣。晉唐之人。以為玩物適情。無所關係。若曰黼黻皇猷。彌綸治具。至於圖史。以存鑒戒。豈無所關係哉。陳后山云。晚知詩畫真有得。却悔歲月來無多。亦此意也。\
  \ \n 第七则 ：畫與字各有門庭。字可生。畫不可熟。字須熟後生。畫須熟外熟。 \n 第八则 ：元季四大家。浙人居其三。王叔明湖州人。黄子久衢州人。吳仲圭武塘人。惟倪元鎮無錫人耳。江山靈氣。盛衰故有時。國朝名士。僅僅戴進為武林人。已有浙派之目。不知趙吳興亦浙人。若浙派日就澌滅。不當以甜斜俗賴者。係之彼中也。\
  \ \n 第九则 ：文人之畫。自王右丞始。其後董源。巨然。李成。范寬。為嫡子。李龍眠。王晉卿。米南宮。及虎兒。皆從董巨得來。直至元四大家。黄子久。王叔明。倪元鎮。吳仲圭。皆其正傳。吾朝文沈。則又遠接衣缽。若馬夏及李唐劉松年。又是大李將軍之派。非吾曹當學也。\
  \ \n 第十则 ：畫家之妙。全在煙雲變滅中。米虎兒謂王維畫。見之最多。皆如刻畫。不足學也。惟以雲山為墨戲。此語似偏。然山水中當著意生雲。不可用粉染。當以墨漬出。令如氣蒸。冉冉欲墮。乃可稱生動之韻。\
  \ \n 第十一则 ：今人觀畫。不知六法。開卷便加稱賞。或問其妙處。則不知所答。皆是平昔偶爾看熟。或附會一時。不知其緣。深可鄙笑。 \n 丙辰仲秋。董其昌書 \n 册末跋记：董其昌此册写完即为友人取去，十一年后才在瞿式耜\
  \ [ 1 ] 瞿式耜，字起田，号稼轩，苏州人，万历进士，南明大臣，清顺治六年（1649）被俘而死。瞿式耜虽为晚辈，两人交往却颇深，传世尚有数件董其昌为其所作之书画作品。 \n （瞿式耜，字起田，号稼轩，苏州人，万历进士，南明大臣，清顺治六年（1649）被俘而死。瞿式耜虽为晚辈，两人交往却颇深，传世尚有数件董其昌为其所作之书画作品。）\
  \ 的耕石斋中重遇，并认为秀媚溢于点画之间，与古人相去甚远。 \n 此冊余數年前所書。為友人持去。忽忽不復記憶。偶過虞山。訪稼軒先生於耕石齋。出所藏書畫見示。重覯此冊。展閱再四。覺秀媚之意。溢于毫端。知與古人相去甚遠耳。先生幸為祕之。勿以示人可也。丁卯春三月題。董其昌。\
  \ \n 董其昌 （1555 年—1636 年），字玄宰，号思白、香光居士，松江华亭（今上海市）人，谥文敏。明万历己丑进士，官至南京礼部尚书。天才隽逸，善书画，富收藏，尤精鉴赏。"
