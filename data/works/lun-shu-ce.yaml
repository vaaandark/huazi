id: lun-shu-ce
title: 论书册
aliases: []
author: 董其昌
dynasty: 明
script: xing
carrier: moji
holder: 台北故宫博物院
summary: 此《论书》册由明代董其昌书（作者时年五十九岁）。全册共十四开，董氏借 “哪吒拆骨” 与 “楞严八还” 之典，强调学书须遗貌取神，提出 “不还者是汝也” 的自我确立论。册中他犀利点评宋四家与赵孟頫，力尊二王正脉。全篇以羊毫笔写就，秀润流丽。此册现藏于台北故宫博物院。
description: "此《论书》册由明代董其昌书（作者时年五十九岁）。全册共十四开，董氏借 “哪吒拆骨” 与 “楞严八还” 之典，强调学书须遗貌取神，提出 “不还者是汝也” 的自我确立论。册中他犀利点评宋四家与赵孟頫，力尊二王正脉。全篇以羊毫笔写就，秀润流丽。此册现藏于台北故宫博物院。\
  \ \n 此册创作于明朝万历四十一年（1613 年）。此时，距离董其昌辞去 “湖广提学副使” 的官职已将近七年。他正闲居江南，并于四月下旬的游历途中创作此册。值得注意的是其使用的书写工具。董其昌在册末跋尾中特意点明，此册是用羊毫笔写就的。羊毫柔软，本不易体现犀利锋芒，但董其昌却能驾驭其软毫，写出圆润丰腴、牵丝引带、轻盈流动的行楷，线条提按变化极其微妙，完美展现了他对\
  \ “淡意” 与 “生拙” 艺术境界的极致追求。这不仅是一件精美绝伦的书法作品，更是体现董氏书学理论体系以及品评历代名家的 “正脉” 观。"
transcription: "宋高宗賜太子《蘭亭帖》手敕曰：「學五百本，更易他帖。」當時人主學書，至与寒士爭功力乃爾。趙吳興初師思陵書。今世傳馬、夏畫，多思陵題者，或云「樂壽老人」，皆高宗筆也。 \n\
  \ 那吒拆肉還父，拆骨歸還母，須有父母未生前身，始得《楞嚴》八還之義。所謂明還日月，暗還晦昧，不汝還者，非汝而誰？大慧師曰：「猶如籍沒盡，更向汝索錢貫。」此喻更佳。今有窮子，向大富長者稱貸錢刀，儼然富家翁。若一一償子錢，別有無盡藏，乃不貧乞；否則依然本相耳。此語余以論書法。待學得右軍、大令、虞、褚、顏、柳，一一相似，若一一還羲、獻、虞、褚、顏、柳，譬如籍沒還債已盡，何處開得一無盡藏？若學二王皮肉，還了輒無餘；若學右軍之靈和、子敬之俊逸，此難描難畫處，所謂不還者，是汝也。\
  \ \n 《官帖》十卷，猶如一大藏教，是如來禪，非祖師禪。我家楊少師帖，乃祖意也。宋時四家，於此發光。 \n 章子厚日臨《蘭亭帖》一本，東坡詆之曰：「從門入者不是家珍，子厚書必不高。」此巖頭點化峰雪存語也。雪峰通從前所悟，巖頭一一剗之曰：「汝向後欲播揚大教，須一一從自己胸中流出，蓋天蓋地去始得。」學書者作如是觀，乃不在前人腳根下盤旋。\
  \ \n 米老与人書論帖云：「開卷間，雲花滿眼。」此四字，是米老書旨，是他人藥，亦是米老病。米書除豔態不盡故耳。山谷之書，以人品高得名，實未有功，但質素之意在耳。雖云學《鶴銘》，亦不相似。子瞻有偃筆之病，特饒秀色，九華之外，天下無秀，坡公書以之。蔡君謨學顏魯公《爭坐位帖》、《祭文》二藁，絕似，但不能學《送明遠》、《太冲》二序筆法。然比之蘇、黃，最為心細。蘇、黃偏師取奇，以氣自豪，海內尊尚，益助筆興，非能深入山陰之室也。山東邢太僕子愿，與余論書云：「右軍之後，惟趙文敏獨接正脈。」此公書學，亦當世所希，第頂門眼未開，頗受法縛，遂有王、趙並推之論。吾聞子昂得米老《壯懷賦》闕數行，自為擬米書補之，幾度不似，乃擲筆歎曰：「今人不如古遠矣！」若子昂直接右軍，寧肯作此語？所謂「如人飲水，冷暖自知」也。\
  \ \n 祝京兆書，人不知其所自出。余於維揚見吳太學以褚河南草書《陰符經》見示，大叫喚曰：「祝京兆衣鉢也！」吳太學曰：「先人得之吳中，其前有枝指生圖印。此經非停雲所摹刻者。」恨書家少見之，不能印余語。\
  \ \n 余家所藏名跡，以懷仁《聖教序》為致佳，其次褚臨《禊帖》。然惟唐文皇敕數十字，尤所寶愛，以其用墨豪放取勢，可推其意，學《閣帖》文皇諸書耳。法帖雖有宋搨二王小楷，及李北海、徐季海諸古刻，至如顏魯公《乞米帖》、《馬病帖》、《明遠帖》，楊少師《挽定智大師詩》、《合浦散詩》、《洛陽風景詩》、《新步虛辭詩帖》，与米元章小楷，皆如頭目腦髓，時以自隨，不勝護惜。昔人得蕭子雲一字，為之作齋，諸書皆堪構齋以名也。以羊毛畫筆作書，差如意，遂能終卷。\
  \ \n 癸丑四月廿八日，其昌 \n 作者款识： 癸丑四月廿八日。其昌 \n 董其昌 （1555 —1636）字玄宰，号思白、思翁，别号香光居士，松江华亭（今上海市）人。明朝政治人物，书画家。万历己丑进士，官至留都南京礼部尚书。"
