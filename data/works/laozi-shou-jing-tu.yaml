id: laozi-shou-jing-tu
title: 老子授经图
aliases: []
author: 盛懋
dynasty: 元
script: li
carrier: moji
holder: 北京故宫博物院
summary: 此《老子授经图》卷由两部分组成：卷首为元代画家盛懋（款）白描《老子授经图》，其后为吴叡隶书老子《道德经》全文。卷后有明代胡子昂题七言诗一首、跋文一段。此纸本墨笔卷，经项元汴、张伯骏、清宫旧藏，现藏于北京故宫博物院。
description: "此《老子授经图》卷由两部分组成：卷首为元代画家盛懋（款）白描《老子授经图》，其后为吴叡隶书老子《道德经》全文。卷后有明代胡子昂题七言诗一首、跋文一段。此纸本墨笔卷，经项元汴、张伯骏、清宫旧藏，现藏于北京故宫博物院。\
  \ \n 《老子授经图》 [ 1 ] 原图无名，暂拟定此名 \n （原图无名，暂拟定此名） 左下角落元盛懋款，说明此卷当时以画而收藏，但经考证此款系后添，非盛氏手笔，而在后纸胡子昂题跋中也未提及此图，只论吴叡书法，可见此经卷应为吴叡隶书之佳作。此书作于元元统三年（1335\
  \ 年），吴氏时年三十八岁。吴叡传世书法作品较少，《道德经》为其隶书代表作，结体整齐工稳，字形大小一律，笔法方圆互用。虽有汉隶规模，而实依唐隶风范，五千言文字一气呵成，且无一懈笔，功力可观。清乾隆《秘殿珠林续编》著录。（介绍参考：\
  \ 李艳霞 ） \n 《道德经》全文后署款：「 元統三年乙亥正月朔濮陽吳叡為虛碧道士書於觀復齋 」款下鈐「 吳叡私印 」。 \n吴叡，字孟思，号雪涛散人、虚碧道士，先世为濮阳（今属河南）人，移居杭州，吾丘衍弟子。明刘基《覆集》云：“叡少好学，工翰墨，尤精篆、隶，凡历代古文款识制度，无不考究，得其要妙。\
  \ \n 《道德经》，春秋时期老子（李耳）的哲学作品，又称《道德真经》、《老子》、《五千言》、《老子五千文》，是中国古代先秦诸子分家前的一部著作，是道家哲学思想的重要来源。 \n 盛懋，字子昭，浙江嘉兴人，约活动于元至正时期。其家世代以画为业，他继承家学，善画人物、山水，风格近董源和赵孟頫，用笔较尖峭繁细，山石多用披麻、解索皴，设色明丽，主体面貌属董巨派系。\
  \ \n 观 在线浏览 高清图（可自由缩放） \n 绘制信息 元代绘，元统三年（乙亥 1335）书《道德经》"
layout: "纸本墨笔，24.8x117.7 厘米，隶书 \n署款：元統三年乙亥正月朔，濮陽吳叡為虛碧道士書於觀復齋"
