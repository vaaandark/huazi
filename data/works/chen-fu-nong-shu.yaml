id: chen-fu-nong-shu
title: 陈旉农书
aliases: []
dynasty: 宋
carrier: moji
holder: 河南省图书馆
summary: 此《农书》由南宋陈旉编撰。全书分上中下三卷，上卷总论土壤耕作和作物栽培，中卷讲述耕畜的饲养管理，下卷讲述有关种桑养蚕的技术。后附：秦观《蚕书》、楼璹《於潜令楼公进耕织二图诗》。此为明末毛氏汲古阁影宋抄本，行款格式与宋版刻本相同，抄写精美。
description: "此《农书》由南宋陈旉编撰。全书分上中下三卷，上卷总论土壤耕作和作物栽培，中卷讲述耕畜的饲养管理，下卷讲述有关种桑养蚕的技术。后附：秦观《蚕书》、楼璹《於潜令楼公进耕织二图诗》。此为明末毛氏汲古阁影宋抄本，行款格式与宋版刻本相同，抄写精美。\
  \ \n 陈旉（音：fū）《农书》是我国现存最早总结江南水稻栽培技术的一部农书。此书最早刊行于宋绍兴十九年 (1149)，知真州洪兴祖为其作序。此书之前的古农书，大都侧重耕作栽培技术的记述；而此书则从生产全局出发，以农业经营管理和生产技术二者并重。强调经营农业要有预见。防患于末然，所以一开始就须做好规划。提出经营规模\
  \ “不在连阡跨陌之多，唯其财力相称”；对生产基地，要根据地势高低不同。制订土地适宜的利用方式；农作物种植同样要计划安排，做到 “种无虚日，收无虚月” 。规划既定，还须认真贯彻执行。总之，陈旉把农业经营管理视为生产成败的关键性因素。书中还提出了\
  \ “用粪如用药” 的合理施肥思想，并全面总结了江南水稻栽培经验，对我国农业的发展作出了新贡献。 \n 末附《蚕书》是北宋文人秦观创作的农学专著，成书于元丰七年（1084 年），系统总结宋代以前兖州地区养蚕经验，创作背景包含秦观赴考途中观察山东兖州养蚕技术、结合家乡高邮蚕桑经验及其妻子的养蚕经验。\
  \ \n 《於潜令楼公进耕织二图诗》是南宋诗人、官吏楼璹（音：shú）所作的作品，旨在翔实记录农耕与蚕织过程。全书分《耕图》二十一首和《织图》二十四首，详述从浸种、耕作到入仓，以及浴蚕、剪帛的细致流程。\
  \ \n 目录、梁园村民输麦行 \n 农书序 [ 1 ] 作者自序，但前两页已佚失。 \n （作者自序，但前两页已佚失。） （陈旉撰） \n 农书卷上 ：财力之宜篇第一、地势之宜篇第二、耕耨之宜篇第三、天时之宜篇第四、六种之宜篇第五、居处之宜篇第六、粪田之宜篇第七、薅耘之宜篇第八、节用之宜篇第九、稽功之宜篇第十、器用之宜篇第十一、念虑之宜篇第十二、祈报篇、善其根苗篇\
  \ \n 农书卷中 ：牛说、牧养役用之宜篇第一、医治之宜篇第二 \n 农书卷下 ：蚕桑叙、种桑之法篇第一、收蚕种之法篇第二、育蚕之法篇第三、用火采桑之法篇第四、簇箔藏茧之法篇第五 \n 后序（陈旉撰）、洪真州题后（洪兴祖撰）、跋（陈旉撰）、跋（江纲撰）\
  \ \n 蚕书 ：种变、时食、制居、化治、钱眼、锁星、添梯、车、祷神、戎治 \n 於潜令楼公进耕织二图诗 \n耕图二十一首：浸种、耕、杷耨、耖、碌碡、布秧、淤荫、拔秧、插秧、一耘、二耘、三耘、灌溉、收刈、登场、持穗、簸扬、砻、舂碓、筛、入仓\
  \ \n织图二十四首：浴蚕、下蚕、喂蚕、一眠、二眠、三眠、分箔、采桑、大起、捉绩、上簇、炙箔、下簇、择茧、窖茧、缫丝、蚕蛾、祝谢、络丝、经、纬、织、攀花、剪帛 \n 农书序（楼钥撰） \n 卷端有毛氏汲古阁：\
  \ 宋本 、 毛晋 等印章，为明代毛氏影宋抄本，制作精美。 \n陈旉 [ 2 ] 《宋史·艺文志》和陈振孙的《书录解题》中均记载作者为「西山隐居全真子」陈雱，而《永乐大典》则记载为陈敷。经考证，汉代《郊祀歌》中「朱明旉与」一词，颜师古注释为「旉」为「古敷字」，因此《永乐大典》将「陈旉」改为「陈敷」；而「陈雱」则可能是因字形相近而误记。\
  \ \n （《宋史·艺文志》和陈振孙的《书录解题》中均记载作者为「西山隐居全真子」陈雱，而《永乐大典》则记载为陈敷。经考证，汉代《郊祀歌》中「朱明旉与」一词，颜师古注释为「旉」为「古敷字」，因此《永乐大典》将「陈旉」改为「陈敷」；而「陈雱」则可能是因字形相近而误记。）\
  \ ，自号 西山隐居全真子 ，又号如是庵全真子。生活于北宋末年至南宋初年偏安江南的战乱时期，居无定所，不求仕进，在真州（今江苏仪征）西山隐居务农。以种药治圃自给自足，绍兴十九年（1149 年），陈旉七十四岁时写成此书，经地方官洪兴祖刊印传播。\
  \ \n 明末清初藏书家毛晋的 “汲古阁” 以刻书精善、藏书宏富闻名。毛抄本，即毛氏汲古阁所制作的抄本，特指其影抄本。所谓 “影抄本”，是指工匠采用覆纸双勾、填墨的精细工艺，毫厘不差地复制原刻本的版式、行款、字行间距乃至字体神韵。这种抄本最大程度保留了宋元珍本的初态，笔墨流畅，具有极高的书法与艺术审美。\
  \ \n 出版信息 明末毛氏汲古阁影宋抄本"
