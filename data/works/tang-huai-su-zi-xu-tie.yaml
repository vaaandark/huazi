id: tang-huai-su-zi-xu-tie
title: 唐怀素自叙帖
aliases: []
author: 怀素
dynasty: 唐
script: cao
carrier: moji
holder: 台北故宫博物院
summary: 此《自叙帖》卷是唐朝书法家怀素的草书作品。怀素以草书闻名于乡里，后北上长安，当代名流纷纷赠诗赞美，唐代宗大历十二年（时五十三岁），其摘录诸家赠诗及颜真卿序，书成本卷（全文自叙其平生事）。全卷笔法瘦硬圆劲，使笔飞动圆转，如锥画沙。此卷现藏于台北故宫博物院。
description: "此《自叙帖》卷是唐朝书法家怀素的草书作品。怀素以草书闻名于乡里，后北上长安，当代名流纷纷赠诗赞美，唐代宗大历十二年（时五十三岁），其摘录诸家赠诗及颜真卿序，书成本卷（全文自叙其平生事）。全卷笔法瘦硬圆劲，使笔飞动圆转，如锥画沙。此卷现藏于台北故宫博物院。\
  \ \n 此帖内容为自述写草书的经历和经验，和当时士大夫对他书法的品评，即当时的著名人物如颜真卿、戴叙伦等对他的草书的赞颂。 \n 《自叙帖》是怀素流传下来篇幅最长的作品，也是他晚年草书的代表作。怀素自叙帖，世有三本，一在石阳休家，一在冯当世家，一在苏舜钦家。本卷即苏氏所藏者，用细笔劲毫写大字，笔画圆转遒逸，如曲折盘绕的钢索，收笔出锋，锐利如钩斫，所谓\
  \ “铁画银钩” 也。全卷强调连绵草势，运笔上下翻转，忽左忽右，起伏摆荡，其中有疾有速，有轻有重，像是节奏分明的音乐旋律，极富动感。此外也有点画分散者，则强调笔断意连，生生不息的笔势，笔锋回护钩挑，一字、一行，以至数行之间，点画互相呼应。通幅于规矩法度中，奇踪变化，神采动荡，实为草书艺术的极致表现。\
  \ \n 此《自叙帖》曾经南唐内府、宋苏舜钦、邵叶、吕辩、明徐谦斋、吴宽、文徵明、项元汴、清徐玉峰、安岐、清内府等收藏。据曾行公题，旧有米元章、薛道祖及刘巨济诸名家题识，今佚。宋米芾《宝章待访录》、黄伯思《东观馀论》、清安岐《墨缘汇观》等著录。据说，因避战祸，国民政府工作人员只将帖册带走，而将装帖册的木匣留在了北京故宫。现今，《怀素自叙帖》原迹珍藏于台北故宫博院，木匣藏于北京故宫博物院。\
  \ \n 卷后有跋二十四则 \n 清高宗乾隆题 跋 \n 自敘曾聞世有三。丹陽里巷艷叢談。張顛元奘多傾服。草聖禪機青出藍。雲中龍爪不模糊。妙法曾經悟擔夫。豪宕精神枯淡志。恍看李氏醉僧圖。乾隆御題 \n\
  \ 藏真字畫。豪邁中有淳穆之氣。此其所以神也。卷中古色盡然。杜衍。蘇轍諸跋。尤勝唐宋人真蹟。殊不多得。可不寶諸。乾隆戊辰仲夏御識。 \n 蘇耆 跋 \n 大中祥符三年九月五日。前進士蘇耆題。 \n 李建中\
  \ 跋 \n 四年嘉平月十有八日。直集賢院李建中看畢題。 \n 邵周 跋 \n 昇元四年二月日。文房副使銀青光祿大夫兼御史中丞臣邵周重裝。 \n 王？（漫漶）跋 \n 崇英殿副使知崇英院事兼文房官檢校工部尚書臣王？\
  \ \n 杜衍 跋 \n 題懷素自敘卷後。狂僧草聖繼張顛。卷後兼題大曆年。堪與儒門為至寶。武功家世久相傳。太子太師致仕杜衍記。時至和甲午中夏。在南都。 \n 蔣之奇 跋 \n 草書有妙理。惟懷素為得之。元豐六年十一月廿五日。蔣之奇書。\
  \ \n 蘇轍 跋 \n 世傳懷素書。未有若此完者。紹聖三年三月。予謫居高安。前新昌宰邵君。出以相示。予雖知其奇。然不能盡識其妙。予兄和仲。特善行草。時亦謫惠州。恨不令一見也。眉山蘇轍同叔記。 \n\
  \ 邵䶵 跋 \n 崇寧二年十二月十五日觀。邵䶵。 \n 蔣璨 跋 \n 辯老方艱難時。流離轉徙江湖間。猶能致意於此。可見志尚。又獲觀伯考少師品題。併以嘉嘆。紹興二年仲春廿三日。陽羨蔣璨。 \n 曾紆\
  \ 跋 \n 藏真自敘。世傳有三。一在蜀中石陽休家。黃魯直以魚牋臨數本者是也。一在馮當世家。後歸上方。一在蘇子美家。此本是也。元祐庚午。蘇液攜至東都。與米元章觀於天清寺。舊有元章及薛道祖劉巨濟諸公題識。皆不復見。蘇黃門題字。乃在八年之後。遂昌邵宰。疑是興宗諸孫。則蘇氏皆丹楊里巷也。今歸呂辯老。辯老父子。皆喜學書。故於兵火之間能終有之。紹興二年三月癸巳。空青老人曾紆公卷題。\
  \ \n 保之行 跋 \n 藏真草聖。所閱多矣。未有如自敘之精妙。筆法走龍蛇。悉具於此。壬子閏夏五日。保之行父景晉同觀。 \n 趙令畤 跋 \n 令畤夏日。與劉延仲呂辯老過都統太尉王公。觀法書名畫。如行山陰道上。映照人目。殆不可言。遂知兵火之餘。珍奇多大。莫此若也。因見辯老素師自敘。一洗累年胸中塵土。是真幸會。紹興二年五月十二日趙令畤德麟題。\
  \ \n 蘇遲 跋 \n 辯老藏懷素自敘。後有先人題字。蓋紹聖三年謫居高安時。為邵叶稽仲書也。不知流傳幾家。以至於辯老。紹興癸丑三月九日。遲觀於婺女馬軍橋潘氏之第。 \n 富直柔 跋 \n 興癸丑三月廿七日。洛陽富直柔觀。\
  \ \n 吳寬 跋 \n 素師自敘。初為南唐李氏物。歷蘇邵呂三氏。流傳轉徙。又不知幾家。今為宮傅謙齋先生徐公所藏。寬聞昔黃山谷作字。蘇長公從旁贊之。錢穆父云。惜不見懷素自敘。長公不以為然。後山谷獲見之。始深歎服。而書遂進。今卷後云。藏于蜀中石楊休家。以魚牋臨數本者是也。穎濱題字時尚恨其兄不及一見。顧寬何人。乃得預此榮觀。賞玩之際。豈勝欣幸。及觀序內。有擔笈杖錫西游上國等語。知書雖學之一節。欲造微處。其精勤若此。則學之大於此者。可以小得而自足乎。然則予之欣幸。又不在此驚蛇走虺驟雨旋風間而已也。弘治六年七月既望。長洲吳寬題。\
  \ \n 李東陽 跋 \n 懷素自敘帖。本蘇舜欽家物。前六行。乃舜欽所補。見於書譜。而此卷正合。其為真蹟無疑。然具眼者觀之。固不待此也。舊聞祕閣有石本。今不及見。見此卷于少師謙齋徐公者再。往復披玩。不能釋手。敬識而歸之。弘治十一年九月三日。長沙李東陽。\
  \ \n 文徵明 跋（石刻拓印） \n 藏真書。如散僧入聖。雖狂怪怒張。而求其點畫波發。有不合於軌範者蓋鮮。東坡謂如沒人操舟。初無意於濟否。是以覆却萬變。而舉止自若。其近於有道者邪。若此自敘帖。蓋無毫髮遺恨矣。曾空青跋語。謂世有三本。而此本為蘇子美所藏。余按米氏寶章待訪錄云。懷素自敘在蘇泌家。前一帋破碎不存。其父舜欽補之。又嘗見石刻有舜欽自題云。素師自敘前帋糜潰。不可綴緝。書以補之。此帖前六行。帋墨微異。隱然有補處。而乃無此跋。不知何也。空青又云。馮當世本後歸上方。而石刻為內閣本。豈即馮氏所藏邪。又此帖有建業文房印及昇元重裝歲月。是曾入南唐李氏。而黃長睿東觀餘論。有題唐通叟所藏自敘。亦云南唐集賢所畜。則此帖又嘗屬唐氏。而長睿題字。乃亦不存。以是知轉徙淪失。不特米薛劉三人而已。成化間。此帖藏荊門守江陰徐泰家。後歸徐文靖公。文靖沒。歸吳文肅。最後為陸冢宰所得。陸被禍。遂失所傳。徃歲先師吳文定公。嘗從荊門借臨一本。間示徵明曰。此獨得其形似耳。若見真蹟。不啻遠矣。蓋先師殁二十年。始見真蹟。回視臨本。已得十九。特非郭填。故不無小異耳。昔黃長睿。謂古人搨書。如水月鏡像。必郭填乃佳。郭填謂雙鈎墨填耳。余既獲觀真蹟。遂用古法雙鈎入石。累數月始就。視吳本。雖風神氣韻。不逮遠甚。而點畫形似。無纖毫不備。庶幾不失其真也。長洲文徵明識。\
  \ \n 陸修 跋 \n 嘉靖壬辰六月廿又二日。長洲陸氏水鏡堂藏石。（章簡甫刻） \n 自敘帖釋文及文彭 跋 \n 嘉靖壬辰夏五月望日。雁門文彭書于水鏡堂。 \n 高士奇 跋 \n 唐懷素書。奇縱變化。超邁前古。其自敘一卷。尤為生平狂草。然細以理度（點去）脉按之。仍不出於規矩法度也。此卷為南唐後主所藏。有建業文房之印。後歸蘇易簡處。蘇耆。易簡之子。成進士。祥符間。以父蔭補官。題名者是也。其子舜欽。號才翁。以玉清昭應宮災上疏。名動當世。工草書。米元章書史云。懷素自敘真蹟。在蘇泌家。前一幅破碎。其父集賢校理舜欽自寫補之。今前六行紙色少異。然亦莫辨其為補書。正是當時真蹟。至其運筆縱橫。神采動蕩。想見素師興酣落紙時。合縫處有四代相印。相傳為唐某宗賜小蘇許公玉刻圖記。必才翁家物。宋代名賢題跋。歷年久遠。完好如故。更不易得。明吳文定李文□二公跋。為謙齋徐少師所藏。近有人持至京師。玉峰徐公積總裁堂饌銀半千得之。頃以長夏借觀。留几案數月。其紙尾第四跋。崇英副使知崇英院事兼文房官檢校工部尚書王紹顏。當是南唐人。失紹顏二字。余所藏宋搨祕帖本有之。世間一物。前後必有其主。如四代相印之歸才翁。少師所藏之歸玉峰公也。余頑陋無知。妄綴卷尾。有愧吳李二公云。康熙癸酉十一月初八日。江村高士奇謹跋。\
  \ \n 文彭 跋 \n 嘉靖庚寅孟冬。獲觀藏真自敘於陳湖陸氏。謹摹一過。文彭。 \n 項元汴 跋 \n 唐僧懷素草書自敘帖真蹟。明墨林山人項元汴珍祕。其值千金。"
transcription: "懷素家長沙。幼而事佛。經禪之暇。頗好筆翰。然恨未能遠覩前人之奇迹。所見甚淺。遂擔笈杖錫。西遊上國。謁見當代名公。錯綜其事。遺編絕簡。往往遇之。豁然心胸。略無疑滯。魚牋絹素。多所塵點。士大夫不以為怪焉。顏刑部書家者流。精極筆法。水鏡之辯。許在末行。又以尚書司勳郎盧象。小宗伯張正言。曾為歌詩。故敘之曰。開士懷素。僧中之英。氣概通疎。性靈豁暢。精心草聖。積有歲時。江嶺之間。其名大著。故吏部侍郎韋公陟。覩其筆力。勗以有成。今禮部侍郎張公謂。賞其不羈。引以遊處。兼好事者同作歌以贊之。動盈卷軸。夫草稿之作。起於漢代。杜度。崔瑗。始以妙聞。迨乎伯英。尤擅其美。羲獻茲降。虞陸相承。口訣手授。以至于吳郡張旭長史。雖姿性顛逸。超絕古今。而模（疑衍文）楷精法（疑兩字顛倒）詳。特為真正。真卿早歲常接遊居。屢蒙激昂。教以筆法。資質劣弱。又嬰物務。不能懇習。迄以無成。追思一言。何可復得。忽見師作。縱橫不群。迅疾駭人。若還舊觀。向使師得親承善誘。函挹規模。則入室之賓。捨子奚適。嗟歎不足。聊書此以冠諸篇首。其後繼作不絕。溢乎箱篋。其述形似。則有張禮部云。奔蛇走虺勢入座。驟雨旋風聲滿堂。盧員外云。初疑輕煙澹古松。又似山開萬仞峰。王永州邕曰。寒猿飲水撼枯藤。壯士拔山伸勁鐵。朱處士遙云。筆下唯看激電流。字成只畏盤龍走。敘機格。則有李御史舟云。昔張旭之作也。時人謂之張顛。今懷素之為也。余實謂之狂僧。以狂繼顛。誰曰不可。張公又云。稽山賀老粗知名。吳郡張顛曾不易。許御史瑤云。志在新奇無定則。古瘦灕驪半無墨。醉來信手兩三行。醒後却書書不得。戴御史叔倫云。心手相師勢轉奇。詭形恠狀翻合宜。人人欲問此中妙。懷素自言初不知。語疾速。則有竇御史冀云。粉壁長廊數十間。興來小豁胸中氣。忽然絕叫三五聲。滿壁縱橫千萬字。戴公又云。馳毫驟墨列奔駟。滿座失聲看不及。目愚劣。則有從父司勳員外郎吳興錢起詩云。遠錫無前侶。孤雲寄太虛。狂來輕世界。醉裡得真如。皆辭旨激切。理識玄奧。固非虛蕩之所敢當。徒增愧畏耳。時大曆丁巳冬十月廿有八日。\
  \ \n 全卷共 126 行，698 字。书于唐大历十二年 (公元 777 年) 。六行早损，为北宋苏舜钦补书。帖前有明李东阳篆书引首 “藏真自序” 四字。 \n怀素（活动于八世纪后半），俗姓钱，字藏真，湖南长沙（一说零陵）人。自幼出家，经禅之余，从事艺文，尤好草书。好饮酒，及其酒酣兴发，寺壁屏幛、衣裳器具，靡不书之，时人谓之\
  \ “醉僧” 。自言得草书三昧，有 “狂僧” 之称。"
