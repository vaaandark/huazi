id: zhu-ti-zhuan-shu-ce
title: 诸体篆书册
aliases: []
author: 朱松
dynasty: 宋
script: zhuan
carrier: moji
holder: 台北故宫博物院
summary: 此《诸体篆书》册由明代陆一岳书。全册共六十开，每开用不同篆体书写韦斋先生（朱松）所作的七言绝句，始于：灯夕在试院用旧韵（悬鍼篆），终于：卜居邨落（玺书）。前为篆体本文、后附隶书释文并注解该字体的历史渊源或传说。此册书于明正德二年，现藏于台北故宫博物院。
description: 此《诸体篆书》册由明代陆一岳书。全册共六十开，每开用不同篆体书写韦斋先生（朱松）所作的七言绝句，始于：灯夕在试院用旧韵（悬鍼篆），终于：卜居邨落（玺书）。前为篆体本文、后附隶书
transcription: "并注解该字体的历史渊源或传说。此册书于明正德二年，现藏于台北故宫博物院。 \n 此册集中展现了六十种不同体式、形态各异的篆书，其中包含了许多我们在常规书法中极少见到的奇特篆体，例如：悬针篆、垂露篆、倒薤书、柳叶篆、科斗书、鹄头书、坟书、穗书、飞帛书等。这些字体往往将笔画与自然物象（如鸟兽、植物、水滴、星象）相结合，极具装饰意趣。\
  \ \n 01，懸鍼篆 \n 韋齋朱先生詩。燈夕在試院用舊韻。（隸書）。隔牆歌頌聒悲涼。信馬狂心墮渺茫。報答風光吾老矣。小窗讀易靜焚香。（篆書）。隔牆歌頌聒悲涼。信馬狂心墮渺茫。報答風光吾老矣。小窗讀易靜焚香。懸鍼篆。李斯小篆之異體。古石居士。（隸書）\
  \ \n 02，垂雲篆 \n 韋齋朱先生詩。芍藥。（隸書）。紅顏素臉出春殘。裊裊傳傳態自完。香道揚州冠天下。何年跨鶴往吟看。（篆書）。紅顏素臉出春殘。裊裊傳傳態自完。香道揚州冠天下。何年跨鶴往吟看。垂雲篆。皇帝時作卿雲書。後人廣其文。而是體行焉。古石居士。（隸書）\
  \ \n 03，雲霞書 \n 韋齋朱先生詩。示謝彥翔。（隸書）。后身梅福與誰論。正有幽人夙契敦。更欲上書陳世事。卻來微服守吳門。（篆書）。後身梅福與誰論。正有幽人夙契敦。更欲上書陳世事。卻來微服守吳門。雲霞書。書譜有體不載姓氏。或云李通古玉箸之法也。古石居士。（隸書）\
  \ \n 04，落華流水文 \n 韋齋朱先生詩。社日遊南臺。（隸書）。作社無人喚拾遺。不妨步屧趁兒嬉。一壺春色千峰頂。回首他年憶此時。（篆書）。作社無人喚拾遺。不妨步屧趁兒嬉。一壺春色千峰頂。回首他年憶此時。落華流水文。變李斯玉箸篆之遺法。作五襍組錦繡之文。古石居士。（隸書）\
  \ \n 05，商鼎文 \n 韋齋朱先生詩。南谿道中。（隸書）。千峰踏遍一筇隨。草軟步平沙卻宜。細徑忽扳飛鳥外。故知腰腳未應衰。（篆書）。千峰踏遍一筇隨。草軟平沙步卻宜。細徑忽扳飛鳥外。故知腰腳未應衰。商鼎文。商高宗時祖乙祖己勒銘于鼎之文。古石居士。（隸書）\
  \ \n 06，垂珠篆 \n 韋齋朱先生詩。寄范伯達。（隸書）。名籍丹丘號散人。何時香火共朝真。只應經世平生意。未合歸愚便問津。（篆書）。名籍丹丘號散人。何時香火共朝真。只應經世平生意。未合歸愚便問津。垂珠篆。李斯上蔡人。始皇丞相也。參古文籀篆變是體。古石居士。（隸書）\
  \ \n 07，鸞鳳書 \n 韋齋朱先生詩。洗兒。（隸書）。舉子三朝壽一曲。百年歌好笑掀須。厭兵以識天公意。不忍回頭更指渠。（篆書）。舉子三朝壽一曲。百年歌好笑掀須。厭兵以識天公意。不忍回頭更指渠。鸞鳳書。少昊金天氏立也。鳳鳥至。以鳥紀官。故有此書。古石居士。（隸書）\
  \ \n 08，墳書 \n 韋齋朱先生詩。燈夕。（隸書）。我觀世界只兒嬉。一戲相從更莫辭。綺語未忘餘習在。明朝與龢紫姑詩。（篆書）。我觀世界只兒（缺嬉字）。一戲相從更（多嬉字）莫辭。綺語未忘餘習在。明朝與和紫姑詩。墳書。周媒氏以仲春之月。判合男女。以書納采之文。作此書。古石居士。（隸書）\
  \ \n 09，虹炁書 \n 韋齋朱先生詩。和幾叟秋日南浦。（隸書）。平生學道者功深。世事縈人真此心。賴有關西門下士。洛川流派得重潯。（篆書）。平生學道者功深。世事縈人真此心。賴有關西門下士。洛川流派得重潯。虹炁書。前代虹見五采紀瑞。而作此書。亦史籀大篆之遺意也。古石居士。（隸書）\
  \ \n 10，殳書 \n 韋齋朱先生詩。太康道中。（隸書）。一色春勻萬樹訌。坐愁吹作雪漫空。誰知榆莢楊荂意。只擬春殘卷地風。（篆書）。一色春勻萬樹訌。坐愁吹作雪漫空。誰知榆莢楊荂意。只擬春殘卷地風。殳書。周伯氏所職殳書者。文記笏武記殳。因而製之銘。古石居士。（隸書）\
  \ \n 11，芝英書 \n 韋齋朱先生詩。送華倡酬。（隸書）。幽樹團團謝傅家。凌寒方澤共驚嗟。要知折寄殷勤意。鶗鴂那能病物華。（篆書）。幽樹團團謝傅家。凌寒方澤共驚嗟。要知折寄殷勤意。鶗鴂那能病物華。芝英書。漢武帝題達章闕。別有十三體。芝英其一也。后紀瑞復興。古石居士。（隸書）\
  \ \n 12，小篆 \n 韋齋朱先生詩。太康道中。（隸書）。得春榆柳遍平郊。猶見藏鴉景未交。動地風來一披拂。青黃淺淺抹林梢。（篆書）。得春榆柳遍平郊。猶見藏鴉影未交。動地風來一披拂。青黃淺淺抹林梢。小篆。秦丞相李斯所製。參古文改省作小篆。斯即小篆之祖也。古石居士\
  \ \n 13，鶴頭書 \n 韋齋朱先生詩。吳山道中。（隸書）。春攻試手雨初晴。遙見莓莓曲埭青。閒道東陂新漲好。來將衰髮照星星。（篆書）。春工試手雨初晴。遙見莓莓曲埭青。閒道東陂新漲好。來將衰髮照星星。鶴頭書。漢時詔版所用。又謂之尺一簡。出於蕭何張良之筆意也。古石居士。（隸書）\
  \ \n 14，蠶書 \n 韋齋朱先生詩。墨梅。（隸書）。一枝春曉破霜煙。景寫清陂最可憐。衲被犯寒歸吮墨。也知無地著朱鉛。（篆書）。一枝春曉破霜煙。影寫清陂最可憐。衲被犯寒歸吮墨。也知無地著朱鉛。蠶書。秋胡子妻。魯人。因夫遠宦。三年不歸。幽居懷思。玩蠶而作此書。古石居士。（隸書）\
  \ \n 15，鬼斗文 \n 韋齋朱先生詩。送華倡酬。（隸書）。娟娟華竹淨名家。閱世夸毗浪怨嗟。願挈眾生辭熱惱。知君久學妙蓮華。（隸書）。娟娟華竹淨名家。閱世夸毗浪怨嗟。願挈眾生辭熱惱。知君久學妙蓮華。鬼斗文。或云即王莽作威斗以壓勝水兵。斗上有此文。鬼即威字之譌。古石居士。（隸書）\
  \ \n 16，剪刀篆 \n 韋齋朱先生詩。燈夕。（隸書）。我欲安心未有方。至人遺迹已茫茫。自非窣堵波中老。誰直先生一瓣香。（篆書）。我欲安心未有方。至人遺迹已茫茫。自非窣堵波中老。誰直先生一瓣香。剪刀篆。李斯改省古文之后。又為八體。其一曰剪刀篆。即小篆之異。古石居士。（隸書）\
  \ \n 17，刻符畫 \n 韋齋朱先生詩。九日。（隸書）。點點吳霜入鬂毛。長安落葉又秋高。世間俯仰終難強。歸與兒曹且漱醪。（篆書）。點點吳霜入鬂毛。長安落葉又秋高。世間俯仰終難強。歸與兒曹且漱醪。刻符畫。史籀大篆之後。別為十三體。此即印璽之文也。古石居士。（隸書）\
  \ \n 18，飛帛書 \n 韋齋朱先生詩。梅華。（隸書）。霜溪咽絕照冰姿。誰見無人弄景時。香逐曉風穿暗戶。夢隨落月掛寒枝。（篆書）。霜溪咽絕照冰姿。誰見無人弄影時。香逐曉風穿暗戶。夢隨落月掛寒枝。飛帛書。蔡雝字伯皆。待詔時見人堊帚成字。作飛帛書。邕即飛帛之祖也。古石居士。（隸書）\
  \ \n 19，魚書 \n 韋齋朱先生詩。蓼荂。（隸書）。長年心事只悠悠。衰鬂難禁歲月流。紅蓼垂垂煙雨裡。不應搖落始知秋。（篆書）。長年心事只悠悠。衰鬂難禁歲月流。紅蓼垂垂烟雨裡。不應搖落始知秋。魚書。武王伐紂。師渡孟津。白魚人于王舟。於是命史佚作魚書。古石居士。（隸書）\
  \ \n 20，懸鐵書 \n 韋齋朱先生詩。夜坐。（隸書）。九秋風露浩難平。伍子祠南鶴唳清。坐聽兒曹談往事。世間更覺總忘情。（篆書）。九秋風露浩難平。伍子祠南鶴唳清。坐聽兒曹談往事。世間更覺總忘情。縣鐵書。周宣王時。柱下史籀作大篆。后人取法於籀。以變是體。古石居士（隸書）\
  \ \n 21，獅篆 \n 韋齋朱先生詩。謝人寄茶。（隸書）。寄我新詩錦繡端。解包更得鳳山團。分無心賞陪顛陸。只有家風似嬾殘。（篆書）。寄我新詩錦繡端。解包更得鳳山團。分無心賞陪陸顛。只有家風似嬾殘。獅篆。古昔聖王紀瑞而作。此書魏武帝亦嘗見而奇之。古石居士（隸書）\
  \ \n 22，連珠篆 \n 韋齋朱先生詩。立春日雷。（隸書）。陌上冬乾泣老農。平留甘雨付春工。阿香急試雷霆手。莫放人間有臥龍。（篆書）。陌上冬乾泣老農。平留甘雨付春工。阿香急試雷霆手。莫放人間有臥龍。連珠篆。僊人姑射所書。亦李斯小篆後之遺灋也。古石居士。（隸書）\
  \ \n 23，瑞華書 \n 韋齋朱先生詩。櫻桃。（隸書）。香英狼籍夕無餘。償香殘王戈一斛珠。猶帶徹酸餉嘉客。為嫌啼鳥啄紅膚。（篆書）。香英狼籍夕無餘。償香殘王戈一斛珠。猶帶徹酸餉佳客。為嫌啼鳥啄紅膚。瑞華書。齊武帝見落英茂木而作瑞華之書。古石居士。（隸書）\
  \ \n 24，麒麟書 \n 韋齋朱先生詩。襍小詩。（隸書）。江南風物略知津。便覺詩成筆有神。不向九江看五老。故應猶未是詩人。（篆書）。江南風物略知津。便覺詩成筆有神。不向九江看五老。故應猶未是詩人。麒麟書。孔子作春秋。絕筆於哀公十三年之西狩獲麟。弟子為素王紀瑞而作。古石。（隸書）\
  \ \n 25，鼎小篆 \n 韋齋朱先生詩。書護國上方。（隸書）。久知喧寂兩空華。分別應緣一念邪。為問脫靴吟芍藥。何如煑茗對梅華。（篆書）。久知喧寂兩空華。分別應緣一念邪。為問脫靴吟芍藥。何如煑茗對梅華。鼎小篆。漢武帝汾陰得鼎作小篆。古石居士。（隸書）\
  \ \n 26，龍書 \n 韋齋朱先生詩。宿鵝湖寺。（隸書）。人間狡兔開弎窟。天上夜叉守九關。却伴衲僧林下住。會須石似此心頑。（篆書）。人間狡兔開弎窟。天上夜叉守九關。却伴衲僧林下住。會須石似此心頑。龍書。太昊伏羲氏立有龍瑞。以龍紀官。命飛龍朱襄氏作此書。華亭陸一岳書。（隸書）\
  \ \n 27，卿雲書 \n 韋齋朱先生詩。湘江喚舟圖。（隸書）。天厓投老鬂驚秋。夢想長江碧玉流。忽對畫圖揩病眼。失聲便欲喚歸舟。（篆書）。天涯投老鬂驚秋。夢想長江碧玉流。忽對畫圖揩病眼。失聲便欲喚歸舟。卿雲書。皇帝軒轅氏姓公孫。以土德王慶雲見。以雲紀官作此書。古石居士。（隸書）\
  \ \n 28，科斗書 \n 韋齋朱先生詩。送住郎。（隸書）。同扳梅蕊便分攜。迴鷹峰前試采衣。學就浯溪厓上字。雁迴莫遣信音稀。（篆書）。同扳梅蕊便分攜。回鷹峰前試采衣。學就浯溪厓上字。雁迴莫遣信音稀。科斗書。顓頊高陽氏有此書。蓋出古文。或云顓頊所制也。古石居士。（隸書）\
  \ \n 29，柳葉篆 \n 韋齋朱先生詩。謁僧不遇。（隸書）。支公去不鎖禪扉。熟境應留夢裡歸。我欲寄眠公榻上。此心渾佀片雲飛。（篆書）。支公去不鎖禪扉。熟境應留夢裡歸。我欲寄眠公榻上。此心渾佀片雲飛。柳葉篆。李斯字通古。上蔡人。作小篆後別出柳葉諸體。古石居士。（隸書）\
  \ \n 30，龜書 \n 韋齋朱先生詩。示金確然。（隸書）。牢落天厓身百憂。故人千里肯相投。知君強記當年事。莫說家山赤淚流。（篆書）。牢落天涯身百憂。故人千里肯相投。知君強記當年事。莫說家山赤淚流。龜書。帝堯陶唐氏外國進一巨龜。背上有文。因命作龜書。古石居士。（隸書）\
  \ \n 31，蟲書 \n 韋齋朱先生詩。梅華。（隸書）。春歸幽谷轉徹和。以覺粘枝玉蕊多。天女淨香婪月下。相逢依約到無何。（篆書）。春歸幽谷轉徹和。以覺粘枝玉蕊多。天女淨香焚月下。相逢依約到無何。蟲書。倉頡以降。書凡五變。秦滅古文有八體。其三曰虫書。古石居士。（隸書）\
  \ \n 32，周鼎文 \n 韋齋朱先生詩。書釗京園壁。（隸書）。心空無地著塵沙。對鏡何曾一念差。戲取大千歸丈室。來妨衣襋亂天華。（篆書）。心空無地著塵沙。對鏡何曾一念差。戲取大千歸丈室。來妨衣襋亂天華。周鼎文。史佚文王史官也。事武王成王時。鑄鼎勒銘之文。古石居士。（隸書）\
  \ \n 33，竹葉書 \n 韋齋朱先生詩。次雪峰韻。（隸書）。麗日踈煙破小春。雙峰秀色一番新。要御天上金雞粟。莫問人間白眼人。（篆書）。麗日踈煙破小春。雙峰秀色一番新。要御天上金雞粟。莫問人間白眼人。竹葉書。后人變李斯小篆之法。時與柳葉篆並行于世。古石居士。（隸書）\
  \ \n 34，漢鼎文 \n 韋齋朱先生詩。春晚。（隸書）。梅子生仁柳絮催。春風塵迹只蒼菭。繁華一夢年年事。長是初鶯為喚迴。（篆書）。梅子生仁柳絮催。春風塵迹只蒼菭。繁華一夢年年事。長是初鶯為喚回。漢鼎文。諸葛孔明仕漢。嘗作三鼎勒銘。倣九鼎之遺法。古石居士。（隸書）\
  \ \n 35，垂露篆 \n 韋齋朱先生詩。芍藥。（隸書）。舞罷春風睡思深。東君更與纏腰金。頹簷醉尉華應笑。那有當年幕客心。（篆書）。舞罷春風睡思深。東君更與纏腰金。頹簷醉尉華應笑。那有當年幕客心。垂露篆。李斯後小篆之異體。古石居士。（隸書）\
  \ \n 36，龍爪書 \n 韋齋朱先生詩。畫雪梅。（隸書）。詩人未見雪梅畫。只識前村橫水枝。百巧摸香摹不出。此詩風味略相宜。（篆書）。詩人未識雪梅畫。只見前邨橫水枝。百巧摸香摹不出。此詩風味略相宜。龍爪書。自飛龍朱襄氏作龍之後。復有是體。或云王右軍作。古石居士。（隸書）\
  \ \n 37，鳥迹篆 \n 韋齋朱先生詩。松江。（隸書）。塵緣挽我去漁磯。迴首滄州此願違。偶寄一舟江上去。只無蒻笠與衰衣。（篆書）。塵緣挽我去漁磯。回首滄州此願違。偶寄一舟江上去。只無箬笠與衰衣。鳥迹篆。淮南子云。天雨粟。鬼夜哭。此倉頡造書成時也。其書觀龜文鳥迹之象。古石。（隸書）\
  \ \n 38，大篆 \n 韋齋朱先生詩。漁父。（隸書）。綠衰青蒻一身輕。臥看行雲舟自橫。米賤魚肥美無度。不知東海正掀鯨。（篆書）。綠衰青箬一身輕。臥看行雲舟自橫。米賤魚肥美無度。不知東海正掀鯨。大篆。史籀周宣王太史。取倉頡形意為大篆。籀即大篆之祖也。古石居士。（隸書）\
  \ \n 39，鵠頭書 \n 韋齋朱先生詩。遊妙峰菴。（隸書）。朝煥南岡一枝藜。忽投深壑得禪栖。共言伐翳通樵徑。后日重來路恐迷。（篆書）。朝煥南岡一枝藜。忽投深壑得禪栖。共言伐翳通樵徑。後日重來路恐迷。鵠頭書。漢家詔版所用。又謂之尺一簡。古石居士。（隸書）\
  \ \n 40，星斗文 \n 韋齋朱先生詩。宿石龍寺。（隸書）。風傳萬籟有喧寂。月入千波無淺深。應言此身非我有。窗間誰伴夜蟲吟。（篆書）。風傳萬籟有喧寂。月入千波無淺深。應言此身非我有。窗間誰伴夜蟲吟。星斗文。前代紀景星之瑞。盛於宋之符籙章。亦卿雲之例也。古石居士。（隸書）\
  \ \n 41，鳳炁書 \n 韋齋朱先生詩。示謝彥翔。（隸書）。滿川秀色野陰踈。知有儒僊隔水廬。借我玉函河上語。只看尺許定何如。（篆書）。滿川秀色野陰踈。知有儒仙隔水廬。借我玉函河上語。只看尺許定如何。鳳炁書。少昊時鳳鳥至。紀瑞作書。後世書家變其體。古石居士。（隸書）\
  \ \n 42，玉箸篆 \n 韋齋朱先生詩。石門寺。（隸書）。橘刺藤梢罷客衣。直緣微祿得奔馳。懸知投老歸田味。只似登山困睡時。（篆書）。橘刺藤梢罷客衣。直緣微祿得奔馳。懸知投老歸田味。只似登山困睡時。玉箸篆。李斯作小篆改省。著倉頡篇九章。世謂之玉箸篆。古石居士。（隸書）\
  \ \n 43，遊絲小篆 \n 韋齋朱先生詩。示僧。（隸書）。清谿淨寫碧巑岏。雨後相攜石路乾。認取此山巉絕景。他年何處鉢中看。（篆書）。清溪淨寫碧巑岏。雨後相攜石路乾。認取此山巉繼影。他年何處鉢中看。遊絲小篆。李斯細篆省文細篆。即璽書之異名也。古石居士。（隸書）\
  \ \n 44，轉宿篆 \n 韋齋朱先生詩。寄湛師。（隸書）。一月分身入葛池。道人何處不相隨。臥聽絕壑傳風籟。歷歷新詩自緣飢。（篆書）。一月分身入葛池。道人何處不相隨。臥聽絕壑傳風籟。歷歷新詩世不知。轉宿篆。春秋時宋景公因縈惑退舍命司星子韋作。古石居士。（隸書）\
  \ \n 45，松枝文 \n 韋齋朱先生詩。將還政和。（隸書）。歸去來兮寒欲窮。此身天地一賓鴻。明朝等是天厓客。家在大江東後東。（篆書）。歸去來兮歲欲窮。此身天地一賓鴻。明朝等是天涯客。家在大江東復東。松枝文。出史籀大篆體。亦柳葉之英之類也。古石居士。（隸書）\
  \ \n 46，偃波書 \n 韋齋朱先生詩。燈夕。（隸書）燈華作意照歸人。短棹扁舟寂寞濱。帝力如春蘇萬物。遙知太一不威神。（篆書）。燈華作意照歸人。短棹扁舟寂寞濱。帝力如春蘇萬物。遙知太一不威神。偃波書。漢詔版所用。未詳其始。古石居士。（隸書）\
  \ \n 47，古文 \n 韋齋朱先生詩。冬日桃李華。（隸書）。北風日日卷塵沙。桃李凌寒強自葩。莫作春光流轉想。要知枯卉是狂華。（篆書）。北風日日卷塵沙。桃李凌寒強自葩。莫作春光流轉想。要知枯卉是狂華。古文。倉頡侯剛氏仰觀天象。俯察地類。始造書契。天雨粟。鬼夜哭。頡即古文之祖也。（隸書）\
  \ \n 48，倒薤書 \n 韋齋朱先生詩。試筆。（隸書）。老來思詩如焦榖。自愧霜豪來故鄉。乞與楊家棗心樣。要將掣管試諸郎。（篆書）。老來詩思如焦榖。自愧霜毫來故鄉。乞與楊家棗心樣。要將掣管試諸郎。倒薤書。僊人務光。殷湯時避世于清冷之淵。植薤而食。故作此書。古石居士。（隸書）\
  \ \n 49，黼黻章 \n 韋齋朱先生詩。次韻團練君侯新居。（隸書）。江邨結屋老垂垂。詩乞榿栽手自迻。他日南樓看鴟集。莫忘煙雨狎鷗時。（篆書）。江邨結屋老垂垂。詩乞榿栽手自迻。他日南樓看鴟集。莫忘煙雨狎鷗時。黼黻章。黃帝以來有九章之服。此即繡袞之五采文章也。古石居士。（隸書）\
  \ \n 50，上方大篆 \n 韋齋朱先生詩。書釗家園壁。（隸書）。梅華夢向笛中殘。子者深枝一一酸。腸斷未遲雙燕子。暗香消歇粉泥乾。（篆書）。梅華夢向笛中殘。子者深枝一一酸。腸斷未遲雙燕子。暗香消歇粉泥乾。上方大篆。程邈字元岑。下邽人。飾李斯之法。尤精於隸。邈即隸書之祖也。古石居士。（隸書）\
  \ \n 51，碧落篆 \n 韋齋朱先生詩。題廓見亭。（隸書）。危闌縹緲跨鴻濛。城郭谿山一覽空。何處更客君著眼。大千渾在六窗中。（篆書）。危蘭縹緲跨鴻濛。城郭溪山一覽空。何處更客君著眼。大千渾在六窗中。碧落篆。唐幹王元嘉。好學博古。藏書萬卷。別作是體。古石居士。（隸書）\
  \ \n 52，瓔珞篆 \n 韋齋朱先生詩。松江。（隸書）。表裡江湖眼界新。解夸奇觀屬詩人。要須一釂三江水。淨洗多生舌本塵。（篆書）。表裡江湖眼界新。解誇奇觀屬詩人。要須一釂三江水。淨洗多生舌本塵。瓔珞篆。鎦德昇字君嗣。穎川人。因觀星象而作此書。古石居士。（隸書）\
  \ \n 53，摹印文 \n 韋齋朱先生詩。寄人。（隸書）。西山相對臥雲齋。耿耿思君不滿懷。比似持雲來寄我。何如君自作雲來。（篆書）。西山相對臥雲齋。耿耿思君不滿懷。比似持雲來寄我。何如君自作雲來。摹印文。出自倉頡古文八體。秦火之後。復行于世。古石居士。（隸書）\
  \ \n 54，奇字 \n 韋齋朱先生詩。溪上。（隸書）。扳緣雲水試青鞋。得持輕陰漠漠開。與在海山孤絕處。谿邊更復幾迴來。（篆書）。扳緣雲水試青鞋。待得輕陰漠漠開。與在海山孤絕處。溪邊更復幾回來。奇字。皇頡造書始成。內有古文稍異者。即奇字也。古石居士。（隸書）\
  \ \n 55，穗書 \n 韋齋朱先生詩。燈夕。（隸書）。鸞駕翩翩馭晚風。積蘇宮闕夜濛濛。明朝遺覓鐵如意。應在涼州酒肆中。（篆書）。鸞駕翩翩馭晚風。積蘇宮闕夜濛濛。明朝遺覓銕如意。應在涼州酒肆中。穗書。神農氏時上黨牛頭山。嘉禾一本生八穗。帝異之作此書。古石居士。（隸書）\
  \ \n 56，鍾鼎文 \n 韋齋朱先生詩。觀惠崇蘆雁圖。（隸書）。先生衰眼失孤鴻。久著瓮天塵霧中。誰卷秋空開四璧。丹青三昧道人崇。（篆書）。先生衰眼失孤鴻。久著瓮天塵霧中。誰卷秋空開三璧。丹青弎昧道人崇。鍾鼎文。夏禹命九牧貢金。鑄九鼎。勒銘于天下名山大川。故有此文。古石居士。（隸書）\
  \ \n 57，鳳尾書 \n 韋齋朱先生詩。招卓中表來白雲寺。（隸書）。剝啄渾無去客嗔。丁寧招喚只懷人。南風殿角涼如水。來洗眼前朱異塵。（篆書）。剝啄渾無去客嗔。丁寧招喚只懷人。南風殿角涼如水。來洗眼前朱墨塵。鳳尾書。晉元帝作。或云鳳尾諾是也。古石居士。（隸書）\
  \ \n 58，金錯書 \n 韋齋朱先生詩。招謝居安。（隸書）。暗中摸索故難忘。客舍相逢話最長。更有異書分我讀。只名酒足與君觴。（篆書）。暗中摸索故難忘。客舍相逢話最長。更有異書分我讀。只無名酒與君觴。金錯書。漢之銖兩刀成。所製或云用銘于石。故謂金錯。古石居士。（隸書）\
  \ \n 59，水竹文 \n 韋齋朱先生詩。江行初雪。（隸書）。江潤雲垂滿袖風。急須下馬一尊同。正應無奈催詩雪。句在渠儂擁鼻中。（篆書）。江潤雲垂滿袖風。急須下馬一尊同。正應無奈催詩雪。句在渠儂擁鼻中。水竹文。史籀之後。十三體。此之英之變也。古石居士。（隸書）\
  \ \n 60，璽書 \n 韋齋朱先生詩。卜居邨落。（隸書）。莫歎天涯流落身。只今同是耦耕人。江邨無物相迎送。一味柴門月色新。（篆書）。莫歎天涯流落身。只今同是耦耕人。江邨無物相迎送。一味柴門月色新。璽書。李斯用此題秦之印璽。又曰細篆。\
  \ 古石寓維揚書，時正德丁卯仲春之吉也 。（隸書） \n 封面题签： 陸一岳諸體篆書冊 \n陆一岳，明代书法家，号古石居士。生平不详。 \n 诗前隶书署云：「韋齋朱先生詩」。韦斋朱先生是宋代诗人朱松，字乔年，号韦斋，是著名理学家朱熹之父。"
