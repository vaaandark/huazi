id: shang-yang-tai-tie
title: 上阳台帖
aliases: []
dynasty: 唐
carrier: moji
holder: 北京故宫博物院
summary: 此《上阳台帖》为唐代诗人李白书自咏四言诗，是李白唯一传世的书法真迹，共二十五字（释文：山高水長，物象千萬，非有老筆，清壯何窮。十八日，上陽臺書，太白。），诗概括了王屋山高耸峻拔之势和源远流长之水，又通过赞颂司马承祯的作品，抒发了作者对其仰慕之情。此卷现藏于北京故宫博物院。
description: 此《上阳台帖》为唐代诗人李白书自咏四言诗，是李白唯一传世的书法真迹，共二十五字（
transcription: "：山高水長，物象千萬，非有老筆，清壯何窮。十八日，上陽臺書，太白。），诗概括了王屋山高耸峻拔之势和源远流长之水，又通过赞颂司马承祯的作品，抒发了作者对其仰慕之情。此卷现藏于北京故宫博物院。\
  \ \n 全卷苍劲雄浑而又气势飘逸，用笔纵放自如，快健流畅，法度不拘一格，一如李白豪放、俊逸的诗风。全贴结体亦参差跌宕，顾盼有情，奇趣无穷。这是李白传世的唯一书迹。其落笔天纵，收笔处一放开锋，宋黄庭坚评李白的诗与书云：“及观其稿书，大类其诗，弥使人远想慨然。白在开元、至德间，不以能书传，今其行、草殊不减古人。”(《山谷题跋》)\
  \ 。此帖曾入宣和内府，后归贾似道，元代经张晏处，明藏项元汴天籁阁。清代先为安岐所得，再入内府，清末流出宫外。民国时入张伯驹手，建国后献给国家 [ 1 ] 张伯驹先生将此帖送给了毛主席，主席转存故宫。\
  \ \n （张伯驹先生将此帖送给了毛主席，主席转存故宫。） 。 1958 年此帖转交故宫博物院收藏。清安岐《墨缘汇观》、内府《石渠宝笈·初篇》等书有著录。 [ 2 ] 介绍参考： 李艳霞 \n （介绍参考：李艳霞）\
  \ \n 创作缘由（臆说） ：李白于开元十二年（724 年）出蜀游三峡，至江陵遇道士司马承祯，得到司马承祯赞赏。后唐玄宗命司马承祯王屋山建立道观，并题写匾额。而司马承祯不仅道术精深，而且诗、书、画皆有极高造诣，擅长山水画。天宝三年（744\
  \ 年），李白与杜甫、高适同游王屋山阳台观，并来此寻访司马承祯，待到达阳台观后，方知司马承祯已经仙逝。不见其人，惟睹其画，故有感而书《上阳台帖》。 [ 3 ] 介绍参考： 陈振濂. 李白《上阳台帖》臆说\
  \ \n （介绍参考：陈振濂. 李白《上阳台帖》臆说） \n 1 2 1 \n宋徽宗赵佶瘦金书题签： \n 唐李太白上陽臺 \n 2 \n李白所书自咏四言诗（正文草书五行，二十五字） \n 山高水長，物象千萬，非有老筆，清壯可窮。十八日，上陽臺書，太白。"
layout: "横卷轴，纸本，纵 28.5X 横 38.1 厘米 \n 引首题签 清高宗弘历楷书题： 青蓮逸翰 四字 \n正文右上宋徽宗赵佶瘦金书题签： 唐李太白上陽臺 一行 \n 钤印鉴藏 卷前后及隔水上钤有宋赵孟坚：\
  \ 子固 、 彜齋 、贾似道： 秋壑圖書 ， 張晏私印 、 歐陽玄印 ，清内府： 乾隆御覽之寶 、 石渠寶笈 、 乾隆鑑賞 、 三希堂精鑒璽 、 宜子孫 、 五福五代堂古稀天子寶 、 古稀天子 、 養心殿鑑藏寶\
  \ ，以及明项元汴，清梁清标、安岐、近代张伯驹等鉴藏印 \n 天籟閣、項元汴氏審定真跡、退密、項墨林父秘笈之印、蘧廬、項氏子京、子孫世昌、燕山張氏、清晹印記、神品、神奇、墨林項季子章、歐陽元、項元汴印、子京珍秘、項叔子、檇李項氏世家寶玩、煮茶亭長、張晏私印、子京父印、有何不可、寄傲、會心處、香岩居士、平生真賞等等\
  \ \n 题跋摘录 后纸有宋徽宗赵佶，元张晏 [ 4 ] 谪仙书传世绝少尝云：欧、虞、褚、陆真书奴耳。自以流出于胸中，非若他人积习可到。观其飘飘然有凌云之态，高出尘寰得物外之妙。尝遍观晋唐法帖，而忽展此书，不觉令人清爽。\
  \ \n （谪仙书传世绝少尝云：欧、虞、褚、陆真书奴耳。自以流出于胸中，非若他人积习可到。观其飘飘然有凌云之态，高出尘寰得物外之妙。尝遍观晋唐法帖，而忽展此书，不觉令人清爽。） 、杜本、欧阳玄 [ 5\
  \ ] 元代书法家欧阳玄观题诗云 ：“唐家公子锦袍仙，文采风流六百年。不见屋梁明月色，空余翰墨化云烟。” \n （元代书法家欧阳玄观题诗云：“唐家公子锦袍仙，文采风流六百年。不见屋梁明月色，空余翰墨化云烟。”）\
  \ 、王馀庆、危素、驺鲁，清乾隆皇帝题跋和观款。 \n 宋徽宗赵佶跋文 [ 6 ] 跋文图片 \n （跋文图片） \n 太白嘗作行書乘興踏月，西入酒家，不覺人物兩忘，身在世外，一帖字畫飄逸，豪氣雄健，乃知白不特以詩鳴也。"
