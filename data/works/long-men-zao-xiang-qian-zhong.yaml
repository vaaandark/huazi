id: long-men-zao-xiang-qian-zhong
title: 龙门造像千种
aliases: []
author: 日本
dynasty: 北魏
carrier: zaoxiang
holder: 东京大学图书馆
rubbing: 初拓本
summary: 此《龙门造像千种》全套共十册，收录龙门石窟中南北朝到明代诸多造像、铭文或图案拓片，这些拓片大多是局部或零散片段，且没有文字说明。其装帧有一页多种（数量不等）或多页一种。此套拓片大约制作于清末民初，现藏于东京大学图书馆。
description: "此《龙门造像千种》全套共十册，收录龙门石窟中南北朝到明代诸多造像、铭文或图案拓片，这些拓片大多是局部或零散片段，且没有文字说明。其装帧有一页多种（数量不等）或多页一种。此套拓片大约制作于清末民初，现藏于东京大学图书馆。\
  \ \n 龙门石窟位于河南省洛阳市，以其数量众多、规模宏大、雕刻精美的佛教造像而闻名，是中国石刻艺术的杰出代表，被誉为世界最伟大的古典艺术宝库。 \n 封面题： 龍門造像千種 \n“青洲文库” 之名，源自渡边信的号\
  \ “青洲” 。这是山梨县西八代郡市川大门町（现今的市川三乡町）名门望族渡边家三代——渡边寿（1803–1875）、渡边信（1840–1911）、渡边泽次郎（1870–1941）所累积的藏书。渡边寿主要收集和歌、国学方面的书籍；\
  \ 渡边信 则以汉籍、历史书为主；渡边泽次郎则收藏浮世草子、洒落本等。整座文库共约藏有 25,000 件书籍，其中包含许多珍本善本。东京大学于 1924 年（大正 13 年）购入了该文库。 \n 制作信息\
  \ 清末民初拓本"
