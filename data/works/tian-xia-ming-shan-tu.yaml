id: tian-xia-ming-shan-tu
title: 天下名山图册
aliases: []
author: 赵佶
dynasty: 宋
carrier: moji
holder: 台北故宫博物院
summary: 此《天下名山图》册传为传宋徽宗（赵佶）辑。全套分元亨利贞四册（共九十四开），辑录由汉代至宋的诸多名家关于山的绘画或书法作品八十件（大多是伪托），始于：汉张衡飞云岩图、终于：宋王诜华林园图。册首附宗宣和五年宋徽宗题辞。此套现藏于台北故宫博物院。
description: "此《天下名山图》册传为传宋徽宗（赵佶）辑。全套分元亨利贞四册（共九十四开），辑录由汉代至宋的诸多名家关于山的绘画或书法作品八十件（大多是伪托），始于：汉张衡飞云岩图、终于：宋王诜华林园图。册首附宗宣和五年宋徽宗题辞。此套现藏于台北故宫博物院。\
  \ \n （伪） 宋徽宗題辭 \n 古人之畫六灋具備。窮神盡妙與化權同其宰運。後世則局于一隅。各自成名家爾。此冊王侯將相隱逸名流。黃冠緇素無不該攬。而皆極其選彙集大成。且方域之內名山列峙。觀之可以尚友千古。臥游六合矣。非若漢明之鴻都學。隋文之寶蹟臺。徒事夸誕為也。\
  \ 時宣和五年春三月重識 \n 元册 \n 漢張衡飛雲巖、唐顏真卿書西嶽太華山碑銘、漢陳敞潤州三山圖、漢龔寬首山圖、漢劉白首陽採薇圖、漢劉旦隱山深秀圖、漢毛延壽芒陽瑞應圖、漢張芝書跋、漢楊脩瀼水圖、魏桓範句曲秋巒圖、晉戴逵山陰高士圖、晉夏侯瞻東嶽圖、漢蔡邕模古、晉嵇康蘇門聞嘯圖、晉荀勗雲臺山圖、晉溫嶠白嶽山圖、晉王廙龍門半壁圖、晉王羲之寫蘭亭圖\
  \ \n 亨册 \n 晉明帝玉明煙靄圖、晉戴逵蕺山仙館圖、晉顧愷之霧鎖國山圖、晉王濛高唐行旅圖、晉史道碩鹿門高隱圖、宋陸探微西湖煙曉圖、南齊謝赫大滌飛泉圖、梁陶弘景龍谿採芝圖、梁張僧繇金華洞天圖、南齊宗測霅川野渡圖、梁陸杲逸少讌昇山圖、梁釋摩羅菩提阿羅三洞圖、五代史敬文石鐘山圖、宋蘇軾書石鐘山記、北齊蕭放石梁觀瀑圖、南齊范懷珍玉女峰圖、陳顧野王天目雲海圖、五代姜道隱廣莫亭圖、梁駙馬都尉趙喦焦源晚靄圖、隋董展韓陵古道圖、隋張權槐里山圖\
  \ \n 利册 \n 唐李思訓玉京雪霽圖、唐李思誨南樓圖、唐楊寧玉臺精舍圖、唐楊庭光東溪晚泊圖、唐陳閎潛陽雲壑圖、唐王維稷神山圖、唐張素卿廬山高圖、唐衛賢棲霞道中圖、唐薛稷徑山圖、唐李思訓華清春晝圖、唐張萱函關策蹇圖、唐朱審點蒼山圖、唐項容仙都勝槩圖、唐盧鴻錦江圖、唐李昭道四明山圖、唐張志和木蘭陂圖、唐張諲太白山圖、唐展子虔太液風清圖、唐漢王李元昌匡廬飛瀑圖、唐畢宏赤壁秋深圖\
  \ \n 贞册 \n 唐閻立德天臺華頂圖、唐鄭虔浮槎遠帆、唐尉遲乙僧具茨問道圖、唐周昉金谷園圖、唐張璪瞿唐三峽圖、唐張圖過雲巖圖、五代關仝西北巨鎮、宋李成九宮僊館圖、五代董源辟疆覽勝圖、天下名山圖（貞）冊五代南唐巨然清源洞圖、五代顧德謙卓錫泉圖、唐裴諝桃源圖、五代董源蘭陵古道圖、宋張敦禮太行列岫圖、魏韋誕草書遊太行山記、宋范寬霍童仙界圖、五代董源招隱山圖、五代董源化梭亭圖、宋李成中山瑞藹圖、五代巨然閣皂靈蹤圖、宋王詵華林園圖\
  \ \n 每册封面题： 天下名山圖 元/亨/利/贞 \n宋徽宗赵佶，号宣和主人。北宋第八位皇帝，同时也是画家、书法家、诗人、词人和收藏家，擅长古琴、蹴鞠、击鞠、打猎、射箭、马术、园艺、茶学，自创 “瘦金书”\
  \ 字体。徽宗为宋神宗十一子，宋哲宗之弟，先后被封为遂宁王、端王。其兄长宋哲宗于公元 1100 年正月病逝时无子，向太后于同月立其为帝，并垂帘听政一年，第二年改年号为 “建中靖国” 。徽宗朝时期政治腐败，民不聊生，爆发宋江起义、方腊起义等多次民变。靖康元年金兵兵临城下，禅位于太子钦宗，二年国亡被俘北上，金天会十三年因病亡于五国城，终年\
  \ 54 岁。宋金绍兴和议后于绍兴十二年归葬绍兴永祐陵。 \n 制作信息 传 宋徽宗宣和五年（癸卯 1123）编辑"
