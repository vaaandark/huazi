author: 徐渭
dynasty: 明
carrier: beike
holder: 此为 曼彻斯特大学图书馆
summary: 此《节孝事实图》由清末画家改琦绘图。此拓本含太原张太宜人节孝图十二帧，描述王氏兄弟幼年丧父，家境贫寒，母亲张太宜人温良贤淑、含辛茹苦、昼夜纺织、上侍老姑、下抚二子，以勤俭信义教之，使二子成家立业。此为清道光十年徐渭仁题签拓本，后有刘枢、熊传栗、陆荫奎、石韫玉等所作的序及题跋。
description: "此《节孝事实图》由清末画家改琦绘图。此拓本含太原张太宜人节孝图十二帧，描述王氏兄弟幼年丧父，家境贫寒，母亲张太宜人温良贤淑、含辛茹苦、昼夜纺织、上侍老姑、下抚二子，以勤俭信义教之，使二子成家立业。此为清道光十年徐渭仁题签拓本，后有刘枢、熊传栗、陆荫奎、石韫玉等所作的序及题跋。\
  \ \n 太宜人 是明清时五品官之母或祖母的封号。 \n 清道光时期上海南市大东门（今中华路复兴东路）建有一座王家祠堂及省园，为王文源、文瑞兄弟所建。王氏兄弟幼年丧父，家境贫寒，母亲张太宜人温良贤淑、含辛茹苦、昼夜纺织、上侍老姑、下抚二子，以勤、俭、信、义教之，使二子成家立业。二子发家后，为表彰母亲的节孝事迹，祭奠先祖，遂建宗祠并名节孝祠。在节孝祠的墙壁上，嵌有《张太宜人节孝事实》石刻一组。由清末著名画家改琦绘图，王氏子孙、书法家寿康用各种字体题写与画面相应的文字解说。（介绍\
  \ 参考 ） \n 太原張太宜人節孝事實（道光八年十月宗侄王鍾敬書） \n张太宜人节孝图十二帧 \n 沈希轼先生题识 \n太原张太宜人节孝事实记（石韫玉撰） \n高垲题识 \n郭辙题识（刘枢撰文） \n\
  熊传栗作序（钱塘倪承璐书） \n张太宜人节孝事实图颂并序（金元恩序、胡勋裕书） \n蒋超曾跋 \n陆荫奎题识 \n钟泽题识 \n王寿康题识 \n 改琦 ，字伯蕴，号香伯，一号七芗，又号玉壶外史，江苏华亭人，祖籍北京宛平，是清代中期的画家先世为西域人，祖父改光宗曾任寿春镇总兵。改琦多才多艺，尤善绘画，其人物画被认为是嘉道后最工者，其画受李公麟、赵孟頫、唐寅、陈洪绶等影响，花草竹等画也擅长。曾绘《红楼梦图咏》。\
  \ \n 拓制信息 清道光十年拓本 \n 题签 道光庚寅六月徐渭仁書 \n 道光八年十月宗侄王鍾敬書： 太原張太宜人節孝事實"
