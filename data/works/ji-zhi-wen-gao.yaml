id: ji-zhi-wen-gao
title: 祭侄文稿
aliases: []
author: 颜真卿
dynasty: 唐
script: xing
carrier: moji
holder: 台北故宫博物院
summary: 此《祭侄文稿》（祭姪文稿）卷为唐代颜真卿书。这篇为追祭作者从侄颜季明而写下的文稿叙述了常山太守颜杲卿父子一门在安禄山叛乱时，取义成仁之事。文中楷、行、草互见。全篇墨色有浓有枯，其中删改涂抹正可见情绪起伏之迹，最后哀痛至极遂化为狂草。此卷现藏于台北故宫博物院。
description: "此《祭侄文稿》（祭姪文稿）卷为唐代颜真卿书。这篇为追祭作者从侄颜季明而写下的文稿叙述了常山太守颜杲卿父子一门在安禄山叛乱时，取义成仁之事。文中楷、行、草互见。全篇墨色有浓有枯，其中删改涂抹正可见情绪起伏之迹，最后哀痛至极遂化为狂草。此卷现藏于台北故宫博物院。\
  \ \n 唐天宝十四载（755 年），安禄山起兵，河北二十四郡纷纷瓦解，仅颜真卿堂兄颜杲卿及其子颜季明守常山郡（今河北省正定县西南），颜真卿守平原郡（今山东省陵县）。颜杲卿计杀安禄山部将李钦凑，擒高邈、何千年，一时河北十七郡响应。天宝十五载（756\
  \ 年），安禄山围攻常山，不久常山城为史思明所破，俘虏颜季明，借机逼降颜杲卿。颜杲卿旋即被押至洛阳，见安禄山。但颜杲卿不屈，怒骂安禄山，被处死。颜氏一门三十余口被害。 唐肃宗乾元元年 （758 年），颜真卿派侄子颜泉明至河北寻得颜季明头颅（“携尔首榇”），挥泪写下此稿，二十三行，每行十一二字不等，共二百三十四字。全卷文字以楷书为基础，楷、行、草各体互见。评论书法时，历来有字如其人之说。颜真卿一门忠烈，生平大节凛然，其精神气节体现于翰墨，本卷最为论书者所乐举。通篇使用一管微秃之笔，以圆健笔法，有若流转之篆书，自首至尾，虽墨枯而再醮，墨色因停顿、起始而呈现黑灰浓枯的多样变化，然前后一气呵成。后世将此帖与东晋王羲之的《兰亭序》、北宋苏轼的行书《黄州寒食帖》并称为\
  \ “天下三大行书”，亦被誉为 “天下行书第二” 。"
transcription: "維乾元元年，歲次戊戌，九月庚午朔，三日壬申，（從父塗去）第十三叔、銀青光祿 （脫大字） 夫、使持節、蒲州諸軍事、蒲州刺史、上輕車都尉、丹楊縣開國侯真卿，以清酌庶羞，祭于亡姪贈贊善大夫季明之靈曰：\
  \ \n 惟爾挺生，夙標幼德。宗廟瑚璉，階庭蘭玉， （方憑積善塗去） 每慰人心，方期戩穀。 \n 何圖逆賊間釁，稱兵犯順。爾父 （□制塗去，改被脅再塗去） 竭誠，常山作郡。余時受命，亦在平原。仁兄愛我，\
  \ （恐塗去） 俾爾傳言。爾既歸止，爰開土門。土門既開，兇威大蹙。 \n （賊臣擁眾不救塗去） 賊臣 （擁塗去） 不救，孤城圍逼。父 （擒塗去） 陷子死，巢傾卵覆。天不悔禍，誰為荼毒？念爾遘殘，百身何贖？嗚呼哀哉！\
  \ \n 吾承天澤，移牧 （河東近塗去） 河關。 （爾之塗去） 泉明比者，再陷常山， （提塗去） 携爾首櫬， （亦自常山塗去） 及茲同還。撫念摧切，震悼心顏。 \n 方俟 （塗去二字不辨） 遠日， （再塗去一字不可辨）\
  \ 卜爾幽宅。 （撫字塗去） 魂而有知，無嗟久客。嗚呼哀哉！尚饗。 \n 《祭侄文稿》曾经由北宋宣和内府、元朝张晏、鲜于枢、明朝吴廷、清朝徐乾学、王鸿绪等收藏。后进入乾隆内府。 1949 年初，《祭侄文稿》被国民党政府带到了中国台湾，现收藏于台北故宫博物院。\
  \ \n 清高宗乾隆跋 \n 《顏真卿祭姪文藁》記：內府所收顏真卿真蹟凡四：入《石渠寶笈》者一（真卿書《建中三年朱巨川告身》）；待續入者三（《真卿自書告身》卷、又書《建中元年朱巨川告身》卷、又《裴將軍詩》卷）。別有一《爭座位帖》，似屬贋鼎，列之石渠次等，不以為珍也。茲乃得其《祭姪季明文藁》真蹟。披閱一再，嘆其一家捨身盡節，而為其君者如不知也；又嘆其經千年滄桑之變，而故紙宛存，誠有所謂神物呵護者也。昔張旭觀公孫大娘之舞，而悟書法，得端莊流麗之妙。若《自書告身帖》及《朱巨川告身帖》，所為端莊者也；若《裴將軍詩帖》，所為流麗者也。合端莊流麗為一，而更出以無心，其在此《祭姪文藁》乎！此卷之顯晦流傳，王頊齡、徐乾學論之詳矣，茲不復贅。獨是二人者，皆本朝世家，亦嘗叮嚀其子弟，善守希珍矣。今其子弟不能守，而鬻之鹽商，榷鹽者從而貰之，以登之內府。撫卷三嘆，知忠烈之可以永存，而聲華之未必恆保。更思時有忠烈之臣，則其世必多喪亂之事，是可畏之甚也。且此數卷獨非《宣和書譜》中所有之真蹟乎？其輾轉流落民間，又將六百餘歲矣。然則弆此卷於禁中，胥足以為殷鑒之警，是不可不記。乾隆丙午孟秋月，御筆。\
  \ \n 賊臣不救孤城陷，卵覆巢傾受酷殘。率彼國多忠烈士，知他民鮮鑿耕安。祈天永命奈何忽，制治保邦所以難。獨恨爾時作君者，深宮歌舞自尋歡。丁未仲春，御題。 \n 張晏 跋 \n 《宣和書譜》顏真卿《祭姪季明文》，知在錢塘，傳聞數年。辛丑歲，因到江淛，得於鮮于家。諸公聚觀，以為在世顏書中第一。\
  \ \n 世傳顏書，凡見八本：《李光顏太保帖》、《乞米帖》、《頓首夫人帖》今在秘書監；《馬病帖》、《允南母告》、《昭甫告》今在田師孟郎中家；《太子太師告》在一儫貴家；此《祭姪季明文》今在余家。住京師，嘗會諸賢品題，以為告不如書簡，書簡不如起草。蓋以告是官作，雖端楷終為繩約；書簡出於一時之意興，則頗能放縱矣；而起草又出於無心，是其心手兩忘，真妙見於此也。觀於此帖，真、行、草兼備三法。前宋名重當時，宣和嘗收，後為庸功剪去印記。今於「歲」字傍，猶有天水圓印痕跡，其幾於湮沒者數矣。向往錢塘，始獲見焉。既歸於予，喜不能寐。東坡有云：「書止於顏魯公。」亦予平生收書之志願永足矣。大德七年十一月初四日，忠宣後人、集賢學士、嘉議大夫兼樞密院判張晏，敬書于端本堂西勸學齋。\
  \ \n 鮮于樞 跋 \n 右唐太師魯國公書《祭姪季明文藁》。按《宣和書譜》，載內府所藏魯公書廿有八，此其一也。宣政小璽及天水圓印，遺迹隱然尚存。至元癸未，以古書數種易于東鄆曹彥禮。甲申來杭，重裝。戊子十月九日，鮮于樞拜手書。\
  \ \n 唐太師魯公顏真卿書《祭姪季明文槁》，天下行書第二，余家法書第一。至元壬午春，得於東鄆曹大本彥禮。甲申錢塘重裝。丙戌六月，鮮于樞記。 \n 周密、屠約、德一 题观跋 \n 山東傖父周密觀于玉琴軒\
  \ \n 錢唐屠約同觀 \n 南昌僧德一獲攬 \n 王頊齡 跋 \n 魯公《祭姪文》真蹟，昔在大司寇徐健菴先生所見之，後歸叔弟儼齋，又見之。其流傳始末、考訂證據，詳著於諸跋中，不待再贅一辭矣。惟是魯公忠義光日月，書法冠唐賢，片紙隻字，足為傳世之寶；況《祭姪文》尤為忠憤所激發，至性所鬱結，豈止筆精墨妙，可以振鑠千古者乎！從子彤文知余素好古蹟，寓書贈余。余暮年得此，如獲瓌寶。書此數語，以示子孫，當世世珍藏，與天地同不朽也。雍正二年十一月十日，松喬老人王頊齡謹識於燕山邸舍，時年八十有三。\
  \ \n 按唐肅宗乾元元年戊戌至今皇帝雍正二年甲辰，凡九百六十七年。魯公此書，閱歷已及千載矣。非魯公之忠孝友義，足以感格天地，書法之雄奇變化，至於超神入聖，安能數經兵燹，而紙墨完好、神采煥然若是乎？意必有神物護持，故能入水不濡、入火不爇也。為之驚歎無已，爰志數語，以著其流傳之永久云。松喬老人同日載題。\
  \ \n 徐乾學 跋 \n 顏魯公《祭姪季明文》真蹟，向為溪南吳氏收藏，後歸王氏。許布政弘勳得之，以付其幕官徐介錫。介鍚與余有宗人之分，重價購焉，驚喜累日。魯公為忠臣鉅儒，書體為有唐之冠，挺勁遒逸，能化裁諸家，而居虞、褚、歐、薛之上，後此莫能出其範圍者。此卷草稿行書，又顏書第一。米元章未見真蹟，以為不如《坐位》。今所傳《停雲館帖》臨本，與此逈異。嗚呼，豈易得哉！姪季明者，忠節公杲卿之少子。《新舊唐書》謂杲卿為公從父兄，是二公本大功晜弟，當同居共財者，于季明實從祖叔父。稿內抹去「從父」二字，嫌於親季父，故改稱「十三叔」；其祭濠州伯父曰「十三姪男」，皆就同堂兄弟行次稱之也。考公《謝贈官表》有云：「亡父故薛王友先臣惟貞，亡伯故濠州刺史先臣元孫等，孩提養於舅氏。臣堂兄故衛尉卿兼御史中丞杲卿，即元孫之子。」自敘甚明，《新書》稱同五世祖者謬矣。《舊書》云：「祿山舉范陽之兵詣闕，杲卿忠誠感發，懼賊遂寇潼關。時從弟真卿為平原太守，陰養死士，招懷豪右，為拒賊之計。遣使告杲卿，相與起義兵，犄角斷賊歸路，以紆西寇之勢。」《新書》亦云：「遣甥盧逖，至常山約起兵，斷賊北道。」此祭文云：「仁兄愛我，俾爾傳言。」是公使人及盧逖往來通問，季明亦必馳往約結，密商挫賊之計。顏氏一門忠孝，季明年少，能於兵間參預謀畫，效其死力，不但臨難捐命。非公文，千載而下，其誰知之哉？杲卿有子曰泉明，素有至性，能振人之急，風義凜凜，史已詳言之。季明獨見于《新書》，而《舊書》則曰幼子誕，疑即季明之別名。《新書》：「賊急攻常山，兵少，求救於河東王承業。承業前已攘杲卿殺賊功，兵不出。」此文所言「賊臣不救」者是也。杲卿晝夜戰，井竭，糧矢盡，六日而陷。賊脅使降，不應。取少子季明，加刃頸上，曰：「降我當活！」杲卿不答，遂并盧逖殺之。及至洛陽，杲卿乃瞋目罵祿山以死。此文云「父陷子死」，是季明先死，而杲卿之慘死在洛陽。《舊書》謂幼子誕在洛陽同日被臠割者，尚非事實。又「天不悔禍，誰為荼毒？念爾遘殘，百身莫贖」，詞甚沉痛。蓋兵事始末，常山與平原實相唇齒。從來謂祿山之禍，始唱義聲者，平原兄弟。公之得免屠僇，僅一間耳。公于事平之日，追數骨肉之慘，所謂痛定思痛，無有一字虛飾者也。泉明為王承業所遣，未至而常山陷，因客壽陽，復為史思明所獲，間關得免。其後思明歸國，而公為蒲州刺史，遣泉明至河北求親屬，及東都收取尸骸，季明止存其首，故曰首櫬。此文云：「泉明比者，再陷常山。携爾首櫬，及茲同還。」爾時常山叛服不常，再陷猶云再至，是季明首櫬，乃泉明再至常山得之，益知季明死于常山，非死于東都也。《通鑑》：至德二載，贈故常山太守顏杲卿太子太保，謚曰忠節，以子威明為太僕丞。威明無所表著，獨怪泉明之賢，官僅至郫令、彭州司馬，唐世之褒揚節義者，為稍薄矣。公言皆實錄，後段書體，益復激昂，忠憤勃發，神氣震盪。公千古第一種人物，亦擅千古第一種書體。余衰年薄祐，何幸獲此重寶！因考史傳同異，証其文義，而以臆見題識其後，子孫其永寶諸。康熙三十三年夏五月，徐乾學謹題，時年六十有四。\
  \ \n 後隔水题：右魯公祭姪藳。共計字二百三十四字，又塗抹三十四，合二百六十八 \n 引首题签： 顏魯公書祭姪帖 \n《祭侄文稿》，全名《祭侄赠赞善大夫季明文文稿》，俗谓《祭侄帖》、《祭侄稿》。标题原作\
  \ 祭姪 。 “姪” 字的俗字和今中国大陆等地的简化字作 “侄” 。 \n 颜真卿，字清臣，小名羡门子，别号应方，京兆府长安县人，祖籍琅邪郡临沂县，唐朝政治家、书法家。开元二十二年中举进士，历任户部侍郎、尚书左丞、刑部尚书诸职，曾受封为鲁郡公，任平原郡为太守，后世遂称\
  \ 颜鲁公 、颜平原、颜太师。"
