summary: 《多宝塔碑》（大唐西京千福寺多宝佛塔感应碑）由唐代岑勋撰文，颜真卿书碑，碑文为楷书。碑文共三十四行（满行六十六字）内容主要记载西京龙兴寺禅师楚金发愿兴建多宝塔的缘由、经过及相关佛事。此为东京国立博物馆藏北宋拓本，“凿”
  字未损。
description: "《多宝塔碑》（大唐西京千福寺多宝佛塔感应碑）由唐代岑勋撰文，颜真卿书碑，碑文为楷书。碑文共三十四行（满行六十六字）内容主要记载西京龙兴寺禅师楚金发愿兴建多宝塔的缘由、经过及相关佛事。此为东京国立博物馆藏北宋拓本，“凿”\
  \ 字未损。 \n 《多宝塔碑》碑文内容记述了唐代僧人楚金禅师发愿兴建多宝塔的过程。西京龙兴寺楚金禅师夜深人静诵读《法华经》，忽见宝塔宛在眼前，故发愿建多宝塔一座。在许王李瓘及居士赵崇等人施舍资助下，此塔在长安千福寺开建。此塔历时四年落成，以后每年春秋两季楚金禅师诵经其下，还曾刺血写《法华》等经并取舍利置于石函放之塔下。楚金禅师将立塔经过及有关佛事记述下来，请岑勋撰文，颜真卿书丹，史华镌刻，造《多宝塔感应碑》，立于塔下。\
  \ \n 此碑结体严密，用笔腴润方折，布局紧凑规整，整体风格秀雅刚劲，为颜真卿壮年（时年四十四岁）书法代表作。 \n 据前后题跋说明，此拓本原在京师，后被质于官库典押四十千钱，期满后由库纪杨中孚携回并尝试出售，但未成功。清乾隆四十七年汪志伊（字稼门，号莘农，桐城人）从杨中孚购得此本。清道光二十四年汪志伊的孙子汪元孝移居金陵，并将拓本转赠给了法良（号可庵，旗人）。之后，关于这本拓本的流传情况不详。民国年间曾归马世杰，后流入日本，今藏东京国立博物馆。\
  \ \n 东京国立博物馆 藏另一种：清代中晚期整体拓片（ 下载 ） \n此碑立于唐天宝十一年（752）。原在唐长安安定坊（今西安西关）千福寺，宋代移入文庙，石现存陕西西安碑林博物馆。碑高 285 厘米，宽\
  \ 102 厘米，文三十四行，行六十六字，额隶书二行八字。全文如下 \n 大唐西亰千福寺多寳佛塔感應碑文 \n 南陽岑勛撰 \n 朝議郎、判尚書武部貟外郎琅邪顔真卿書 \n 朝散大夫、撿挍尚書都官郎中東海徐浩題額\
  \ \n 粵妙法蓮華，諸佛之祕藏也；多寳佛塔，證經之踴現也。發眀資乎十力，弘建在扵四依。有禪師法号楚金，姓程，廣平人也。祖父並信著釋門，慶歸法胤。母髙氏，久而無姙，夜夢諸佛，覺而有娠。是生龍象之徴，無取熊羆之兆。誕弥厥月，炳然殊相，岐嶷絶於葷茹，髫齔不為童逰。道樹萌芽，聳豫章之楨幹；禪池畎澮，涵巨海之波濤。年甫七歲，居然猒俗，自誓出家，禮藏探經，法華在手。宿命潛悟，如識金環；摠持不遺，若注瓶水。九歲落髮，住西亰龍興寺，從僧籙也。進具之年，昇座講法。頓收珎藏，異窮子之疾赱；直詣寳山，無化城而可息。尓後因靜夜持誦，至《多寳塔品》，身心泊然，如入禪㝎，忽見寶塔，宛在目前。釋迦分身，遍滿空界，行勤聖現，業淨感深。悲生悟中，淚下如雨，遂布衣一食，不出戶庭，期滿六年，誓建兹塔。既而許王瓘及居士趙崇、信女普意善来稽首，咸捨珎財。禪師以為輯荘嚴之因，資爽塏之地，利見千福，黙議扵心。時千福有懐忍禪師，忽扵中夜，見有一水發源龍興，流注千福，清澄泛灔，中有方舟。又見寳塔自空而下，久之乃滅，即今建塔䖏也。寺內淨人名法相，先扵其地，復見燈光，逺望則朙，近尋即滅。竊以水流開於法性，舟泛表扵慈航，塔現兆於有成，燈眀示於無盡，非至徳精感，其孰能與扵此？及禪師建言，雜然歡愜，負畚荷插，于橐于囊，登登憑憑，是板是築。灑以香水，隱以金鎚，我䏻竭誠，工乃用壮。禪師每夜於築階所，懇志誦經，勵精行道，衆聞天樂，咸嗅異香，喜歎之音，聖凡相半。至天寳元載，創構材木，肈安相輪。禪師理會佛心，感通帝夢。七月十三日，勑内侍趙思偘求諸寳坊，驗以所夢。入寺見塔，禮問禪師，聖夢有孚，法名惟肖。其日賜錢五十萬、絹千匹，助建修也。則知精一之行，雖先天而不違；純如之心，當後佛之授記。㫺漢眀永平之日，大化初流；我皇天寶之年，寳塔斯建。同符千古，昭有烈光。扵時道俗景附，檀施山積，庀徒度財，功百其倍矣。至二載，勑中使楊順景宣旨，令禪師扵花萼樓下迎多寳塔額。遂摠僧事，備法儀，宸睠俯臨，額書下降。又賜絹百疋。聖札飛毫，動雲龍之氣象；天文挂塔，駐日月之光輝。至四載，塔事將就，表請慶齋，歸功帝力。時僧道四部，會逾萬人。有五色雲，團輔塔頂，衆盡瞻覩，莫不崩恱。大㢤觀佛之光，利用賔于法王。禪師謂同學曰：「鵬運滄溟，非雲羅之可頓；心逰寂滅，豈愛䋄之能加？精進法門，菩薩以自强不息。夲期同行，復遂宿心。鑿井見泥，去水不逺；鑚木未熱，得火何階？凡我七僧，聿懐一志，晝夜塔下，誦持法華。香煙不斷，經聲逓續，炯以為常，沒身不替。」自三載每春秋二時，集同行大德四十九人，行法華三昧。尋奉恩旨，許為恒式。前後道場所感舎利凡三千七十粒。至六載，欲葬舎利，預嚴道場，又降一百八粒，畫普賢變，於筆鋒上聮得一十九粒。莫不圎體自動，浮光瑩然。禪師無我觀身，了空求法，先刾血寫《法華經》一部、《菩薩戒》一卷、《觀普賢行經》一卷，乃取舎利三千粒，盛以石函，兼造自身石影，跪而戴之，同置塔下，表至敬也。使夫舟遷夜壑，無變度門，刧筭墨塵，永垂貞範。又奉為主上及蒼生寫《妙法蓮華經》一千部、金字三十六部，用鎮寳塔。又寫一千部，散施受持。靈應既多，具如夲傳。其載勑内侍吴懐實賜金銅香鑪髙一丈五尺，奉表陳謝。手詔批云：「師弘濟之願，感逹人天，莊嚴之心，義成因果，則法施財施，信所冝先也。」主上握至道之靈符，受如来之法印，非禪師大慧超悟，無以感扵宸衷，非主上至聖文眀，無以鑒於誠願。倬彼寳塔，為章梵宫。經始之功，真僧是葺；克成之業，聖主斯崇。尓其為狀也，則岳聳蓮披，雲垂盖偃。下欻崛以踴地，上\U00020158\
  盈而媚空，中晻晻其靜深，旁赫赫以弘敞。礝磩承陛，琅玕綷檻，玉瑱居楹，銀黄拂戸。重簷疊扵畫栱，反宇環其璧璫，坤靈贔屭以負砌，天祇儼雅而翊戶。㦯復肩㧝鷙鳥，肘擐脩虵，冠盤巨龍，帽抱猛獸。勃如戰色，有奭其容，窮繪事之筆精，選朝英之偈賛。若乃開扃鐍，窺奧祕，二尊分座，疑對鷲山；千帙發題，若觀龍藏。金碧炅晃，環珮葳蕤。至扵列三乗，分八部，聖徒翕習，佛事森羅。方寸千名，盈尺萬象；大身現小，廣座䏻卑。湏弥之容，欻入芥子；寳盖之狀，頓覆三千。昔衡岳思大禪師，以法華三昧，傳悟天台智者，尓来寂寥，罕契真要。法不可以久廢，生我禪師，克嗣其業，繼朙二祖，相望百年。夫其法華之教也，開玄關於一念，照圎鏡扵十方，指陰界為妙門，駈塵勞為法侣。聚沙䏻成佛道，合掌已入聖流。三乗教門，摠而歸一；八萬法藏，我為最雄。譬猶滿月麗天，螢光列宿，山王映海，蟻垤羣峯。嗟乎！三界之沈寐久矣。佛以法華為木鐸，惟我禪師，超然深悟。其皃也，岳瀆之秀，氷雪之姿，果脣貝齒，蓮目月面。望之厲，即之溫，覩相未言，而降伏之心，已過半矣。同行禪師，抱玉飛錫，襲衡台之祕躅，傳止觀之精義。㦯名高帝選，㦯行密衆師，共弘開示之宗，盡契圎常之理。門人苾蒭、如巖、靈悟、淨真、真空、法濟䒭，以定慧為文質，以戒忍為剛柔，含朴玉之光輝，䒭旃檀之圍繞。夫發行者因，因圎則福廣；起因者相，相遣則慧深。求無爲於有為，通解脫於文字，舉事徴理，含毫强名。偈曰：\
  \ \n 佛有妙法，比象蓮華。圎頓深入，真淨無瑕。慧通法界，福利恒沙。直至寳所，俱乗大車。其一 \n於戯上士，發行正勤。緬想寳塔，思弘勝因。圎階已就，層覆初陳。乃昭帝夢，福應天人。其二 \n輪奐斯崇，為章淨域。真僧草創，聖主増飾。中座眈眈，飛簷翼翼。荐臻靈感，歸我帝力。其三\
  \ \n念彼後學，心滯迷封。昏衢未曉，中道難逢。常驚夜杌，還懼真龍。不有禪伯，誰朙大宗？其四 \n大海吞流，崇山納壤。教門稱頓，慈力䏻廣。功起聚沙，徳成合掌。開佛知見，法為無上。其五 \n情塵雖雜，性海無漏。㝎養聖胎，染生迷鷇。斷常起縛，空色同謬。簷蔔現前，餘香何嗅？其六\
  \ \n彤彤法宇，繄我四依。事該理暢，玉粹金輝。慧鏡無垢，慈燈照微。空王可託，夲願同歸。其七 \n 天寳十一載嵗次壬辰四月乙丑朔廿二日戊戍建 \n 勑撿挍塔使正議大夫行内侍趙思偘、判官内府丞車沖、撿挍僧義方\
  \ \n 河南史華刻 \n 前题： 大唐西京千福寺多寶佛塔感應碑文 \n 南陽岑勛撰 \n 朝議郎判尚書武部員外郎琅邪顏真卿書 \n 朝散大夫檢校尚書都官郎中東海徐浩題額 \n颜真卿，字清臣，小名羡门子，别号应方，京兆府长安县人，祖籍琅邪郡临沂县，唐朝政治家、书法家。其楷书与欧阳询、柳公权、赵孟\U0002B5AF\
  并称 “楷书四大家” 。"
