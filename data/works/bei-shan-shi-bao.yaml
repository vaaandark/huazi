summary: 此《北山堂十宝》是从香港中文大学文物馆碑帖馆所藏两千余件拓片中，精选出的十种最为珍贵的宋代拓本，包括：西岳华山庙碑、夏承碑、九成宫醴泉铭、集王羲之圣教序、大字麻姑仙坛记、十七帖、淳化阁帖泉州本、汝帖、英光堂帖。因文物捐赠者利荣森博士的堂名为「北山堂」而得名。
description: "此《北山堂十宝》（北山十宝）是从香港中文大学文物馆碑帖馆所藏两千余件拓片中，精选出的十种最为珍贵的宋代拓本，包括：西岳华山庙碑、夏承碑、九成宫醴泉铭、集王羲之圣教序、大字麻姑仙坛记、十七帖、淳化阁帖泉州本、汝帖、英光堂帖。因文物捐赠者利荣森博士的堂名为「北山堂」而得名。\
  \ \n “北山十宝” 作为香港中文大学文物馆所藏碑帖之代表，以版本流传珍稀、书法艺术精美、文化内涵丰厚著称宇内。他们均由北山堂利荣森先生捐赠，而 “北山十宝” 的得名，则源自清代嘉庆道光间以碑帖收藏驰名的李宗瀚\
  \ “临川十宝” 珍本碑帖。 \n 北山十宝 包括 \n 一：东汉西岳华山庙碑（马氏小玲珑山馆本/顺德本） \n *更多预览图参见页顶栏图集 \n 此拓原碑立于东汉桓帝延熹八年（165）于陕西省华阴县西岳庙内。原碑因明代嘉靖年间关中大地震及两度维修西岳庙而失佚。《华山庙碑》结字紧密，清初著名学者朱彝尊激赏此碑集方整、流丽、奇古于一身，被视为汉代隶书的顶峰，是\
  \ “汉隶第一品” 。原碑于十六世纪中期损毁，令原拓更显珍贵。 \n 此本经金农、张敦仁、孙星衍等递藏，当中题跋甚多，包括姚鼐、伊秉绶、严可均、顾广圻、龚自珍、潘祖荫、王懿荣等名家，还特附赵之谦双钩补摹手迹，将所缺两页补齐。（详细介绍\
  \ 可参见 ） \n 二：东汉夏承碑（华氏真赏斋本） \n 文物馆所藏此件宋代拓本，张彦先生在其《善本碑帖录》中曾经认为 “现存较比可信的原石拓本，只华氏真赏斋本” 。此本为明代鉴赏大家华夏真赏斋珍藏之物，至清代由陆恭及江西临川碑帖收藏大家李宗瀚珍藏，成为李宗瀚\
  \ “临川十宝” 之首。后金石大家翁方纲将其中所缺三十余字，用宋代罗纹纸勾摹补齐，并作长跋，翁方纲、黄易、吴荣光、潘奕隽、郑孝胥于右任等过眼题跋。 \n 《夏承碑》被记录为汉代名家蔡邕所书，此碑立于东汉建宁三年（170），原石明中期已毁。北宋赵明诚《金石录》著录此碑，当时在洺州（今河北永年县）。在流传的《夏承碑》拓本中，以此华氏真赏斋旧藏本为最早。真赏斋本为历代收藏家珍重，其结字风格奇古、字画清晰。此碑上承篆体而笔法近于隶书，笔法多变，在书体发展中起承先启后的作用。（详细介绍\
  \ 可参见 ） \n 三：唐欧阳询九成宫醴泉铭（汪氏孝经堂本） \n 《九成宫醴泉铭》由魏徵撰文，欧阳询书。原碑立于陕西麟游九成宫，现藏于陕西省麟游县博物馆。此碑是欧阳询成熟至晚年期间登峰造极的楷书代表作。\
  \ \n 文物馆藏此本有清代著名金石学者翁方纲题跋，该跋收入《苏斋题跋》。此本也曾著录于碑帖专家王壮弘先生的名作《增补校碑随笔》之中。（详细介绍 可参见 ） \n 四：唐怀仁集王羲之圣教序（孔氏岳雪楼本）\
  \ \n 《集王羲之圣教序》历来被视为保存 “书圣” 王羲之行草书法度最重要的碑刻。 \n 文物馆所藏南宋拓未断本，墨色苍朴，字迹清晰，笔画饱满。曾经明代袁褧（尚之）收藏，有文徵明长子文彭观款，清代经姜宸英、孔尚任、查莹、孔广陶等递藏，又有李宗瀚、沈尹默等名家过眼题跋。（详细介绍\
  \ 可参见 ） \n 五：唐李邕云麾将军李思训碑（吴荣光旧藏本） \n 《李思训碑》全称《唐故云麾将军右武卫大将军赠秦州都督彭国公谥曰昭公李府君神道碑并序》，由李邕撰并书。 \n 《李思训碑》存世北宋拓本已知仅两本，而南宋拓也只有约十本。文物馆所藏南宋拓本，其墨色醇古，信息完整，王壮弘先生曾称许\
  \ “拓极精” 。校对后可知此本属南宋（或金）本。题跋包括成翁方纲、亲王永瑆、康有为、梁启超、罗振玉、王国维、姚华、黄宾虹。其中罗原觉利用传世文献与其他拓本所作考证之文字颇为详审完备。（详细介绍 可参见\
  \ ） \n 六：唐颜真卿大字麻姑仙坛记（何绍基旧藏本） \n 《大字麻姑仙坛记》作为颜真卿的楷书名作，何绍基在此本跋语中曾高度评价为 “颜书各碑意象种种不同，此碑独以朴胜，正是变化狡狯之极耳” 。\
  \ \n 此碑记因原石早已不存，所以宋代经木板翻刻并拓印的拓本就显得弥珍贵，今日有确切存藏信息的《大字麻姑》宋拓，已知仅有六本。文物馆所藏宋拓大字本，淡墨施拓，为该碑大字本系统中残损最少者。与存世其他宋拓本相较，残损更少，字口也更为清晰。此本曾经何绍基珍藏，又有\
  \ “墨皇本”《圣教序》收藏者崇恩题跋，何氏誉其为 “颜书各碑之冠”，可谓推崇备至。（详细介绍 可参见 ） \n 七：宋刻东晋王羲之十七帖（孔氏岳雪楼本） \n 《十七帖》收入王羲之书帖 29 种，历来被不少书家、学者视为最能代表王羲之草书面目的刻帖。\
  \ \n 文物馆所藏宋拓本，为该帖唐代摹刻之 “馆本” 系统中 “僧权” 二字全本，全帖完整无缺，楮墨精善，隐约可见宋拓本中常见之帘纹，经名家递藏。此本有梁同书、王文治、潘奕隽等题跋。 \n 八：宋刻淳化阁帖泉州本卷六至八集王书（陆恭旧藏本）\
  \ \n 《淳化阁帖》是宋太宗赵炅下诏，由王著甄选历代法书摹刻于北宋淳化三年（992）的一套十卷丛帖。此帖原刻原拓已不存，一般认为，《淳化阁帖》在清代以前主要有五个版本系统，而刻于南宋初年福建泉州的\
  \ “泉州本”，是现存四种主要《淳化阁帖》宋代重刻系统之一。而文物馆藏本属于南宋初重刻的 “泉州本”，此本辑自卷六至卷八集王羲之帖。 \n 此本刻拓俱精，墨色中可见纸帘纹，被视为 “宋纸宋墨”，甚为难得。曾经缪曰藻、陆恭、潘奕隽等收藏，有褚德彝题签，又有王文治、顾莼、吴云、吴昌硕等题跋。（详细介绍\
  \ 可参见 ） \n 九：宋刻汝帖（吴荣光旧藏本） \n 宋代刻帖盛行，《汝帖》作为宋徽宗大观年间最重要的刻帖之一，具有 “粗漫传神” 的独特艺术风格，在刻帖发展史上的地位不容忽视。该帖收录三代至隋唐五代书法名迹，涵盖篆、隶、楷、行、草多种书体。在文献学、法帖历史版本学等方面颇具学术价值。\
  \ \n 文物馆所藏宋拓本，为北宋原石刻拓，亦是此帖存世三、四件宋拓之一。（详细介绍 可参见 ） \n 十：宋刻米芾英光堂帖（徐渭仁旧藏本） \n 《英光堂帖》为南宋私家所刻米芾书法专帖。其中所收录各帖的墨迹母本均已散失。全帖较为忠实的保存了行楷、草书等多种米书面貌，书迹年代早晚兼备，展现了米芾不同时期的书名方式，这也为鉴定米芾其他书法作品提供了绝佳参考。\
  \ \n 文物馆所藏宋原刻初拓《英光堂帖》第三卷，为存世孤本 [ 1 ] 另有第四卷残本，藏北京故宫博物院 \n （另有第四卷残本，藏北京故宫博物院） ，亦是唯一保持原石面貌者。被张伯英称赞为 “摹勒之妙，不减墨迹。”，真\
  \ “宋本仅存” 也！此本徐渭仁等递藏，经吴云、杨守敬等名家题跋。（详细介绍 可参见 ） \n香港中文大学文物馆（Art Museum, The Chinese University of Hong\
  \ Kong）成立于一九七一年的秋天，致力于收藏、保存、研究及展示各类中国文物。秉承香港中文大学宗旨，致力弘扬中华文化，促进中外学术交流，贡献社会，而今天的文物馆，已成为中国最佳大学博物馆之一。 \n\
  \ 利荣森 博士 (1915 -2007) 是北山堂基金的创办人，他同时是香港著名的慈善家，一生为推动中国文化艺术作出贡献。 利博士于 1915 年出生于香港，父亲是香港著名实业家利希慎。凭借年青时奠下深厚的国学基础，以及在国内接受教育的机会，培养出利博士对中国文化的浓厚兴趣。利博士毕生热爱中国文化艺术，爱好文物收藏。支持成立香港中文大学，并于七十年代倡议建立中国文化研究所及文物馆，成为培育人才及研究中国文化艺术的重要机构。\
  \ 1985 年成立北山堂基金，主要以赞助中国文化艺术及推动教育发展为基金宗旨。"
