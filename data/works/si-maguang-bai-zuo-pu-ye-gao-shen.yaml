id: si-maguang-bai-zuo-pu-ye-gao-shen
title: 司马光拜左仆射告身卷
aliases: []
author: 等人
dynasty: 北宋
script: xing
carrier: moji
holder: 台北故宫博物院
summary: “告身” 是古代政府颁授官职或勋奖的凭证。此《司马光拜左仆射告身》卷是司马光在北宋元祐元年的拜相告身。它由翰林学士拟主文、再经门下省官员审读、皇帝 “制可” 、尚书省官员签署、吏部钤印等程序，反映北宋政府此时改革官制的情形。通篇多大字行书，笔法流畅。此卷现藏于台北故宫博物院。
description: "“告身” 是古代政府颁授官职或勋奖的凭证。此《司马光拜左仆射告身》卷是司马光在北宋元祐元年的拜相告身。它由翰林学士拟主文、再经门下省官员审读、皇帝 “制可” 、尚书省官员签署、吏部钤印等程序，反映北宋政府此时改革官制的情形。通篇多大字行书，笔法流畅。此卷现藏于台北故宫博物院。\
  \ \n “告身” 是古代勋奖或任命文武官员的正式文书，性质与今日职官派令相近，具有公信力，可以作为授受的凭证。 \n 北宋哲宗元祐元年（1086），任命司马光为尚书左仆射兼门下侍郎，也就是俗话所说官拜宰相。司马光拜相以后，把王安石变法以来对民有害的部分悉尽除去，但他只在位数个月就过世了。这件宰相告身，材质为饰金花绫。告身的书写通篇多大字行书，笔法流畅、有柳字瘦劲的结构，参以颜书厚重的笔划。这既反映了当时负责抄写文书的北宋官吏的书风，还有助于了解北宋官方文书的体制。\
  \ 这幅告身前面附有司马光的画像，为后人附加，并非告身原有的一部分。 \n 大致"
transcription: "門下帥羣臣宿道而□方。在慎取相。佐王者脩政而美國。莫若求人。顧惟眇躬。獲嗣大統。儲思業業。不敢忘六聖之休。注意賢賢。將以總萬方之治。褒進上宰。敷告外廷。正議大夫。守門下侍郎。上柱國。河內郡開國公。食邑三千四百戶。食實封壹阡貳伯戶。司馬光。受材高明。履道醇固。智足以任天下之重。學足以知先王之言。逮事厚陵。徧儀侍從之列。被遇文考。擢總樞機之繁。有大臣特立之風。蹈君子難進之節。方予訪落之始。起應秉鈞之求。調娛萬幾。必先教化之意。辨察百職。不失禮義之中。是用諮諏僉言。褒加異數。越升左相之路。兼峻東臺之班。申衍爰田。陪敦真食。於戲。上寅亮於天心。則陰陽風雨以之順。下遂字乎物理。則山川草木以之寧。內阜安於兆民。外鎮撫於四裔。蓋輔相者為之基杖。而老成者重於典刑。勉行所聞。以底極治。\
  \ [ 1 ] 帅群臣宿道而向方，在慎取相；佐王者修政而美国，莫若求人。顾惟眇躬，获嗣大统。储思业业，不敢忘六圣之休；注意贤贤，将以总万方之俭。褒进上宰，敷告外庭。正议大夫、守门下侍郎司马光，受材高明，履道醇固。智足以任天下之重，学足以知先王之言。逮事厚陵，徧仪侍从之列；被遇文考，擢总枢机之繁。有大臣特立之风，蹈君子难进之节。方予访落之始，起应秉均之求。调娱万几，必先教化之意；辨察百职，不失礼义之中。是用咨诹佥言，褒加异数。越升左揆之路，兼峻东台之班。申衍爰田，陪真食。於戏！上寅亮于天心，则阴阳风雨以之顺；下遂字于物理，则山川草木以之宁。内阜安于兆民，外镇抚于四裔。盖辅相者为之基杖，而老成者重于典刑。勉行所闻，以底极治。\
  \ \n （帅群臣宿道而向方，在慎取相；佐王者修政而美国，莫若求人。顾惟眇躬，获嗣大统。储思业业，不敢忘六圣之休；注意贤贤，将以总万方之俭。褒进上宰，敷告外庭。正议大夫、守门下侍郎司马光，受材高明，履道醇固。智足以任天下之重，学足以知先王之言。逮事厚陵，徧仪侍从之列；被遇文考，擢总枢机之繁。有大臣特立之风，蹈君子难进之节。方予访落之始，起应秉均之求。调娱万几，必先教化之意；辨察百职，不失礼义之中。是用咨诹佥言，褒加异数。越升左揆之路，兼峻东台之班。申衍爰田，陪真食。於戏！上寅亮于天心，则阴阳风雨以之顺；下遂字于物理，则山川草木以之宁。内阜安于兆民，外镇抚于四裔。盖辅相者为之基杖，而老成者重于典刑。勉行所闻，以底极治。）\
  \ \n 可特授依前正議大夫。守尚書左僕射。兼門下侍郎。加食邑七百戶。食實封參伯戶。餘如故。主者施行。二日。侍中聞 。尚書左僕射兼門下侍郎臣光。未謝。尚書左丞權門下侍郎臣公著。 （以上三行俱小楷書）\
  \ \n 制：可 （一行大行書） \n 給事中臣純仁 （以上六字小楷書） 等言。制書如右。請奉制付外施行。謹言。 元祐元年閏二月日 \n 閏二月初四日卯時。都事時忱。受。左司郎中林希。付。尚書令。闕。尚書左僕射光。未謝。尚書右僕射縝。尚書左丞公著。尚書右丞清臣。吏部尚書大防。吏部侍郎常。\
  \ （以上九行官銜俱小楷書人名字體稍大） 告正議大夫。守尚書左僕射。兼門下侍郎。上柱國。河內郡開國公。食邑四千一百戶。食實封壹阡伍伯戶。司馬光。奉被制書如右。符到奉行。司封郎中權述。主事賈大年。令史魏宗式。書令史□。\
  \ （以上三行俱小楷書。述字略大） 元祐元年閏二月日下 \n 款识： 元祐元年閏二月日 \n司马光，字君实，号迂叟，通称司马相公，陕州夏县涑水乡人，北宋政治家、文学家、史学家。西晋安平献王司马孚的后裔。世称涑水先生，身后称司马温公。历仕仁宗、英宗、神宗、哲宗四朝，主持编纂了中国历史上第一部编年体通史《资治通鉴》。"
