layout: "一册。纸本（开本：高 30.5 x 宽 17.8x 厚 3.8 厘米）行书或隶书 \n 跋文信息 作者款识一：河南王鐸具草求正之。 月來病，力疾勉書。時絕糧，書數條賣之，得五斗粟。買墨，墨不嘉耳，奈何。\
  \ \n 作者款识二：崇禎十七年二月舫中, 王鐸書。翼隆老社兄教正 \n 作者款识三：泊楚王鎮 甲申二月 王鐸 \n 翁方纲跋一：深山雲景松濤中揮灑乃快，此語亦自知不可得。丁酉六月北平翁方綱題 \n\
  翁方纲跋二：孟津此幅作隸書，卻不工，然自有拔俗之氣，知其平日未嘗染指開元以後八分也。丁酉六月 \n 钱坫跋一：山谷经伏波神祠诗卷亦病后所书，纵横跌宕，自然出奇，此册颇可为继。 \n钱坫跋二：此種筆格，蓋有漢人之骨，而間以北魏之趣者，近世人不肯作，亦不能作也。\
  \ \n 叶恭绰跋：覺斯書向見不下數十，如此冊之排奡而謹嚴，蓋不數見。又系贈湯若望之作，滋可寶也……"
