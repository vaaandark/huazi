id: wang-mengjin-zeng-tang-ruowang-shi-ce
title: 王孟津赠汤若望诗册
aliases: []
author: 王铎
dynasty: 明
script: xing
carrier: moji
holder: 旧金山亚洲艺术博物馆
summary: 此《王孟津赠汤若望诗》册由明末王铎书。全册共三十四开（正文二十六开），内容为行书七律《赠汤若望诗》八首，后附隶书五言《赠袁翼隆诗》。此册曾由近代著名收藏家叶梦龙、裴景福、叶恭绰等递藏（有翁方纲、钱坫、叶恭绰等人题跋），现藏于旧金山亚洲艺术博物馆。
description: "此《王孟津赠汤若望诗》册由明末王铎书。全册共三十四开（正文二十六开），内容为行书七律《赠汤若望诗》八首，后附隶书五言《赠袁翼隆诗》。此册曾由近代著名收藏家叶梦龙、裴景福、叶恭绰等递藏（有翁方纲、钱坫、叶恭绰等人题跋），现藏于旧金山亚洲艺术博物馆。\
  \ \n 此册大概是由清代中叶以后的一位收藏家，将王铎两件原本独立的书品——行书《赠汤若望诗》与隶书《赠袁翼隆诗》，重新托裱，并将其装订成册。全册视觉对比强烈，前半部行书涨墨淋漓、欹侧险峻，写尽 “贰臣”\
  \ 内心的激荡与幻灭；后半部隶书字形大巧若拙，线条苍茫古厚。行书之激荡与隶书之高古在此交融，堪称王铎晚年精湛书艺与复杂心境的缩影。 \n 前半部分：行草书《赠汤若望诗》 \n 清顺治二年（1645 年），弘光政权覆灭，王铎在南京降清，并随后随清军将领多铎抵达北京。此时的王铎不仅背负着\
  \ “贰臣” 的沉重道德枷锁，更是贫病交加、内心极度幻灭与自责。他听闻旧识德国耶稣会传教士汤若望已于前一年年底接掌了清朝的钦天监，正深受新政权器重。身处绝境的王铎，决定手书一卷诗稿相赠。前四首写赠汤若望，赞美了汤若望的才华横溢和见多识广，抒发了自己对异域风情的神往之情。后四首吟咏自己的人生，倾诉贫病交加，委婉地寓托了恳请这位新朝\
  \ “洋红人” 在乱世中给予自己襄助与庇护的隐秘渴望。 \n 后半部分：隶书《赠袁翼隆诗卷》 \n 后半部分为收藏家增补内容，是明崇祯十七年王铎赠予友人袁翼隆的五言诗。王铎一生以行草书独步天下，他的传世隶书真迹比较稀见。\
  \ \n 封面题签： 王孟津贈湯若望七律詩冊後附甲申二月隸書五言律詩睫庵藏 \n王铎（1592—1652）字痴仙，号觉斯、觉四、觉之、嵩樵、十樵、石樵、痴庵、东皋长、痴庵道人、烟潭渔叟、雪塘渔隐、痴仙道人、兰台外史、雪山道人、二室山人、白雪道人、云岩漫士等，生于河南孟津县（今河南孟津），籍平阳府洪洞县（今山西省洪洞县），世称\
  \ “王孟津”，明末清初官员，进士出身，书画家。 \n 汤若望（Johann Adam Schall von Bell，1592—1666）字道未，德国科隆人，天主教耶稣会传教士。 1620 年（明万历四十八年）到澳门，在中国生活\
  \ 47 年，历经明、清两朝，是继利玛窦之后最重要的来华耶稣会士之一。"
