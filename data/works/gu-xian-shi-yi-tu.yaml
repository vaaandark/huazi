id: gu-xian-shi-yi-tu
title: 古贤诗意图
aliases: []
author: 黄庭坚
dynasty: 北宋
carrier: moji
holder: 北京故宫博物院
summary: 此《古贤诗意图》卷由明代金琮书唐宋名诗，杜堇按诗意绘画。全卷包含：王右军（李白诗）、桃源图（韩愈诗）、把酒问月（李白诗）、听颖师弹琴（韩愈诗）、走笔谢孟谏议寄新茶（卢仝诗）、饮中八仙歌、对雪、又雪（杜甫诗）等诗十二首，图九幅。此卷现藏于北京故宫博物院。
description: "此《古贤诗意图》卷由明代金琮书唐宋名诗，杜堇按诗意绘画。全卷包含：王右军（李白诗）、桃源图（韩愈诗）、把酒问月（李白诗）、听颖师弹琴（韩愈诗）、走笔谢孟谏议寄新茶（卢仝诗）、饮中八仙歌、对雪、又雪（杜甫诗）等诗十二首，图九幅。此卷现藏于北京故宫博物院。\
  \ \n 此图共分九段，分别为：右军笼鹅、桃源图、把酒问月、听颖师弹琴、茶歌、饮中八仙、东山宴饮、咏水仙、舟中夜雪。图中人物用白描法，笔法细劲透逸，形象生动有神。树石、藤草、桌椅、车、马、小舟等点景穿插有致。墨色淡雅，但淡而不薄，雅而不空。构图简洁，意境清幽，皆得诗意要旨。（介绍\
  \ 参考 ） \n 依次描绘 \n 右军笼鹅 ：李白诗《王右军》 \n 右军本清真，潇洒在风尘。山阴遇羽客，要此好鹅宾。扫素写道经，笔精妙入神。书罢笼鹅去，何曾别主人。 \n 桃源图 ：韩愈诗《桃源图》\
  \ \n 神仙有无何渺茫，桃源之说诚荒唐。 \n流水盘回山百转，生绡数幅垂中堂。 \n武陵太守好事者，题封远寄南宫下。 \n南宫先生忻得之，波涛入笔驱文辞。 \n文工画妙各臻极，异境恍惚移于斯。 \n\
  架岩凿谷开宫室，接屋连墙千万日。 \n嬴颠刘蹶了不闻，地坼天分非所恤。 \n种桃处处惟开花，川原近远蒸红霞。 \n初来犹自念乡邑，岁久此地还成家。 \n渔舟之子来何所，物色相猜更问语。 \n大蛇中断丧前王，群马南渡开新主。\
  \ \n听终辞绝共凄然，自说经今六百年。 \n当时万事皆眼见，不知几许犹流传。 \n争持酒食来相馈，礼数不同樽俎异。 \n月明伴宿玉堂空，骨冷魂清无梦寐。 \n夜半金鸡啁哳鸣，火轮飞出客心惊。 \n\
  人间有累不可住，依然离别难为情。 \n船开棹进一回顾，万里苍苍烟水暮。 \n世俗宁知伪与真，至今传者武陵人。 \n 把酒问月 ：李白诗《把酒问月》 \n 青天有月来几时？我今停杯一问之。 \n人攀明月不可得，月行却与人相随。\
  \ \n皎如飞镜临丹阙，绿烟灭尽清辉发。 \n但见宵从海上来，宁知晓向云间没。 \n白兔捣药秋复春，嫦娥孤栖与谁邻？ \n今人不见古时月，今月曾经照古人。 \n古人今人若流水，共看明月皆如此。 \n\
  惟愿当歌对酒时，月光长照金樽里。 \n 听颖师弹琴 ：韩愈诗《听颖师弹琴》 \n 昵昵儿女语，恩怨相尔汝。 \n划然变轩昂，勇士赴敌场。 \n浮云柳絮无根蒂，天地阔远随飞扬。 \n喧啾百鸟群，忽见孤凤皇。\
  \ (凤皇 一作 凤凰） \n跻攀分寸不可上，失势一落千丈强。 \n嗟余有两耳，未省听丝篁。 \n自闻颖师弹，起坐在一旁。 \n推手遽止之，湿衣泪滂滂。 \n颖乎尔诚能，无以冰炭置我肠！ \n 茶歌\
  \ ：卢仝诗《走笔谢孟谏议寄新茶》 \n 日高丈五睡正浓，军将打门惊周公。 \n口云谏议送书信，白绢斜封三道印。 \n开缄宛见谏议面，手阅月团三百片。 \n闻道新年入山里，蛰虫惊动春风起。 \n天子须尝阳羡茶，百草不敢先开花。\
  \ \n仁风暗结珠琲瓃，先春抽出黄金芽。 \n摘鲜焙芳旋封裹，至精至好且不奢。 \n至尊之馀合王公，何事便到山人家。 \n柴门反关无俗客，纱帽笼头自煎吃。 \n碧云引风吹不断，白花浮光凝碗面。 \n\
  一碗喉吻润，两碗破孤闷。 \n三碗搜枯肠，唯有文字五千卷。 \n四碗发轻汗，平生不平事，尽向毛孔散。 \n五碗肌骨清，六碗通仙灵。 \n七碗吃不得也，唯觉两腋习习清风生。 \n蓬莱山，在何处。 \n\
  玉川子，乘此清风欲归去。 \n山上群仙司下土，地位清高隔风雨。 \n安得知百万亿苍生命，堕在巅崖受辛苦。 \n便为谏议问苍生，到头还得苏息否。 \n 饮中八仙 ：杜甫诗《饮中八仙歌》 \n 知章骑马似乘船，眼花落井水底眠。\
  \ \n汝阳三斗始朝天，道逢麴车口流涎，恨不移封向酒泉。 \n左相日兴费万钱，饮如长鲸吸百川，衔杯乐圣称避贤。 \n宗之潇洒美少年，举觞白眼望青天，皎如玉树临风前。 \n苏晋长斋绣佛前，醉中往往爱逃禅。\
  \ \n李白一斗诗百篇，长安市上酒家眠。 \n天子呼来不上船，自称臣是酒中仙。 \n张旭三杯草圣传，脱帽露顶王公前，挥毫落纸如云烟。 \n焦遂五斗方卓然，高谈雄辩惊四筵。 \n 东山宴饮 ：杜甫诗《陪王侍御同登东山最高顶宴姚通泉晚携酒泛江》\
  \ \n 姚公美政谁与俦，不减昔时陈太丘。 \n邑中上客有柱史，多暇日陪骢马游。 \n东山高顶罗珍羞，下顾城郭销我忧。 \n清江白日落欲尽，复携美人登彩舟。 \n笛声愤怨哀中流，妙舞逶迤夜未休。 \n\
  灯前往往大鱼出，听曲低昂如有求。 \n三更风起寒浪涌，取乐喧呼觉船重。 \n满空星河光破碎，四座宾客色不动。 \n请公临深莫相违，回船罢酒上马归。 \n人生欢会岂有极，无使霜露沾人衣。 \n 咏水仙\
  \ ：黄庭坚诗《王充道送水仙花五十枝欣然会心为之作咏》 \n 凌波仙子生尘袜，水上轻盈步微月。 \n是谁招此断肠魂，种作寒花寄愁绝。 \n含香体素欲倾城，山矾是弟梅是兄。 \n坐对真成被花恼，出门一笑大江横。\
  \ \n 舟中夜雪 ：杜甫诗《舟中夜雪有怀卢十四侍御弟》 \n 朔风吹桂水，朔雪夜纷纷。暗度南楼月，寒深北渚云。 \n烛斜初近见，舟重竟无闻。不识山阴道，听鸡更忆君。 \n 杜甫诗《对雪》 \n 北雪犯长沙，胡云冷万家。随风且间叶，带雨不成花。\
  \ \n金错囊从罄，银壶酒易赊。无人竭浮蚁，有待至昏鸦。 \n 杜甫诗《又雪》 \n 南雪不到地，青崖沾未消。微微向日薄，脉脉去人遥。 \n冬热鸳鸯病，峡深豺虎骄。愁边有江水，焉得北之朝。 \n 卷末为金琮跋\
  \ \n 金琮 ，明代书画家，字元玉，自号赤松山农，金陵 (今南京) 人。 \n 杜堇 ，明代画家，原姓陆，字惧男，号柽居、古狂、青霞亭长等，丹徒 (今江苏镇江) 人，古籍燕京 (今北京) 。成化中试进士不第，遂绝意进取。工诗文，善绘事，以人物画著称，精白描法。唐寅\
  \ 30 岁左右与杜堇相识，甚受其影响。 \n 绘制信息 明代金琮书诗、杜堇绘画"
