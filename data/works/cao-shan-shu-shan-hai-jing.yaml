id: cao-shan-shu-shan-hai-jing
title: 元曹善书山海经
aliases: []
author: 曹善
dynasty: 元
script: kai
carrier: moji
holder: 此为 台北故宫博物院
summary: 《山海经》是先秦时期的一部载有怪奇悠谬之说、荟萃珍奇博物的神话地理志。此《山海经》册为元代书法家曹善所书。全套共四册，小楷抄写郭璞传《山海经》十八篇，其书风质朴端严，结字参差，用笔古拙之处可见钟繇遗法。此本约书于元至正二十五年，经姚绶、王世贞、陈继儒、董其昌等递藏。
description: "《山海经》是先秦时期的一部载有怪奇悠谬之说、荟萃珍奇博物的神话地理志。此《山海经》册为元代书法家曹善所书。全套共四册，小楷抄写郭璞传《山海经》十八篇，其书风质朴端严，结字参差，用笔古拙之处可见钟繇遗法。此本约书于元至正二十五年，经姚绶、王世贞、陈继儒、董其昌等递藏。\
  \ \n 《 山海经 》全书十八卷，其中 “山经” 五卷，“海经” 八卷，“大荒经” 四卷，“海内经” 一卷，共约 31,000 字。记载了 100 多个邦国、 550 山、 300 水道以及邦国山水的地理、风土物产等信息。《山海经》中对于动物的记载，据统计有\
  \ 277 种之多，有虎、豹、狕、熊、罴、狼、犬、兔、猪、马、猴、猿、猩、犀、牛、彘、鹿、麂、类、豚、禺、羚、羊、象、蛇、蝼、猥、訾、驼、獭、狐、糜、麈等，还有猼\U0002B359、毕方、帝江、何罗鱼、鸟、狌狌。郭璞认为狌狌就是猩猩。其中《山经》所载的大部分是历代巫师、方士和祠官的踏勘记录，经长期传写编纂，多少会有所夸饰，但仍具有较高的参考价值。\
  \ \n 《山海经》向乏善本，今天所能见到的《山海经》最早版本是南宋淳熙七年（1180）尤袤刻本，加上明正统《道藏》本，成为明清以来《山海经》的主要版本来源。众本之间，异文不多，可资对勘的材料少。所以今本《山海经》中存在的错讹呈现\
  \ “固化” 状态，很难被揭示出来。现在我们有幸搜求到元代曹善手抄《山海经》全本，该本祖本大概是尤袤校书时所能见到的 “别本”，时代或在尤袤本之前，该书对《山海经》校勘意义较大。（劉思亮： 從元代曹善抄本《山海經》看今本中存在的問題\
  \ ） \n 曹善手抄本《山海经》所据版本不详，只能从全书看到他避讳一些字，如「敬」、「恒」、「貞」等都缺笔，可见是避宋真宗赵恒与宋仁宗赵祯的讳。此书可能刊于仁宗一朝（1022-1063）。即使刊于在位最后一年，也比尤本的淳熙七年早了\
  \ 117 年。（鹿憶鹿： 《山海經》的再發現—曹善抄本的文獻價值考述 ） \n 第一册：山海经序、南山经第一、西山经第二、北山经第三、董其昌跋 \n第二册：东山经第四、中山经第五 \n第三册：海外南经第六、海外西经第七、海外北经第八、海外东经第九、海内南经第十、海内西经第十一、海内北经第十二、海内东经第十三\
  \ \n第四册：大荒东经第十四、大荒南经第十五、大荒西经第十六、大荒北经第十七、海内经第十八 \n曹善款识、姚公绶题跋、王世贞题跋、陈继儒题跋、陈继儒题跋 \n 第一册后有董其昌题跋： \n 山海經\
  \ 有贊 。元曹世良手抄。明姚公綬、王元美、陳眉公家藏。崇禎乙亥六月董其昌書。 \n曹善（活动于十四世纪后期），江苏华亭人，字世良，号樗散生，有诗名，处世刚正，不合于时。明太祖时，宋濂荐于朝，累征不起，苦志临池，初学锺繇，行草学二王，与兄世长、兄子恭，具有书名，一时称为东吴三曹。"
