id: xing-shu-chi-bi-er-fu-ce
title: 行书赤壁二赋册
aliases: []
author: 赵孟頫
dynasty: 元
script: xing
carrier: moji
holder: 台北故宫博物院
summary: 此《行书赤壁二赋册》是元代赵孟頫的作品。全帖共书八十一行，其中《赤壁赋》四十六行、《后赤壁赋》三十二行，署款三行，并有苏轼像于帖首。前后二赋为赵孟頫同时所书，风格却略有不同。此帖约书于元大德五年，纸本册装，现藏于台北故宫博物院。
description: "此《行书赤壁二赋册》是元代赵孟頫的作品。全帖共书八十一行，其中《赤壁赋》四十六行、《后赤壁赋》三十二行，署款三行，并有苏轼像于帖首。前后二赋为赵孟頫同时所书，风格却略有不同。此帖约书于元大德五年，纸本册装，现藏于台北故宫博物院。\
  \ \n 赵孟頫写此作在大德五年，时年四十八岁，正值盛年。作品笔笔细节讲究，体态优雅，行气流利圆转，结字有晋人古风。赵孟頫特意以苏轼好友李公麟的白描风格画东坡像一幅置于起首，其中黑色的腰带，纯然以中锋\
  \ “写” 出，为赵孟頫之书法入画理论最精彩的实践。 \n 在此二赋中，原文作者苏轼凭吊古迹，抒发了对江山风物的热爱与旷达的心胸，但是也有对人生虚无的消极思想。《前后赤壁赋》中前后二赋为赵孟頫同时所书，风格却略有不同，但该帖总体上分行布白疏朗从容，用笔圆润遒劲，宛转流美，风骨内含，神彩飘逸，尽得魏晋风流遗韵。\
  \ [ 1 ] 舒静庐编著, 中外经典美术作品欣赏 [M], 安徽文艺出版社,2013.07, 第 51-53 页 \n （舒静庐编著, 中外经典美术作品欣赏 [M], 安徽文艺出版社,2013.07,\
  \ 第 51-53 页） \n 前赤壁赋 \n后赤壁赋 \n 赵孟頫识 [ 2 ] 大德辛丑正月八日。明遠弟以此紙求書二賦。為書于松雪齋。併作東坡像于卷首。子昂。 \n （大德辛丑正月八日。明遠弟以此紙求書二賦。為書于松雪齋。併作東坡像于卷首。子昂。）\
  \ \n东坡像 \n 鲜于枢识 [ 3 ] 近世諸賢書畫。不能俱傳。李伯時亦善書。今獨稱其畫。王黃華亦善畫。今獨傳其書。蓋以所長掩其所短故也。子昂學士書畫俱到。他日必能俱傳無疑。大德五年八月五日。困學民鮮于樞題子昂畫東坡像及書二赤壁賦後。\
  \ \n （近世諸賢書畫。不能俱傳。李伯時亦善書。今獨稱其畫。王黃華亦善畫。今獨傳其書。蓋以所長掩其所短故也。子昂學士書畫俱到。他日必能俱傳無疑。大德五年八月五日。困學民鮮于樞題子昂畫東坡像及書二赤壁賦後。）\
  \ 、康棣识 [ 4 ] 東坡二賦。松雪每喜書之。敻出諸書之右。故深得晉人書法。晚年行筆圓熟。度越唐人。迺知早年用意之深如此。後學唐棣敬題。 \n （東坡二賦。松雪每喜書之。敻出諸書之右。故深得晉人書法。晚年行筆圓熟。度越唐人。迺知早年用意之深如此。後學唐棣敬題。）\
  \ 、班惟志识 [ 5 ] 高宗以用武而中興。既御六龍居九重。日與文臣對。故萬幾之暇無以寓罔極之思。因從瘦金書而復二王。可謂無恥於前哲。予昔隨集賢公在京師。親見書此賦何啻數十。其運筆如飛。於近代宗室中尤覺蘊藉。畫則李龍眠學顧虎頭。公繼龍眠者也。臨卷敬歎。大梁後學班惟志再拜書。時至順二年中秋日。\
  \ \n （高宗以用武而中興。既御六龍居九重。日與文臣對。故萬幾之暇無以寓罔極之思。因從瘦金書而復二王。可謂無恥於前哲。予昔隨集賢公在京師。親見書此賦何啻數十。其運筆如飛。於近代宗室中尤覺蘊藉。畫則李龍眠學顧虎頭。公繼龍眠者也。臨卷敬歎。大梁後學班惟志再拜書。時至順二年中秋日。）\
  \ 、赵弈识 [ 6 ] 至正丁酉歲拜觀先人平章手書東坡前後赤壁賦。并畫東坡小像。真蹟無疑。藏者宜寶之。男弈謹識。 \n （至正丁酉歲拜觀先人平章手書東坡前後赤壁賦。并畫東坡小像。真蹟無疑。藏者宜寶之。男弈謹識。）\
  \ \n 赵孟頫特意以苏轼好友李公麟的白描风格画 东坡像 一幅置于起二赋后（原为卷首） \n赵孟頫（1254-1322），浙江吴兴人，字子昂，号松雪道人。本宋宗室，宋亡仕元，官至翰林学士承旨。赵孟頫提倡复古，影响当代甚钜。其书法力追晋唐，书风历经三变，先临宋高宗，再学锺繇及二王，最后取法李邕。\
  \ \n 苏轼，眉州眉山人，北宋时著名的文学家、政治家、艺术家。字子瞻，一字和仲，号东坡居士、铁冠道人。嘉佑二年进士，累官至端明殿学士兼翰林学士，礼部尚书。南宋理学方炽时，加赐谥号文忠，复追赠太师。"
layout: "一册。纸本，均 27.2x11.1 厘米，十一开，共书八十一行，其中《赤壁赋》四十六行、《后赤壁赋》三十二行，署款三行 \n 跋记信息 趙孟頫識：大德辛丑正月八日。明遠弟以此紙求書二賦。為書于松雪齋。併作東坡像于卷首。子昂。\
  \ \n鮮于樞識：大德五年八月五日。困學民鮮于樞題子昂畫東坡像及書二赤壁賦後。 \n康棣識：後學唐棣敬題。 \n班惟志識：時至順二年中秋日 \n趙弈識：男弈謹識"
