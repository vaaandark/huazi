title: 快雪时晴帖册
aliases: []
author: 王羲之
dynasty: 东晋
script: xing
carrier: moji
holder: 台北故宫博物院
summary: 《快雪时晴帖》是东晋书法家王羲之创作的行书作品。共全文四行二十八字。它是一封写给友人张侯的信札，其内容是作者在大雪初晴时以愉快心情对亲朋友人的问候。清乾隆皇帝极珍爱此迹，共御笔题识七十多则（钤印一百七十多枚），并配画：兰亭观鹅图。此册现藏于台北故宫博物院。
description: "《快雪时晴帖》是东晋书法家王羲之创作的行书作品。共全文四行二十八字。它是一封写给友人张侯的信札，其内容是作者在大雪初晴时以愉快心情对亲朋友人的问候。清乾隆皇帝极珍爱此迹，共御笔题识七十多则（钤印一百七十多枚），并配画：兰亭观鹅图。此册现藏于台北故宫博物院。\
  \ \n 《快雪时晴帖》在唐初时赐丞相魏征，传于褚遂良。唐末宋初时归苏易简，传于苏家子孙苏舜元、苏舜钦兄弟之手。后转归米芾。南宋初入高宗内府。明代由朱存良藏，后由卖画者售与王穉登，以后转手吴国廷、刘承禧。刘卒后又归吴国廷。元朝时先为张氏所有，后入元内府。其后为涿鹿冯铨所得。清乾隆十一年（1746\
  \ 年）进入内府，乾隆将此帖与王献之《中秋帖》、王洵《伯远帖》同贮于养心殿温室内。 1925 年北京故宫博物院成立后，《快雪时晴帖》为其旧藏品。在日本侵占东北后，《快雪时晴帖》随故宫博物院的第一批古物南迁，后来辗转运到贵州安顺。\
  \ 1945 年，日本投降后，《快雪时晴帖》转到南京。 1949 年初，《快雪时晴帖》和北京故宫众多的珍贵文物一起，被国民党政府带到了中国台湾，至今一直收藏于台北故宫博物院。 [ 1 ] 张光宾编著.\
  \ 中华书法史 [M]. 台湾商务印书馆股份有限公司, 1981.12. 第 91 页 \n （张光宾编著. 中华书法史 [M]. 台湾商务印书馆股份有限公司, 1981.12. 第 91 页） \n\
  清乾隆皇帝极珍爱此迹，共亲自御笔题识七十一则，晚年因视力不佳，改由董诰代笔三则，可见其对此帖之热爱。他将此帖与王献之的 〈中秋帖〉 、王珣的 〈伯远帖〉 合称为「三希」，并 配画：兰亭观鹅图。 \n\
