  \ 印記： \n乾隆宸翰、乾隆御賞之寶 \n 題跋 \n 本幅 \n 君倩 \n 行楷書 \n 君倩。 \n 題跋 \n 清高宗 \n 本幅（附裝） \n 庚寅（西元一七七０年）新正三日。密雪優霑。喜前兆瑞因成什。書冊志慰。御筆。\
  \ \n 行書 \n 連朝藴釀密雲垂。侵曉瀌瀌遂霈施。節未立春猶是臘。兆符元旦正宜時。重樓十二皆皴玉。世界三千遍被釐。拈筆欲吟還自問。似兹何以答天禧。庚寅（西元一七七０年）新正三日。密雪優霑。喜前兆瑞因成什。書冊志慰。御筆。\
  \ \n 印記： \n太璞、古香 \n 題籤 \n 本幅 \n 楷書 \n 天下無雙。古今鮮對。 \n 題跋 \n 清高宗 \n 前副葉一 \n 行書 \n 神乎技矣。 \n 印記： \n乾、隆 \n\
  \ 題跋 \n 清高宗 \n 前副葉二、前副葉三 \n 乾隆丙寅（西元一七四六年）正月摹是帖一過。得句五章。用題冊首。 \n 行書 \n 丁甲呵持信有之。墨池終古法書垂。試思走筆明窗際。應是吟成栁絮時。數來二十八驪珠。翥鳳翩鸞有是乎。笑我凍蠅叅未破。從今擬欲廢摻觚。阿大中郎未足多。東山絲竹久消磨。何如内史風流筆。占盡千秋聽講鵝。\
  \ 錦囊樂毅久成煙。老子西昇只廓填。獨有山陰雙逸士。尚携海水歷桑田。賺得蘭亭蕭翼能。無過玉匣伴昭陵。賸留快雪公天下。一脉而今見古朋。乾隆丙寅（西元一七四六年）正月摹是帖一過。得句五章。用題冊首。 \n\
  \ 印記： \n天根月堀、雲霞思、乾隆御筆 \n 題跋 \n 清高宗 \n 前副葉四 \n 行書 \n 蘇辭遭遇多枝葉。倒綳禁體先犯雪。起舞浮白意匠殊。縱横驅用堪叫絶。元冥恰喜交初莭。過水真如遇方折。平原羃䍥寒颸逼。長空晻靄暮光滅。旌門鐃吹雲璈奏。幔城漏響金魚掣。徘徊中夜聼拉瑟。行檠熻赩蓮花纈。天窗取氣揭薄紗。地爐生火燃枯屑。遙想林岫已婆娑。却愛郊坰正飄瞥。即景朅詠都官句。占年夙記農家說。醉翁髯老垂號令。會取陳言能㸃鐡。\
  \ \n 印記： \n清玩、乾隆御覽 \n 題跋 \n 清高宗 \n 前副葉四 \n 乙亥（西元一七五五年）正月二十七日對雪并書。 \n 行書 \n 澤華紛撲復攅團。密勢濃陰釀峭寒。望過三冬猶訝夢。校來五寸得差安。方圓圭璧皆如意。次第園林頓改觀。况是紐芽遲麥隴。及時心為扈農寛。乙亥（西元一七五五年）正月二十七日對雪并書。\
  \ \n 印記： \n古香、太璞 \n 題跋 \n 清高宗 \n 前副葉四 \n 癸酉（西元一七五三年）新正四日御筆。 \n 行書 \n 時晴快雪對時晴。真者當前怵愓生。展濶縮臨皆自我。蘭亭何必擅前旌。蘭亭橅者。大小不一。真草亦殊。快雪獨無聞焉。曩嘗縮臨蠅頭本。刻於天然玉子。茲於雪後御齋宮展闊臨之。因題一絕。癸酉（西元一七五三年）新正四日御筆。\
  \ \n 印記： \n會心不遠 \n 題跋 \n 清高宗 \n 前副葉四 \n 乾隆癸酉（西元一七五三年）臘月二日雪中展閱此帖因書。 \n 行書 \n 甘雪剛逢臘。農祥早先春。散為花是喜。積作玉餘津。展帖香生古。烹茶句得新。更希盈尺紀。近遠布膏均。乾隆癸酉（西元一七五三年）臘月二日雪中展閱此帖因書。\
  \ \n 印記： \n席上珍 \n 題跋 \n 清高宗 \n 前副葉四 \n 行書 \n 同雲一色難分葉。禁體苦吟雪非雪。背觸如叅竹篦子。歐令蘇傳兩竒絶。蝗深可卜田火除。心喜應教屐齒折。况復督亢舊膏腴。恰似藍田未堙滅。梁王已命兎園宴。杜老那擅鯨魚掣。憑輿攬結吟興飛。拈鬚何慮冰花纈。十餘字耳乃區區。不因歩韻宜避屑。却憶澄海禁水部。\
  \ (癸亥冬澄海樓與張照梁詩正聯句凡字涉水部者槩不許用) 倡和豪情巖電瞥。試看滕六御風行。彼則有言可無説。獨憐呵凍賡吟者。毳衣布帳寒如鐡。藝圃曽聞輕楮葉。營邱夙擅能圖雪。設如白戰遇歐蘇。錯手無從堪笑絶。昨從清苑返行旌。范陽古道循曲折。雲羃朔天漸低黯。煙凍僧寮乍昇滅。吟詩未覺冰硯寒。行圍却喜飢鷹掣。簁簁著體化如幻。綏綏壓㡌緐於纈。從來此景我所耽。興豪擬問誰遺屑。却慙未透即離禅。還應為譜風花瞥。耳聽目眎本一例。約畧林嵐為指說。畫成傳示同事看。\
  \ (命董邦逹圖是景新連。是次未扈駕。故詩以告之。) 從教宵寐衾鋪鐡。 \n 印記： \n澂觀 \n 題跋 \n 清高宗 \n 前副葉四 \n 癸酉（西元一七五三年）正月三日雪後登延春閣眺望之作次日齋居復展是冊爰書於此。\
  \ \n 行書 \n 瑞英既委積。祥曦亦曈曨。素雲扶柏枝。芳飇遞梅叢。新正清暇餘。延閣深禁中。載豁即景目。兼舒體物胸。皇都千萬户。珠樓十二重。撫此金甌固。益切玉燭融。北斗揖璇杓。西山展畫峯。和氣鬯萌陽。吾將事祈農。癸酉（西元一七五三年）正月三日雪後登延春閣眺望之作次日齋居復展是冊爰書於此。\
  \ \n 印記： \n含輝 \n 題跋 \n 清高宗 \n 前副葉四 \n 丙寅（西元一七四六年）長至後三日御筆。 \n 行書 \n 拈出天花示迦葉。一笑至今鬚鬢雪。昨吟禁體效歐蘇。沓拖流風殊未絶。冀北方欣麥鍼綠。江南應報梅腰折。望中峯勢忽如迷。旋教萬徑人踪滅。收餘活火煑三清\
  \ (茶名) 。颼飂古鼎松風掣。亂侵屐齒乍凹凸。細灑簾旌仍委纈。詩翁競勝巧形容。島瘦郊寒全不屑。清歡渇望兩相争。此景年來曽幾瞥。朱鳥温暾綿襖披。三希佳事還堪説。明窗浄几展時晴。古法平沙劃錐鐡。定興道中雪用東坡聚星堂體并元韻四首。丙寅（西元一七四六年）長至後三日御筆。\
  \ \n 印記： \n比德、朗潤、幾暇怡情 \n 題跋 \n 清高宗 \n 前副葉四（附裝） \n 時日丁亥（西元一七六七年）二月朔。 \n 行書 \n 自辰還至未。既密亦時踈。即即皚皚矣。瀌瀌奕奕如。雙眸望無負。三寸積仍餘。始慰籌農願。園林景起予。冬春以來望雪甚殷。上元後二日飛霞先零。入夕密霙連旦。次日復得雪三寸。因成此律。還宮展冊書之以識。時日丁亥（西元一七六七年）二月朔。\
  \ \n 印記： \n席上珍 \n 題跋 \n 清高宗 \n 前副葉四（附裝） \n 乙酉（西元一七八九年）十月廿八日。祥霙應候。盈尺告豐。至足喜也。既成斯什。仍展快雪。書以識之。御筆。 \n 行書\
  \ \n 夜問璇霄密霰霏。凌晨大作六花飛。未經渇望叨佳澤。早見優霑報近畿。一色玉封金瓦厚。幾幾層珠綴繡櫳輝。麥田又兆眀年喜。益切持盈勵慎微。乙酉（西元一七八九年）十月廿八日。祥霙應候。盈尺告豐。至足喜也。既成斯什。仍展快雪。書以識之。御筆。\
  \ \n 印記： \n古香、太璞 \n 題跋 \n 清高宗 \n 前副葉五 \n 己卯（西元一七五九年）仲春杪。御識。 \n 行書 \n 入春甘雪頻霑。繼以知時好雨。土膏含潤。茲因耕耤。還宮憑覽增快。明窗展玩。書之以志劭農。己卯（西元一七五九年）仲春杪。御識。\
  \ \n 印記： \n比德、朗潤 \n 題跋 \n 清高宗 \n 前副葉五 \n 庚辰（西元一七六０年）小除夕御筆。 \n 行書 \n 同雲過午落瓊花。歷夕侵宵勢更加。澤繼三朝敷渥足。春先十日兆和嘉。裝梅宫植舒梅蕚。利麥盆籖潤麥芽。殿瑞啟祥真大吉。慰餘益慎敢矜誇。今冬雖得雪稍遲。而臘後春前再霑時玉。輒成復雪一律。并書是冊志快。庚辰（西元一七六０年）小除夕御筆。\
  \ \n 印記： \n古香、含輝 \n 題跋 \n 清高宗 \n 前副葉五 \n 行書 \n 乾隆丙寅新正幾暇。因觀羲之快雪時晴。愛此側理。輙寫雲林大意。 \n 印記： \n乾隆宸翰 \n 題籤 \n\
  \ 前副葉五（右分裝） \n 楷書 \n 快雪時晴帖。晉右將軍會稽內史王羲之真蹟。 \n 題籤 \n 前副葉五（左分裝） \n 楷書 \n 王羲之快雪時晴墨蹟。三希堂所刻與快雪堂帖相等。 \n 題跋\
  \ \n 清高宗 \n 前副葉五（附裝） \n 戊子（西元一七六八年）十一月晦日。祥霙竟夜迎臘。應時記勝之占。此其初驗。曉成一律。書冊志慰。御筆。 \n 行書 \n 入冬已兩月。落雪忽通宵。幸值三寸積。慚稱六幕調。麥麰含臘潤。疾病以時消。清曉出聽政。慰心同百寮。戊子（西元一七六八年）十一月晦日。祥霙竟夜迎臘。應時記勝之占。此其初驗。曉成一律。書冊志慰。御筆。\
  \ \n 印記： \n澂觀 \n 題跋 \n 清高宗 \n 前副葉五（附裝） \n 丁亥（西元一七六七年）仲冬晦日。御筆。 \n 行書 \n 中宵雲勢報濃稠。逹旦瀌瀌雨雪浮。弗啻先春更先臘。誠欣惟渥亦惟優。簷留瓦白鋪重厚。砌掩甎青掃未休。綏屢後逢占麥稔。敬承何以勵吾脩。盼雪正殷而時霙再佈。後成一律。書冊以識豐占。丁亥（西元一七六七年）仲冬晦日。御筆。\
  \ \n 印記： \n含輝 \n 題跋 \n 清高宗 \n 本幅、後副葉一之間裱綾 \n 行書 \n 神。 \n 印記： \n乾隆宸翰 \n 題跋 \n 趙孟頫 \n 後副葉一 \n 延祐五年（西元一三一八年）四月二十一日。翰林學士承旨榮祿大夫知制誥兼脩國史臣趙孟頫奉勑恭跋。\
  \ \n 行書 \n 東晉至今近千年。書跡傳流至今者絕不可得。快雪時晴帖。晉王羲之書。歷代寶藏者也。刻本有之。今乃得見真跡。臣不勝欣幸之至。延祐五年（西元一三一八年）四月二十一日。翰林學士承旨榮祿大夫知制誥兼脩國史臣趙孟頫奉勅恭跋。\
  \ \n 題跋 \n 清高宗 \n 後副葉一 \n 行書 \n 以後展玩。亦不復題識矣。 \n 印記： \n太上皇帝 \n 題跋 \n 清高宗 \n 後副葉一 \n 已巳（西元一七四九年）臘日。雪後乘興縮臨此帖一過。命朱采刻於姚宗仁所製玩鵝玉器。亦一佳話也。三希堂并識。\
  \ \n 行書 \n 已巳（西元一七四九年）臘日。雪後乘興縮臨此帖一過。命朱采刻於姚宗仁所製玩鵝玉器。亦一佳話也。三希堂并識。 \n 印記： \n古香、太璞 \n 題跋 \n 清高宗 \n 後副葉一\
  \ \n 乾隆偶記。 \n 行書 \n 右軍此帖跋語俱佳。紙亦清瑩可玩。朕題識數番。喜其與筆墨相和。愛不釋手。得意輒書。無居次第也。乾隆偶記。 \n 印記： \n乾隆御賞、幾暇怡情、清玩 \n 題跋\
  \ \n 清高宗 \n 後副葉一 \n 行書 \n 琳瑯球璧世間所有若此帖乃稀世珍耳。 \n 印記： \n乾隆宸翰、幾暇臨池 \n 題跋 \n 清高宗 \n 後副葉一（附裝） \n 庚寅（西元一七七０年）小春上濣御筆。\
  \ \n 行書 \n 前日狂風昨日陰。問宵其雪尚難諶。詢安剛喜霰絲集。勅政遂看花片侵。閶闔有煙還詄蕩。樓臺無處不深沈。未曾渇望霑優澤。益切冰兢凛照臨。回鑾次日問安。適遇祥霙。時尚未盼雪。詩成書以志快。庚寅（西元一七七０年）小春上濣御筆。\
  \ \n 印記： \n比德 \n 題跋 \n 劉賡 \n 後副葉二 \n 翰林學士承旨臣劉賡奉聖旨謹跋 \n 楷書 \n 王逸少書。不可多得。於好事家。蓋見之一二焉。此祕閣所藏快雪時晴帖墨本。乃真蹟也。尤為奇特。翰林學士承旨臣劉賡奉聖旨謹跋。\
  \ \n 題跋 \n 清高宗 \n 後副葉二 \n 庚子（西元一七八０年）新正雪晴有作。昨得漢玉石子。命工製為羲之玩鵝。曾縮臨是帖於上。故末句及之并書於冊。御識。 \n 行書 \n 雪霽亦云可。年前三白過。迷離融日彩。景色凑春和。冰筯垂簷細。銀花纈樹多。時晴臨縮本。玉枕較如何。庚子（西元一七八０年）新正雪晴有作。昨得漢玉石子。命工製為羲之玩鵝。曾縮臨是帖於上。故末句及之并書於冊。御識。\
  \ \n 印記： \n比德、朗潤 \n 題跋 \n 清高宗 \n 後副葉二 \n 行書 \n 龍跳天門。虎臥鳳閣。 \n 印記： \n乾、隆 \n 題跋 \n 清高宗 \n 後副葉二 \n 甲申（西元一七六四年）臘前二日。雪應時。麥收可卜。輒成一律述志。展冊書之。用記慶慰。御筆。\
  \ \n 行書 \n 入冬雖盼六花舒。又慮無厭蜀望予。甘澤那辭預霑也。碩苖真是莫知如。灑空猶在一陽節。積地已將三寸餘。榖稔復斯欣卜麥。怵思美善若何居。甲申（西元一七六四年）臘前二日。雪應時。麥收可卜。輒成一律述志。展冊書之。用記慶慰。御筆。\
  \ \n 印記： \n古香、太璞 \n 題跋 \n 清高宗 \n 後副葉二（右分裝） \n 癸卯（西元一七八三年）嘉平月下濣。御筆。 \n 行書 \n 盼雪逮冬盡。一朝甚一朝。三更稱霰集。四鼓報霙飄。真沃心芽潤。深培麥本饒。惟期盈尺積。寧祗百憂消。夜雪一律。癸卯（西元一七八三年）嘉平月下濣。御筆。\
  \ \n 印記： \n古稀天子、猶日孜孜 \n 題跋 \n 清高宗 \n 後副葉二（左分裝） \n 甲辰（西元一七八四年）嘉平月下濣。御筆。 \n 行書 \n 冬後望霙亟。春前值雪祥。積將三寸厚。落以四時長。頓止殊堪惜。再霑斯益臧。祈農不知足。此亦我之常。雪一律。甲辰（西元一七八四年）嘉平月下濣。御筆。\
  \ \n 印記： \n古稀天子、猶日孜孜 \n 題跋 \n 清高宗 \n 後副葉二（附裝） \n 辛卯（西元一七七一年）長至前齋宮迎雪作。書此以識。御筆。 \n 行書 \n 申末天衣佈。亥初瑞葉舒。繼飄旋繼大。時疾復時徐。問徹五更夜。知霑三寸餘。明當詣壇宿。凴輦慶何如。辛卯（西元一七七一年）長至前齋宮迎雪作。書此以識。御筆。\
  \ \n 印記： \n朗潤 \n 題跋 \n 清高宗 \n 後副葉二（附裝） \n 庚寅（西元一七七０年）嘉平既望。祥花密霏自晨達午。喜其尚在臘中。成句書冊。御筆。 \n 行書 \n 孟冬霑厚澤。兩月隔云遙。祈歲吾惟切。望雲心已焦。濃陰五更報。侵曉六霙飄。遂見紛飛密。旋成委積饒。先春真是臘。凝凍未全消。過午晴曦晃。欣餘惜轉招。庚寅（西元一七七０年）嘉平既望。祥花密霏自晨達午。喜其尚在臘中。成句書冊。御筆。\
  \ \n 印記： \n比德、朗潤 \n 題跋 \n 護都沓兒 \n 後副葉三 \n 賜進士及第翰林待制承直郎兼國史院編脩官臣護都沓兒奉勑恭跋 \n 楷書 \n 晉王羲之墨跡。前賢已多論者。當為天下法書第一。快雪時晴帖歷年雖遠。神物護持。不至磨滅。傳之今日。甚可珍藏也。又使四海之內。學儒諸生。知萬幾之暇。不事遊畋。不寶珠玉。博古尚文。致精如此。延祐五年（西元一三一八年）四月廿三日。賜進士及第翰林待制承直郎兼國史院編脩官臣護都沓兒奉勑恭跋。\
  \ \n 題跋 \n 清高宗 \n 後副葉三 \n 庚午（西元一七五０年）除夕前三日齋次。 \n 行書 \n 每對右軍此書。輒有成連海上之歎。況甘雪應時。情景適合。快何如之。庚午（西元一七五０年）除夕前三日齋次。\
  \ \n 印記： \n古香、太璞 \n 題跋 \n 清高宗 \n 後副葉三 \n 乾隆御識。 \n 行書 \n 放勳命羲和。定時以閏月。今歲閏在春。二月不妨雪。密雲連宵旦。庭樹踈陰歇。時而散冰花。時而灑瓊屑。但覺春融盎。不苦寒栗冽。縱賞意固佳。倚吟興堪結。被井乳欲酥。壓梅腰豈折。分茶潄芳潤。展帖挹清絶。破臘懸望餘。素景慰心别。已疾氣昭蘇。宜麥月單閼。白詩遣幾暇。事同異其說。堪方雨有靈。漫比霜不殺。孫賦亦熟讀。詎厭聞妖孽。農語有明徵。未至清明節。春雪和白居易韻。偶展右軍。遂書冊上。乾隆御識。\
  \ \n 印記： \n得佳趣、席上珍、內府珍秘 \n 題跋 \n 清高宗 \n 後副葉三（右分裝） \n 乙巳（西元一七八五年）冬至廿一日。御筆。 \n 行書 \n 集霰當辰末。霏霙遂午中。漫漫静入夜。習習幸無風。問到五更止。積來四寸同。祈恩蒙霈澤。寅謝惕深衷。雪一律。乙巳（西元一七八五年）冬至廿一日。御筆。\
  \ \n 印記： \n比德、朗潤 \n 題跋 \n 清高宗 \n 後副葉三（左分裝） \n 丙午（一七八六年）孟冬月廿九日。御筆。 \n 行書 \n 醖釀連三日。鬖髿徹一宵。望深因亟慰。問夜達崇朝。鴛瓦玉為壘。虬松花作標。詣壇當謁拜。欽謝惕猶饒。夜雪一律。丙午（西元一七八六年）孟冬月廿九日。御筆。\
  \ \n 印記： \n會心不遠、德充符 \n 題跋 \n 清高宗 \n 後副葉三（附裝） \n 癸巳（西元一七七三年）仲冬二日雪成什。積素雖未足慰懷。書冊聊以紀候。御筆。 \n 行書 \n 入晩復飄雪。達晨密間踈。看將盈二寸。未足樂三餘。澤也目因潤。惜哉心那舒。不知足為過。觀過或知予。癸巳（西元一七七三年）仲冬二日雪成什。積素雖未足慰懷。書冊聊以紀候。御筆。\
  \ \n 印記： \n會心不遠 \n 題跋 \n 清高宗 \n 後副葉三（附裝） \n 壬辰（西元一七七二年）小春十有八日夜雪成什。明窗積霙。映素展冊怡然。御筆。 \n 行書 \n 夜醒問軍報。却稱密雲鋪。三更遂飄落。五鼓罷紛敷。晨接二寸奏。節先十日符。晴雖弗致惜。致惜那能無。壬辰（西元一七七二年）小春十有八日夜雪成什。明窗積霙。映素展冊怡然。御筆。\
  \ \n 印記： \n比德 \n 題跋 \n 劉承禧 \n 後副葉四 \n 麻城劉承禧永存珍祕 \n 行書 \n 天下法書第一。吾家法書第一。麻城劉承禧永存珍秘。 \n 題跋 \n 清高宗 \n 後副葉四\
  \ \n 行書 \n 誓墓髙風有足多。獨推書聖却云何。行雲流水参神韻。筆陣傳來祗白鵝。近題錢選觀鵝圖之作。春日齋居。清暇展閱此帖。輒漫書之。 \n 印記： \n乾隆御賞、幾暇怡情、清玩 \n 題跋 \n\
  \ 清高宗 \n 後副葉四 \n 丙子（西元一七五六年）二月七日。雪晴一律。書以志快且紀歲晴。御筆。 \n 行書 \n 候寒惟北方。二月雪猶常。終恐過凝凍。其如兹載陽。一時玉融白。萬戸襖披黃。後樂樂何有。先憂憂未央。丙子（西元一七五六年）二月七日。雪晴一律。書以志快且紀歲晴。御筆。\
  \ \n 印記： \n古香、太璞 \n 題跋 \n 清高宗 \n 後副葉四 \n 行書 \n 快晴時晴。致稱佳妙。乃今田燭。甫過天玉。平鋪彌目晶瑩。正與右軍斯帖相映發。瓷盆水仙古梅始綻。展冊欣然有會。己巳（西元一七四九年）仲冬御筆。\
  \ \n 印記： \n比德、朗潤 \n 題跋 \n 清高宗 \n 後副葉四 \n 御識并書。 \n 行書 \n 左幅繭紙光潤可愛。即效霅溪體補空。仲春下浣之二日。長春書屋。御識并書。 \n 印記： \n\
  乾隆宸翰 \n 題跋 \n 清高宗 \n 後副葉四 \n 行書 \n 丙寅（西元一七四六年）。 \n 印記： \n乾隆宸翰 \n 題跋 \n 清高宗 \n 後副葉四（右分裝） \n 行書 \n 積地誠三寸。知時方仲冬。乾坤清作氣。宫闕玉為容。較量前番渥。仍希後繼濃。掃收培樹本。敷錫霈恩重。丁未（西元一七八七年）冬至月廿三日。御筆。\
  \ \n 印記： \n比德、朗潤 \n 題跋 \n 清高宗 \n 後副葉四（左分裝） \n 戊申（西元一七八八年）冬至月廿六日。御筆。 \n 行書 \n 傍晚同雲色。中宵落雪花。逹晨益汗漫。望宇正鬖髿。詩寓都官體。畫標石谷家。被恩惟有惕。銘感實無涯。夜雪一律。戊申（西元一七八八年）冬至月廿六日。御筆。\
  \ \n 印記： \n比德、朗潤 \n 題跋 \n 清高宗 \n 後副葉四（附裝） \n 甲午（西元一七七四年）仲冬中濣。御筆。 \n 行書 \n 午雲蔽金烏。夜雪灑銅龍。渥澤迎長至。殷希慰半冬隔。隔窗想浩浩。積閣願重重。不寐消清漏。忘言聽遠鐘。寢衣身敢適。側席意彌顒。難說麥根固。艱哉憶在農。齋宮夜雪六韻。甲午（西元一七七四年）仲冬中濣。御筆。\
  \ \n 印記： \n比德、朗潤 \n 題跋 \n 清高宗 \n 後副葉四（附裝） \n 乙未（西元一七七五年）長至後二日雪一律。御筆。 \n 行書 \n 履長賀節御園來。翼日欣逢嘉雪哉。搴幌無邊迎目潤。拈毫有興沃心開。空霏麥粒宜隴麥。林染梅英映殿梅。掃却旋看又紛積。苑丞循例樹根培。乙未（西元一七七五年）長至後二日雪一律。御筆。\
  \ \n 印記： \n澂觀 \n 題跋 \n 清高宗 \n 後副葉五 \n 甲戌（西元一七五四年）燕九日對雪展帖因題。 \n 行書 \n 去臘及今歲春前優霑三白。燈夕後復降甘雪。快慰良深。同一雪也。予之快在農田。與昔賢之臨池揮翰者。快同而所以快者異矣。甲戌（西元一七五四年）燕九日對雪展帖因題。\
  \ \n 印記： \n會心不遠、德充符 \n 題跋 \n 清高宗 \n 後副葉五（左分裝） \n 庚戌（西元一七九０年）十一月廿一日雪六韻。御筆。 \n 行書 \n 入冬尚未雪。遠處却頻聞。雖識時堪待。亦縈望頗殷。問宵雲氣重。拂曙雪英紛。飄灑冰花勢。迷離玉樹紋。三時落止矣。二寸積誠云。初澤能無謝。謝中惜意懃。庚戌（西元一七九０年）十一月廿一日雪六韻。御筆。\
  \ \n 印記： \n比德、朗潤 \n 題跋 \n 清高宗 \n 後副葉五（右分裝） \n 行書 \n 微雪廿過餘。同雲晚布初。霰華先已集。寒夜密還疎。本弗望之切。亦稱懐以舒。曉霑報二寸。紀節五言書。己酉（西元一七八九年）冬至月廿三日夜雪一律。御筆。\
  \ \n 印記： \n比德、朗潤 \n 題跋 \n 清高宗 \n 後副葉五（附裝） \n 丁酉（西元一七七七年）冬至月廿九日復雪一律。御筆。 \n 行書 \n 復雪叨天貺。自宵連曙連。繽紛迷曠宇。霶霈濕非烟。誠幸逢膏續。仍欣在臘前。無人相慰藉。獨立一酸然。丁酉（西元一七七七年）冬至月廿九日復雪一律。御筆。\
  \ \n 印記： \n會心不遠、德充符 \n 題跋 \n 清高宗 \n 後副葉五（附裝） \n 行書 \n 半夜雲容重。凌晨雪意濃。依旬似甘雨。旉澤遍畿封。密壓垂枝竹。斜翻挺幹松。天庥沐頻疊。惟益勵虔恭。丙申（西元一七七六年）十一月初三日雪一律。\
  \ \n 印記： \n比德、朗潤 \n 題跋 \n 王穉登 \n 後副葉五、後副葉六（右半幅） \n 己酉（西元一六０九年）七月廿七日太原王穉登謹書 \n 行書 \n 朱太傅所藏二王真蹟共十四卷。惟右軍快雪大令送梨二帖。乃是手墨。餘皆雙鉤廓填耳。宋人雙鉤最精。出米南宮所臨者。往往辭（點去）亂真。故前代名賢不復辨論。槩以為神品。其確然無疑者。獨快雪送梨。玄賞之士。自能鑒定。不可與皮相耳食者論也。送梨已歸王敬美。此帖賣畫者盧生携來吳中。余傾槖購得之。欲為幼兒營負郭。新都吳用卿以三百鍰售去。今復為延伯所有。神物去來。但貴得所。不落沙叱利手。幸矣。在彼在此。奚必置意。考宣和書譜。此卷曾入天府。後歸賈師憲。又嘗為米老所藏。米自有跋。今在韓太僕家。因延伯命題。并述其流傳轉輾若此。己酉（西元一六０九年）七月廿七日太原王穉登謹書。\
  \ \n 印記： \n王穉登印、青羊君 \n 題跋 \n 汪道會 \n 後副葉六 \n 萬曆己酉（西元一六０九年）八月十有九日。新安汪道會敬觀於秦淮之水閣。 \n 楷書 \n 萬曆己酉（西元一六０九年）八月十有九日。新安汪道會敬觀於秦淮之水閣。是日清秋和適。鍾山致爽。得見無上法書真蹟。真百年中一大快也。\
  \ \n 題跋 \n 清高宗 \n 後副葉六 \n 已卯（西元一七五九年）十一月十四日時玉霏霙。計今冬已雨霑甘澤。即事成吟。書冊志快。 \n 行書 \n 連朝藴釀雲鋪厚。半夜霏微霰集來。雞樹曉増寒淰淰。鴛樓陰積白皚皚。田將前度添餘潤。澤較去年霑兩廻。發粟出裘寜待此。披襟惟是暢吟裁。已卯（西元一七五九年）十一月十四日時玉霏霙。計今冬已雨霑甘澤。即事成吟。書冊志快。\
  \ \n 印記： \n古香、含輝 \n 題跋 \n 清高宗 \n 後副葉六 \n 己卯（西元一七五九年）臘月十一日。御筆。 \n 行書 \n 去歲三冬無雪。今年小春及長至月再集祥霙。殷懷既慰。茲於春前七日甘雪復零。表瑞兆豐正符。三白滋宿麥而靖遺蝗。臘鼓聲中農歌志慶。致足快也。幾餘展冊因題數語識之。己卯（西元一七五九年）臘月十一日。御筆。\
  \ \n 印記： \n比德、朗潤 \n 題跋 \n 清高宗 \n 後副葉六 \n 丙寅（西元一七四六年）仲冬雪後過淑清苑。續舊作積素墜枝全作雨之句。歸展此帖欣然有會。命筆書之。 \n 行書 \n 丙寅（西元一七四六年）仲冬雪後過淑清苑。續舊作積素墜枝全作雨之句。歸展此帖欣然有會。命筆書之。\
  \ \n 印記： \n乾隆宸翰 \n 題跋 \n 清高宗 \n 後副葉六 \n 丁卯（西元一七四七年）嘉平之望。幾暇重展是卷。適天際同雲密布。瑞葉頻飄。對景揮毫不覺為之一快。用書冊尾以志欣筆。 \n\
  \ 行書 \n 丁卯（西元一七四七年）嘉平之望。幾暇重展是卷。適天際同雲密布。瑞葉頻飄。對景揮毫不覺為之一快。用書冊尾以志欣筆。 \n 印記： \n德充符、幾暇怡情 \n 題跋 \n 清高宗 \n 後副葉六（左分裝）\
  \ \n 壬子（西元一七九二年）十一月廿五夜雪一律。御筆。 \n 行書 \n 終朝祗集霰。半夜乃霏霙。歷以五時久。積將六寸成。入冬天地合。先臘麥麰亨。望亟慰亦亟。持心戒滿盈。壬子（西元一七九二年）十一月廿五夜雪一律。御筆。\
  \ \n 印記： \n比德、朗潤 \n 題跋 \n 清高宗 \n 後副葉六（右分裝） \n 辛亥（西元一七九一年）十一月十日雪一律。御筆。 \n 行書 \n 先集霰通朝。密霏霙入宵。疾徐無間斷。悠暢恣飄蕭。問已重簷積。知將三寸饒。拈毫敢誌慰。慰又恐心驕。辛亥（西元一七九一年）十一月十日雪一律。御筆。\
  \ \n 印記： \n比德、朗潤 \n 題跋 \n 清高宗 \n 後副葉六（附裝） \n 戊戌（西元一七七八年）孟冬月下濣微雪一律。御筆。 \n 行書 \n 入冬微雪兩三逢。此番頗欣雲勢濃。稷粒落來看已化。墻陰纔得指餘封。對時惟願滋郊麥。助景那因羃禁松。傍晩寥空旋開霽。依然失望祗無悰。戊戌（西元一七七八年）孟冬月下濣微雪一律。御筆。\
  \ \n 印記： \n比德、朗潤 \n 題跋 \n 清高宗 \n 後副葉六（附裝） \n 己亥（西元一七七九年）臘八日微雪一律。御筆。 \n 行書 \n 丙夜問無雪。生雲報五更。質明方集霰。侵曉遂飄霙。落地未成寸。作風忽即晴。椒園禮嘉臘。不懌越怦怦。己亥（西元一七七九年）臘八日微雪一律。御筆。\
  \ \n 印記： \n澂觀 \n 題跋 \n 清高宗 \n 後副葉七 \n 辛巳（西元一七六一年）嘉年七日。瑞霙竟日。盈尺兆豐。賦此以志農慶。披冊命筆。用適幾餘清快。御筆。 \n 行書 \n 秋霖餘潤無資雪。冬麥含萌有雪宜。問夜天衣稱靄靄。侵晨玉葉益綏綏。臘前應節祥堪卜。望外逢霑喜可知。昨已傳宣幸瓊島。瑶林生面一探奇。辛巳（西元一七六一年）嘉年七日。瑞霙竟日。盈尺兆豐。賦此以志農慶。披冊命筆。用適幾餘清快。御筆。\
  \ \n 印記： \n清玩 \n 題跋 \n 清高宗 \n 後副葉七 \n 庚子（西元一七八０年）十一月初四。喜雪再記。 \n 行書 \n 庚子（西元一七八０年）十一月初四。喜雪再記。 \n 印記：\
  \ \n古稀天子、猶日孜孜 \n 題跋 \n 清高宗 \n 後副葉七 \n 癸酉（西元一七五三年）新正二日。瑞雪霏春。自午初迄於詰朝。繽紛玉墀。委積鴛瓦。去冬三白未及盈尺。得此為之暢然滿志。適以祈鼓致齋。靜對名蹟命筆記之。御識。\
  \ \n 行書 \n 癸酉（西元一七五三年）新正二日。瑞雪霏春。自午初迄於詰朝。繽紛玉墀。委積鴛瓦。去冬三白未及盈尺。得此為之暢然滿志。適以祈鼓致齋。靜對名蹟命筆記之。御識。 \n 印記： \n德充符、得佳趣\
  \ \n 題跋 \n 清高宗 \n 後副葉七 \n 壬午（西元一七六二年）長至前三日。得雪有述。書以誌時。御筆。 \n 行書 \n 夜問高空起凍雲。侵晨瑞葉佈縈紛。本非渇望逢尤幸。即得優霑僉共欣。滂配早占隴麥護。攅團似助盎梅芬。寒増遑避徒杠誚。賑粥施衣且盡勤。壬午（西元一七六二年）長至前三日。得雪有述。書以誌時。御筆。\
  \ \n 印記： \n太璞 \n 題跋 \n 文震亨 \n 後副葉七（右半幅） \n 吳郡雁門文震亨記 \n 行書 \n 余婿於太原氏故徵君。所藏卷軸無不寓目。當時極珍重此帖。築亭貯之。即以快雪名。每風日晴美。出以示客賞玩。彌日不厭。後歸用卿氏。不無自我得之。自我失之之恨。徵君遊道山後。余從用卿所。復時得展玩。可謂與此帖有緣。不至如馬策叩西州門時也。因題而歸之。若夫王嬙西子之美麗。有目共識。更無藉余之邪許矣。吳郡雁門文震亨記。\
  \ \n 印記： \n啟美、香草圖書、木雞生 \n 題跋 \n 吳廷 \n 後副葉七（左半幅）、後副葉八 \n 天啟二年（西元一六二二年）三月望日。書於楚舟。餘清齋主人記。 \n 楷書 \n 余與劉司隸延伯寓都門。知交有年。博古往來甚多。司隸罷官而歸。余往視兩番。歡倍疇昔。余後復偕司隸至雲間。携余古玩近千金。余以他事稽遲海上。而司隸舟行矣。遂不得別。余又善病。又不能往楚。越二年。聞司隸仙逝矣。司隸交遊雖廣。相善者最少。獨注念于余。余亦傷悼不已。因輕裝往吊之。至其家。惟空屋壁立。尋訪延伯家事。併所藏之物。皆云為人攫去。又問快雪帖安在。則云存。還與公。尚未可信。次日往奠其家。果出一帳。以物償余前千金。值快雪帖亦在其中。復恐為人侵匿。聞于麻城令君用印。託汝南王思延將軍付余。臨終清白。歷歷不負。可謂千古奇事。不期吳門携去之物。復為合浦之珠。展卷三歎。因記顛末。嗟嗟。此帖在朱成國處。每談為墨寶之冠。後流傳吳下。復歸余手。將來又不知歸誰。天下奇物。自有神護。倘多寶數百年于餘清齋中足矣。將來摹勒上石。此一段情景。與司隸高誼。同炳千秋可也。天啟二年（西元一六二二年）三月望日。書於楚舟。餘清齋主人記。\
  \ \n 印記： \n吳廷私印、江邨 \n 題跋 \n 董誥 \n 後副葉七（左分裝） \n 乾隆癸丑（西元一七九三年）冬至月。臣董誥敬書。 \n 楷書 \n 絮雲濃午末。稷雪落申初。問徹更長短。報稱霏疾徐。滿空澤猶醖。二寸積誠餘。冰上收原富。樹根堆不虚。因之賞行衆。誰識盼仍予。翹首時晴晦。益増嗟以噓。御製雪六韻。乾隆癸丑（西元一七九三年）冬至月。臣董誥敬書。\
  \ \n 印記： \n臣、誥 \n 題跋 \n 清高宗 \n 後副葉七（右分裝） \n 御識 \n 行書 \n 予八十有三不用眼鏡。今歲詩字多艱。於細書命董誥代寫。亦佳話也。御識。 \n 印記： \n\
  八徵耄念、自強不息 \n 題跋 \n 清高宗 \n 後副葉七（附裝） \n 庚子（西元一七八０年）元旦日雪一律。御筆。 \n 行書 \n 除夕顒看剛霰集。三更肅拜落霙微。質明侵曉纔綏佈。歷午達申遂暢霏。望過三冬澤猶靳。欣蒙元旦福如幾。方珪圓璧隨形相。䜿灑横排勢霍揮。四字適增曹植頌。千官都㸃謝莊衣。慶因首祚叨天貺。冀更鴻禧遍帝畿。應節果然為六出。臨池餘事逮三希。自惟何以克當此。屢省欽哉慎所依。庚子（西元一七八０年）元旦日雪一律。御筆。\
  \ \n 印記： \n比德、朗潤 \n 題跋 \n 王穉登 \n 後副葉八 \n 皇明萬曆甲辰（西元一六０四年）三月廿八日。太原王氏尊生齋重裝。 \n 行書 \n 皇明萬曆甲辰（西元一六０四年）三月廿八日。太原王氏尊生齋重裝。\
  \ \n 題跋 \n 清高宗 \n 後副葉八 \n 癸未（西元一七六三年）臘前一日。盈尺兆瑞。輒成一律。雪窗展冊。書以誌時。御筆。 \n 行書 \n 徹夜雲同色。侵晨雪舞翩。敢輕言慰矣。惟益冀霑焉。竟至逹申後。猶欣值臘前。心田滋渇望。可以命吟篇。癸未（西元一七六三年）臘前一日。盈尺兆瑞。輒成一律。雪窗展冊。書以誌時。御筆。\
  \ \n 印記： \n古香、太璞 \n 題跋 \n 清高宗 \n 後副葉八 \n 壬寅（西元一七五二年）十月十七日夜雪一律。御筆。 \n 行書 \n 入夜凍雪粘。中宵稷霰纎。初聞㸃方作。既報片徐添。颯㳫漸傳牖。迷離云羃簷。明當小雪節。汜勝叶祥占。壬寅（西元一七五二年）十月十七日夜雪一律。御筆。\
  \ \n 印記： \n比德、朗潤 \n 題跋 \n 清高宗 \n 後副葉八 \n 丙寅（西元一七四六年）春二月上濣御筆又識。 \n 行書 \n 王右軍快雪帖為千古妙蹟。收入大內養心殿有年矣。予幾暇臨仿不只數十百過。而愛玩未已。因合子敬中秋元琳伯遠二帖貯之溫室中。顏曰三希堂。以志希世神物。非尋常什襲可并云。丙寅（西元一七四六年）春二月上濣御筆又識。\
  \ \n 印記： \n乾、三希堂、隆 \n 題跋 \n 清高宗 \n 後副葉八 \n 丁丑（西元一七五七年）仲冬之朔冬至前十日也。甘雪應時。賦此志喜。即書冊尾以紀歲月。御筆。 \n 行書 \n 問夜同雲布。詰晨密雪披。祥徴子月朔。信速十朝期。玉海得真趣。天山繫遠思。上林紛可望。花滿萬年枝。丁丑（西元一七五七年）仲冬之朔冬至前十日也。甘雪應時。賦此志喜。即書冊尾以紀歲月。御筆。\
  \ \n 印記： \n古香、太璞 \n 題跋 \n 清高宗 \n 後副葉八 \n 御題。 \n 行書 \n 老矣三年命捉刀。祥霙應節霈恩豪。獲麟釐汭近上日。七字因之重渉毫。御題。 \n 印記： \n\
  自強不息 \n 題跋 \n 董誥 \n 後副葉八（左分裝） \n 乾隆乙卯（西元一七九五年）孟冬月。臣董誥敬書。 \n 行書 \n 大雪掄節至。祥霙入夕和。達晨時踈密。逮已益鬖髿。未切一心望。欣霑七寸多。占農歸政喜。虔惕感如何。御製雪一律。乾隆乙卯（西元一七九五年）孟冬月。臣董誥敬書。\
  \ \n 印記： \n臣、誥 \n 題跋 \n 董誥 \n 後副葉八（右分裝） \n 乾隆甲寅（西元一七九四年）臘月。臣董誥敬書。 \n 楷書 \n 地潤秋霖非望雪。遠霑近未畧慚然。昨霏今繼雜梅蕚。晴灑陰飄幻栁棉。真是沃心符臘節。底須躗語詡春前。慰哉轉眼旋生慮。恐却斯情頓弛虔。御製雪一律。乾隆甲寅（西元一七九四年）臘月。臣董誥敬書。\
  \ \n 印記： \n臣、誥 \n 題跋 \n 清高宗 \n 後副葉八（附裝） \n 辛丑（西元一七八一年）長至月十二日雪一律。御筆。 \n 行書 \n 將言時應祈甘雪。傍晚雲濃夜雪霏。敢謂澤霑弗重籲。越欽恩渥示先幾。近連太液迷銀界。遠望西山隠翠微。纔覺希膏遇優霈。何修惟益慎宵衣。辛丑（西元一七八一年）長至月十二日雪一律。御筆。\
  \ \n 印記： \n古稀天子、猶日孜孜 \n 題跋 \n 清高宗 \n 後副葉八（附裝） \n 壬申（西元一七五二年）。祈穀齋日適得甘雪。越二日詣齋宮又值快晴。南窗暄景展卷。欣然命筆記之。 \n 行書\
  \ \n 壬申（西元一七五二年）。祈穀齋日適得甘雪。越二日詣齋宮又值快晴。南窗暄景展卷。欣然命筆記之。 \n 印記： \n比德 \n 題跋 \n 梁詩正。汪由敦。勵宗萬。張若靄。裘曰修。陳邦彦。董邦逹。\
  \ \n 後副葉九 \n 云臣梁詩正。臣汪由敦。臣勵宗萬。臣張若靄。臣裘曰修。臣陳邦彦。臣董邦逹敬跋。臣梁詩正敬書。 \n 楷書 \n 晉右將軍書。龍跳虎臥。歷代寶傳。趙孟頫蘭亭跋云。昔人得古刻數行。專心學之便可名世。此快雪帖二十八字。迄今千數百年。楮墨猶新。神采耀發。豈鐫拓鉤摹所可比擬。臣等奉敕編纂石渠寶笈。獲見內府所藏。斯為第一。我皇上好古敏求。萬幾之暇精硏八法。是帖心摹手追。不下數十百本。而聖懐虚受。猶臨池未輟也。丙寅春正清宴是娯。復臨兹帖。御製七言斷句五章題于册首。因副頁宋牋古潤可愛。更濡筆作雲林小景。傳示臣等。伏惟右軍書為千古藝林神品。得逢稽古右文之主。黙契薪傳。鑑賞珍重。金壺墨汁親灑簡端。睿藻古香輝聫璧合。臣等敬觀之餘。曷勝慶幸。因石渠寶笈成於乙丑之秋。是以御筆詩畫未及恭載。云臣梁詩正。臣汪由敦。臣勵宗萬。臣張若靄。臣裘曰修。臣陳邦彦。臣董邦逹敬跋。臣梁詩正敬書。\
  \ \n 印記： \n臣、詩正 \n 題跋 \n 清高宗 \n 後副葉十 \n 行書 \n 妙。 \n 印記： \n乾隆御覽之寶 \n 題跋 \n 張若靄 \n 後副葉十 \n 乾隆丙寅（西元一七四六年）春月。張若靄拜手敬識。\
  \ \n 楷書 \n 羲之快雪時晴帖。美擅千古。皇上幾餘臨寫。形諸詠歌。又以册前側理古潔可愛。御製踈林亭子於上。靄臣再承命繪梅花一枝於末幅。右軍書法天然出塵。較鄧尉曉風。羅浮夜月。古香絶態。殆欲過之。愧拙筆不能傳神萬一耳。乾隆丙寅（西元一七四六年）春月。張若靄拜手敬識。\
  \ \n 印記： \n臣靄、初學之筆、餘事 \n 此札前后署名具礼，通幅运笔沉着，结体优美。由收传印记与文献记载，现存一般认为是唐代精摹本。主帖行书四行二十八字，内容略述大雪初晴时的心情及对亲朋的问候，结构由首语、正文和结尾三段组成。文中除「頓首」、「果為」等字作连笔草书外，通幅以行书为主，并兼带楷法严谨的笔意，展现不疾不徐的雍容神态与流利秀美的意致。明代鉴赏家詹景凤指出，此迹笔法圆劲古雅，意态闲逸，对赵孟頫的行书有很深的影响。从用笔来看，此帖多圆钝的用笔，点画勾挑都不露锋，结体平稳匀称，在优美的姿态之中，流露出质朴内敛的意韵。"
transcription: "羲之頓首。快雪時晴。佳想安善。未果為結。力不次。王羲之頓首。山陰張侯。 \n 王羲之 ，祖籍山东，出身仕族世家，西晋末随父南渡，作过右军将军，会稽内史，东晋永和年间（345-356）去职，与东土名士尽山水之游。热衷诗歌，音乐与书法。他学书历程是由近而古，转益多师，取资广博，尤其精研体势，将秦篆汉隶各种不同的笔法，融于真行草体中，形成最佳体势，所以唐朝人称颂他\
  \ “兼撮众法，备成一家，为万世宗师” 。"
