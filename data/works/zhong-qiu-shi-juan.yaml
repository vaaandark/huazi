summary: 此《中秋诗卷》由明代沈周书写。此卷书于明弘治二年（作者时年 63 岁），沈周在双峨楼追忆三年前与浦舒庵、祝允明等人的中秋赏月，将当年旧作《中秋诗》重新用行书写成此卷。诗文通过对比不同年龄段的赏月心境，抒发了作者对时光飞逝与人生无常的感慨。此卷现藏于台北故宫博物院。
description: "此《中秋诗卷》由明代沈周书写。此卷书于明弘治二年（作者时年 63 岁），沈周在双峨楼追忆三年前与浦舒庵、祝允明等人的中秋赏月，将当年旧作《中秋诗》重新用行书写成此卷。诗文通过对比不同年龄段的赏月心境，抒发了作者对时光飞逝与人生无常的感慨。此卷现藏于台北故宫博物院。\
  \ \n 明成化二十二年（1486）中秋前夜，六十岁的沈周与好友浦舒庵、祝允明及家中子侄共七人赏月，当时沈周曾作《十四夜月图》并赋诗（现藏于 美国波士顿美术馆 ）。 三年后的弘治二年（1489 年）中秋之后，沈周再次回忆起当年的雅集，在双峨楼用行书将同一首《中秋诗》重新书写成此长卷。\
  \ \n 引首明末著名书法家张瑞图题： 靜月"
transcription: "《八月十四夜同浦舒庵賞月》 \n 少年漫見中秋月，視與常時不分別。 \n老來珍重不易看，每把深杯戀佳節。 \n老人能得幾中秋？信是流光不可留。 \n古今換人不換月，舊月新人風馬牛。\
  \ \n後生茫茫不知此，年年見月年年喜。 \n老夫有眼見還同，感慨滿懷聊爾耳。 \n今宵十四已爛然，七客賞爭天下先。 \n庭空衣薄怯露氣，深檐穩坐仍清圓。 \n東風軋雲輕浪作，驀把太清渣滓却。 \n\
  浮雲雖欲忘吾人，壺中有酒且自樂。 \n舒庵况是吾故人，酒政有律無譁賓。 \n遞歌李白問月句，自覺白髮欺青春。 \n青春白髮固不及，且把酒波連月吸。 \n舒庵與我六十人，更問中秋賒四十。 \n 弘治己酉八月望後，書于雙峨樓，長洲沈周\
  \ \n 诗卷开篇点出：“ 少年漫见中秋月，视与常时不分别。 ” 在年轻人的眼里，生命才刚刚开始，未来的中秋还有无数个。因此，他们看中秋的月亮觉得与平时的月亮毫无二致，这是一种不知愁滋味、将大好时光视为理所当然的无忧与挥霍。随着岁月流转，心境截然不同：“\
  \ 老来珍重不易看，每把深杯恋佳节。老人能得几中秋？信是流光不可留。 ” 步入晚年，沈周深刻体会到生命的倒计时。每一次圆月都弥足珍贵，因为不知道自己还能看几次中秋月。这种对时光流逝的无力感，让他只能借着频频举起\
  \ “深杯”，试图在微醺中留住这美好的佳节。全篇最具哲学意味的感慨在于：“ 古今换人不换月，旧月新人风马牛。 ” 这与张若虚的 “江月何年初照人” 、李白的 “今月曾经照古人” 有着异曲同工之妙。天上那一轮明月亘古不变，但在月光下举杯的人却换了一代又一代。在永恒的宇宙面前，个体的生命显得无比短暂与渺小，“旧月”\
  \ 与 “新人” 之间看似毫无关联，却共同见证了自然规律的无情与人世的沧桑。难能可贵的是，沈周并没有在这份对光阴的感伤中陷入虚无。在诗的末尾，他笔锋一转：“ 舒庵与我六十人，更问中秋赊四十。 ” 既然流光不可挽留，那不如索性洒脱一点，幽默地向老天、向中秋再\
  \ “赊” 上四十年的光阴，期盼能活到百岁。 \n 明崇祯十一年（1638）文人 宋鸿 偶然在市集得到此卷，欢喜之余在卷后用行草书作《奉和启南先生玩月歌》跋 \n 《奉和啟南先生玩月歌》：一年幾見當頭月，況與平時有曾別。爍彩騰波以挂空，何人不賞中秋節。連霄絕翳是今秋，萬里無雲玉鏡留。宮中竊藥聞羿女，畏風猶喘似吳牛。人生焉得常如此，時有憂愁少歡喜。舉杯見月當盡歡，拍手高歌亦復耳。我今墜地逆旅，然得失寧知誰後先。持斧不煩修月戶，當軒喜得共清圓。片雲吹來翳復作，□感使之不可卻。蹔蒙何損太陽明，陋巷簞瓢不改樂。平分風月我何人，偶與山川作主賓。浩歌春江花月句，長風起浪和陽春。陽春白雪人難及，手捫三山連海吸。從今還賞六十秋，我至明年六（點去）四十方。\
  \ \n 崇禎戊寅春三月，偶得此歌于延陵市上，恨乏一圖配之。至中秋後五日，從友人□復得是圖，遂成合璧，喜而走筆和之。第珠玉在前，覺我形穢耳。同邑後學宋鴻識 \n 卷末为作者自识： 弘治己酉八月望後書于雙峨樓長洲沈周\
  \ \n 沈周 （1427—1509）字启南，号石田、白石翁、玉田生、有竹居主人等，长洲（今属江苏苏州市）人，明朝画家，吴门画派的创始人，明四家之一。"
