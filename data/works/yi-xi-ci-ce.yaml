id: yi-xi-ci-ce
title: 易系辞册
aliases: []
author: 朱熹
dynasty: 宋
script: xing
carrier: moji
holder: 台北故宫博物院
summary: 此《易系辞》册由宋代朱熹书写。全册共十四开，内容节录自《易传》（系辞、说卦传），共一百零七字，每行两字（大字行楷）。通幅行笔迅疾，纵逸奔放，擒纵自如，气势雄健。此册经元明两代藏家之手，于清乾隆时期入宫，著录于《石渠宝笈初编》，现藏于台北故宫博物院。
description: "此《易系辞》册由宋代朱熹书写。全册共十四开，内容节录自《易传》（系辞、说卦传），共一百零七字，每行两字（大字行楷）。通幅行笔迅疾，纵逸奔放，擒纵自如，气势雄健。此册经元明两代藏家之手，于清乾隆时期入宫，著录于《石渠宝笈初编》，现藏于台北故宫博物院。\
  \ \n 此作品是行楷大书，每字在五寸之上，是朱熹存世仅见的大字墨迹（大约于作者四十五岁到五十三岁之间写成）。朱熹对书法也有所讲究。朱熹的楷书作品与唐代虞世南的相比，笔法与结体相近。《易·系辞》中字的结体，上重下轻，也与虞字相近。行笔深沉而急速，时有飞白，大有快剑斫阵，筋骨突出，这也是朱熹书迹常见的特征。"
transcription: "易有太極，是生兩儀，生四象，四象生八卦，八卦定吉凶，吉凶生大業。古者伏羲氏之王天下也，仰則觀象於天，俯則觀法於地，觀鳥獸之文，與地之宜。於是始作八卦，以通神明之德，以類萬物之情。天地定位，山澤通氣，雷風相薄，水火不相射。八卦數相錯，往者順，知來者逆，是故易逆數也。朱熹書\
  \ \n 此作清代乾隆时期入藏清内府，上钤「乾隆御覽之寶」「御書房鑒藏寶」「石渠寶笈」「嘉慶御覽之寶」，《石渠宝笈初编》有著录。清道光时期被赐给恭亲王奕䜣，后辗转由罗振玉购得。其后流落于日本，经驻日侨领林宗毅先生购得。最终由林宗毅于\
  \ 1983 年捐赠给台北故宫博物院。 \n 木匣上（罗振玉）篆书题： 高宗純皇帝御題宋朱文公書易繫真蹟 \n 朱熹 ，字元晦，一字仲晦，斋号晦庵、考亭，晚称晦翁，又称紫阳先生、紫阳夫子、沧州病叟、云谷老人，行五十二，小名沋郎，小字季延，谥文，又称朱文公，籍贯江南东路徽州婺源县，出生于福建路南剑州尤溪县，南宋理学家，程朱理学集大成者，学者尊称朱子。"
