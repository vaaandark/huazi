id: han-shi-tie
title: 寒食帖
aliases: []
author: 苏轼
dynasty: 宋
script: xing
carrier: moji
holder: 台北故宫博物院
summary: 《黄州寒食诗卷》（寒食帖）是宋元丰二年苏轼谪居黄州后的第三年四月寒食日，有感于季节更替、生活困乏以及仕途挫折，于是作寒食诗二首，他在诗中倾诉因乌台诗案被贬到湖北黄州后的心情，其后书写成本卷。后人誉为苏轼存世最好的书迹，卷后并有黄庭坚题跋。此卷现藏于台北故宫博物院。
description: "《黄州寒食诗卷》（寒食帖）是宋元丰二年苏轼谪居黄州后的第三年四月寒食日，有感于季节更替、生活困乏以及仕途挫折，于是作寒食诗二首，他在诗中倾诉因乌台诗案被贬到湖北黄州后的心情，其后书写成本卷。后人誉为苏轼存世最好的书迹，卷后并有黄庭坚题跋。此卷现藏于台北故宫博物院。\
  \ \n 此卷大约写于元丰五年，东坡在二诗中倾诉因乌台诗案被贬到湖北黄州后之心情，通篇文字随情绪的起伏而攲侧错落、跌宕生姿，字也越写越大。东坡写字不善悬腕，却自由的写出充满个人主义的风格。苏字结体开阔，笔划遒劲深厚，墨色浓黑如漆，开创书法抒情的新境界。\
  \ \n 此帖历经几次的火灾，遭祝融之舌纹身，素笺上留下了伤痕，然而内容文字毫发无伤。清朝咸丰八年，此帖藏圆明园历经英法联军之厄，有惊无险，旋即流落民间藏家之手。几经转手，在 1922 年流入日本，被收藏家菊池惺堂高价购得。次年，菊池家在日本东京大地震中遭灾，所藏古字画几乎遭焚毁一空，菊池惺堂冒著生命危险，从烈火中将《寒食帖》抢救出来，帖上虽留下火舌烟熏痕，书迹无恙。之后在第二次世界战争期间，东京遭到空前的地震和火劫，东京大毁，此帖依然无恙。战事结束，此帖得以被购回，现藏台北故宫博物院。\
  \ \n 1913 年 2 月，晚清学者、藏书家梁鼎芬（字星海）题签 \n 宋蘇文忠黃州寒食詩帖真蹟，張文襄 [ 1 ] 张之洞 \n （张之洞） 稱為海內第一。意園物，獻龕藏。宣統癸丑 [ 2 ]\
  \ 梁鼎芬是广东人，光绪六年的进士，曾经因为反对李鸿章议和被贬官。他回广东后从事教育，得到两广总督张之洞赏识以后一直做张的幕僚。辛亥革命后，梁鼎芬成为保皇党，反对康梁维新，更反对孙文革命，力保满清，曾出任末代皇帝溥仪的师傅。这题签写于\
  \ “宣统癸丑”，已是 1913 年，梁鼎芬仍奉清正朔 “宣统”，表示不接受民国。 \n （梁鼎芬是广东人，光绪六年的进士，曾经因为反对李鸿章议和被贬官。他回广东后从事教育，得到两广总督张之洞赏识以后一直做张的幕僚。辛亥革命后，梁鼎芬成为保皇党，反对康梁维新，更反对孙文革命，力保满清，曾出任末代皇帝溥仪的师傅。这题签写于\
  \ “宣统癸丑”，已是 1913 年，梁鼎芬仍奉清正朔 “宣统”，表示不接受民国。） 二月，梁鼎芬題記。 \n 主体（行书十七行，一百二十九字）"
transcription: "自我來黃州，已過三寒食。年年欲惜春，春去不容惜。今年又苦雨，兩月秋蕭瑟。臥聞海棠花，泥污燕支雪。闇中偷負去，夜半真有力。何殊病少年， 子（點去） 病起頭已白。 \n 春江欲入戶，雨勢來不已。\
  \ 雨（點去） 小屋如漁舟，濛濛水雲裡。空庖煮寒菜，破竈燒濕葦。那知是寒食，但見烏銜帋。君門深九重，墳墓在万里。也擬哭塗窮，死灰吹不起。 \n 右黃州寒食二首 \n 卷后有跋十则 \n 清高宗乾隆题跋\
  \ 東坡書。豪宕秀逸。為顏楊以後一人。此卷乃謫黃州日所書。後有山谷跋。傾倒已極。所謂無意於佳乃佳者。坡論書詩云。茍能通其意。常謂不學可。又云。讀書萬卷始通神。若區區於點畫波磔間。求之則失之遠矣。乾隆戊辰（1748）清和月上澣八日御識\
  \ \n 印記： 乾、隆、幾暇臨池 \n 黃庭堅题跋 東坡此詩似李太白。猶恐太白有未到處。此書兼顏魯公。楊少師。李西臺筆意。試使東坡復為之。未必及此。它日東坡或見此書。應笑我於無佛處稱尊也 \n 董其昌题跋\
  \ 余生平見東坡先生真蹟。不下三十餘卷。必以此為甲觀。已摹刻戲鴻堂帖中。董其昌觀并題 \n 張縯题跋 東坡老仙三詩。先世舊所藏。伯祖永安大夫嘗謁山谷於眉之青神。有攜行書帖。山谷皆跋其後。此詩其一也。老仙文高筆妙。粲若霄漢雲霞之麗。山谷又發揚蹈厲之。可為絕代之珍矣。昔曾大父禮院官中秘書。與李常公擇為僚。山谷母夫人。公擇女弟也。山谷與永安帖自言。識先禮院於公擇舅坐上。由是與永安游好。有先禮院所藏昭陵御飛白記及曾叔祖盧山府君志。名皆列山谷集。惟諸跋世不盡見。此跋尤恢奇。因詳著卷後。永安為河南屬邑。伯祖嘗為之宰云。三晉張縯季長甫。懿文堂書\
  \ \n 王世杰跋 東坡先生此帖。曾罹咸豐八（點去，後補「十」字）年。英法聯軍焚燬圓明園之厄。爾後流入日本。復遇東京空前震火之劫。詳見卷後顏世清。內藤虎兩跋。二次世界戰爭期間。東京都區大半為我盟邦空軍所毀。此帖依然無恙。戰事甫結。予囑友人蹤跡得之。乃購回中土。并記于此。後之人當必益加珍護也。十。民國紀元四十八年（1959）元旦王世杰識于臺北\
  \ \n 内藤虎次郎跋两则 蘇東坡黃州寒食詩卷。引首乾隆帝行書。雪堂餘韻四字。用仿澄心堂紙致佳者。東坡詩黃山谷跋並無名款。山谷跋後。又有董玄宰跋語。張青父清河書畫舫云。東坡草書寒食詩。當屬最勝。卞令之書畫彙考亦已著錄。阮芸臺石渠隨筆云。蘇軾黃州寒食詩墨蹟。卷後有黃魯直跋。為世鴻寶。戲鴻堂所刻止蘇詩黃跋。其後張縯一跋，人未之見其跋云云。彭大司空云。縯跋所謂永安。庭堅為作仁宗皇帝御書記者也。廬山府君乃公裕弟。公邵官通直郎。知廬山縣。張氏世為蜀州江原人。云。出留侯之裔。故以三晉署望也。虎按。卷中埋輪之後印。實係張氏所鈐。又有天曆之寶及孫退谷納蘭容若諸人印記。可以見乾隆以前歷世迭更珍襲之概。乾隆以後授受。則詳于顏韵伯跋中矣。韵伯為顏筱夏方伯子。家世貴盛。大正壬戌（1922）來游江戶時。攜此卷。遂以重價歸菊池君惺堂。癸亥（1923）九月。關東地震。都下燬於火者十六七。菊池氏亦罹災。先世以來收儲。蕩然一空。惺堂躬犯萬死。取此卷及李龍眠瀟湘卷。而免於災。一時傳為佳話。此卷昔脫圓明之災。今復免曠古未有之震火。雖云有神物呵護。抑亦惺堂寶愛之力矣。及惺堂命以跋語為書其事於紙尾。此卷為見存東坡名蹟第一。則張董諸人已道之。張文襄亦稱為海內弟一。見梁節菴題籤。節菴者。文襄門下士也。微特芸臺謂為無上妙品。石渠隨筆評東坡武昌西山詩帖卷云。蘇蹟極多。當以此與黃州寒食詩為無上妙品。可知精金美玉。市有定價云爾。甲子（1924）四月內藤虎書\
  \ \n 予於丁巳（1917）冬嘗觀此卷於燕京書畫展覽會。時為完顏樸孫所藏。震災以後。惺堂寄收予齋中半歲餘。昕夕把玩。益歎觀止。乃磨乾隆御墨。用心太平室純狼毫作此跋。愧不能若東坡。此卷用雞毫弱翰而揮灑自在耳。虎又書\
  \ \n 顏世清跋 東坡寒食帖山谷跋尾。歷元明清。疊經著錄。咸推為蘇書第一。乾隆間歸內府。曾刻入三希堂帖。咸豐庚申（1860）之變。圓明園焚。此卷劫餘。流落人間。帖有燒痕。即其時也。嗣為吾鄉馮展雲所得。馮沒。復歸鬱華閣。展雲伯羲密藏。不以眎人。亦無鈐印跋尾。意園云逝十年始由樸孫完顏都護購得。越六年是為戊午。乃由樸孫轉入寒木堂。此數十年。未經著錄。展轉遞藏之大概也。余恐後來無由知其源委。用特識於卷尾。若夫書之精玅。前人評定第一。斷推古今公論。余復何言。戊午（1918）東坡生日。瓢叟顏之記\
  \ \n 羅振玉跋 先師張文襄公嗜東坡書。光緒壬寅（1920）公建節武昌。客有持此卷請謁。公賞玩不置。謂平生所（點記）蘇書墨迹。以此卷及內府藏榿木詩為第一。客喜甚。言將奉獻。並微露請求意。公曰。時已仲春。貂裘適可付質庫。若以價相讓。當留之。否則不敢受也。客大失望。因求公題識。時方向夕公乃張宴。邀端忠敏。梁文忠。馬季立孝廉與予同賞之。且語眾曰。如此劇跡。不可不一見。明日。物主人將此北歸矣。時物主方在坐。喻公意乃然。請曰。若許加題。當遲行程一二日。公曰。山谷老人謂此書兼魯公少師李西臺之長。某意則得法于北海與魯公。然前人所言。烏可立異矧。文節為東坡老友。某安敢竊議其後。卒不允。主人因請坐中諸人。亦無敢下筆者。客乃惘惘。挾此卷北歸。故兮卷中無公一字。文襄事功昭昭在人耳目。而持躬嚴正。不可干以私。即此一事。已見一斑。此事予在武昌官寺所親見。今重觀此卷。追憶往事。爰書之卷後。以記公之清風亮節。玉當日與諸公並几展觀。情況宛在目前。公與忠敏文忠既先後騎箕天上。季立亦委化。惟頭白門生尚在人世耳。瑰寶重逢。曷勝忻慨。甲子（1924）仲夏。上虞羅振玉書于津沽寓居聱硯齋。見\
  \ \n 郭彝民跋 蘇文忠寒食帖。由顏韻伯以金六萬元售於菊池惺堂。已見內藤跋於龍眠瀟湘圖。係團匪亂流入日本。書估菊池。親屬某以六千元收得。以六萬元轉售於菊池。價差甚鉅。書估菊池俱大非之。幾至興訟。事在菊池購蘇帖之前。前跋誤載此段。今再志。以之存其真。郭彝民又記\
  \ \n 其中，黄庭坚于宋元符三年（1100）阴历九月前为此卷作跋，黄庭坚作跋的字形体之大，甚至超过东坡本文寒食诗。虽自谦无佛处称尊，然实百代争胜，双美并具。 \n 《黄州寒食诗〉 作于元丰五年，书当在此后。诗是东坡自己明显有悲奋感情的文词，字里行间也就随著文词不同的情绪波动，有所节奏变化。就行草书言，字形可大可小，较有自由变化，苏东坡自谓字体\
  \ “短长肥脊各有态”，在这卷书法里字体的大小组合，揖让进退，乃至于如「年、中、葦、紙」诸字，最后一笔直下成一长竖，在布白与行气以至于整篇的章法形成一特殊行间布白。 \n苏轼（1037 年—1101\
  \ 年）于宋仁宗景祐三年十二月十九（1037 年 1 月 8 日）出生于眉州眉山，北宋时著名的文学家、政治家、艺术家。字子瞻，一字和仲，号东坡居士、铁冠道人。世称苏东坡、苏仙、坡仙。宋嘉佑二年进士，累官至端明殿学士兼翰林学士、吏部尚书、兵部尚书、礼部尚书。南宋理学方炽时，加赐谥号文忠，复追赠太师。\
  \ \n 寒食节，亦称禁火节、禁烟节、冷节、百五节，通常是冬至后第 105 日，与清明节日期相近，在清明节前一或二日。清初汤若望《时宪历》订定后，清明与冬至之间的间隔缩短，为了维持寒食节在清明节前一、两日的风俗，民间将寒食节定在清明节一日之前。"
