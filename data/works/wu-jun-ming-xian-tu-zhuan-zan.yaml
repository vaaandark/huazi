id: wu-jun-ming-xian-tu-zhuan-zan
title: 吴郡名贤图传赞
aliases: []
author: 顾沅
dynasty: 清
carrier: beike
holder: 日本内阁文库
rubbing: 清拓本
summary: 沧浪亭是现存历史最为悠久的江南园林。除了沧浪亭外，五百名贤祠内的石刻像最具代表性。清代苏州藏书家顾沅搜罗先贤画像五百余人，由孔继尧摹绘。先是在道光年间重修沧浪亭后，由匠师刻石，嵌入亭旁新建的名贤祠墙壁；光绪九年又附入小传赞辞，编成此《吴郡名贤图传赞》二十卷。
description: "沧浪亭是现存历史最为悠久的江南园林。除了沧浪亭外，五百名贤祠内的石刻像最具代表性。清代苏州藏书家顾沅搜罗先贤画像五百余人，由孔继尧摹绘。先是在道光年间重修沧浪亭后，由匠师刻石，嵌入亭旁新建的名贤祠墙壁；光绪九年又附入小传赞辞，编成此《吴郡名贤图传赞》二十卷。\
  \ \n 苏州建城历史甚早，周武王灭了商朝之后，封仲雍五世孙周章为吴君，建立吴国，吴王阖闾即位后命伍子胥扩建都城，即今之苏州城的前身。秦始皇二十五年平定江南后，在此地设置吴县，隶属于会稽郡，并为会稽郡郡治。东汉顺帝永建四年，析会稽郡另置吴郡。梁朝天监二年改吴郡为吴州，隋文帝开皇九年改吴州为苏州。可见吴郡地区自古以来即是政治上的重要枢纽，当然也是人口、商业、文化荟萃之地，历代名人辈出。\
  \ \n 有关记载此地历代先贤名人的绘像书籍，最早见于《隋书经藉志》，其上记载有《会稽先贤像赞五卷》一书，但今已不传。宋绍兴年中有瞻仪堂官宦图像，也已失传。现今可考者有明朝王世贞「吴中往哲像赞」，但只画明代诸贤至明中叶而已，后来钱榖有所增绘，但增加无多；至清朝时，张蟾补入明朝隆庆、万历、天启、崇祯诸名贤，他所绘之图册后来被郡中彭蕴璨、蒋赓壎两人各藏其半。\
  \ \n 顾沅为了辑印吴郡名贤，在蒐集先贤画像方面的确花费很大的工夫，他首先登门拜访彭、蒋二君，从他们所收藏张蟾补绘的吴中往哲像赞，临摹二百余人，其余则访之先贤后裔、宗祠、塑像、志书以及好古者所收藏，而且都是经过考证者。正如石韫玉在后序中所说「今顾子沅并前所存合而为册，又广蒐博采自周末以至本朝，凡得五百七十人，其像或临自古册，或访得之于各家后裔，其冠服悉仍其旧，均有征信，无一凭虚造者。」\
  \ \n 也因为顾沅的用心篡辑，而且人像描绘皆有依凭，信而有征，经大司寇韩桂舲持向中丞陶澍推荐，得以在沧浪亭旁择地建祠，刻像嵌壁以垂久远。陶澍在序中说「顾生湘舟辑吴郡名贤像凡五百七十人，远征近取都为一册，其用力勤矣。大司寇桂舲韩公持以示余，及梁苣林方伯、陈芝楣观察、李葛峰太守佥谓宜刻石以垂久，备劝励焉。适重修沧浪亭成，因于其旁择地为祠，吾师石琢堂先生选匠氏嵌诸壁已而。」\
  \ \n 清刊本 清拓本 \n 《吴郡名贤图传赞》是清道光时期长洲顾沅所辑刻吴郡自周朝以至清代先贤之图，全书分二十卷共收录五百七十人，画像出自孔继尧之手。这部书除了画像及小传之外，顾沅还用心的为每一位先贤写下四句赞语。此本为清道光九年长洲顾氏刊本。\
  \ \n 该书所收名贤，有籍贯属于吴郡（其称吴郡者，即今之苏州，古称句吴、吴州、吴郡、平江等。而苏州自古以来也另有别称，吴都、吴门、东吴、吴中、吴下、姑苏、长洲等均是）者，也有做官及流寓吴地者。既有名宦乡贤，亦多文人学士。如汉代的董仲舒，三国的陆绩，晋代的陆机、陆云，南朝的皇侃、顾野王、隋朝陆德明、唐代的归崇敬、陆贽、刘禹锡、陆龟蒙，宋代的范仲淹、胡瑗、欧阳修、司马光、朱长文、叶梦得、魏了翁、文天祥，元代的杨维桢、倪瓒，明代的况钟、祝允明、王世贞、海瑞、顾宪成、高攀龙，清代的顾炎武、徐乾学、陆陇其、朱彝尊、徐元文、彭定求、张伯行、惠栋、钱大昕、江声等人，既为名士，又为名儒。\
  \ \n 每一位先贤传记事蹟的蒐集，必须博采相关资料汇集而成。顾沅在「例言」里说「凡郡邑志传，各随事迹繁简，篇幅互有短长，是传事实一从简明。前人各传中，于年寿第宅祠墓往往略而弗载，兹广搜志铭传记以补其阙。先贤事实，自史传志传之外，嘉言懿行散见载藉及遗老传闻，于有关掌故者，本传之后略志一二以广见闻。」\
  \ \n 汤金钊序、朱珔序、陶澍序、梁章钜序、后序：石韫玉撰 \n例言、参阅姓氏、沧浪亭明贤祠图、总目 \n 卷一：吴季札至白居易 \n卷二：李德裕至张选 \n卷三：滕茂实至宋通 \n卷四：周寿谊至刘铉\
  \ \n卷五：夏原吉至李甡 \n卷六：孔镛至张安甫 \n卷七：祝允明至顾昺 \n卷八：陈齁至文嘉 \n卷九：盛赉汝至顾章志 \n卷十：袁一虬至邹泉 \n卷十一：吴尚俭至顾云鸿 \n卷十二：周祝至程嘉燧\
  \ \n卷十三：龚元祥至赵荫 \n卷十四：徐汧至胡甲桂 \n卷十五：沈云祚至王湛 \n卷十六：归昌世至王育 \n卷十七：王时敏至王士祯 \n卷十八：彭珑至允肃 \n卷十九：宋荦至鄂尔泰 \n卷二十：尹继善至唐仲冕\
  \ \n 卷前题： 長洲顧沅湘舟輯 \n 顾沅 （1799～1851）清代学者、藏书家。字澧兰，号湘舟，又自号沧浪渔父，江苏长洲（今苏州）人。道光间官教谕，收藏金石、书籍甚富，颇多秘本、善本，建怀古书屋、艺海楼庋藏载籍。辑有《赐砚堂丛书》《古圣贤像传略》等。\
  \ \n 刊印信息 清道光九年（己丑 1829）长洲顾氏刊本"
