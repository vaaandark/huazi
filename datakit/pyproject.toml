[project]
name = "huazi-datakit"
version = "0.1.0"
description = "数据构建工具：采集碑帖元数据、校验、打包成 app 内置 SQLite"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pillow>=10.0",
]

[project.scripts]
huazi-data = "huazi_datakit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/huazi_datakit"]
